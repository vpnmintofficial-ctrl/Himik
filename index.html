<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6c5ce7">
<title>dox•Tox</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --card2: #12151f;
    --border: #2a2e3b; --accent: #6c5ce7; --accent2: #a29bfe;
    --text: #e8eaf0; --muted: #9ba3b5;
    --success: #00b894; --danger: #ff6b6b; --warn: #fdcb6e;
    --radius: 14px; --shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  body.light {
    --bg: #f0f2f7; --card: #ffffff; --card2: #f7f8fc;
    --border: #e1e5ee; --text: #1a1d27; --muted: #6b7280;
    --shadow: 0 10px 30px rgba(0,0,0,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--card2); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

  #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9998; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .toast { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 10px; padding: 14px 18px; min-width: 260px; max-width: 360px; box-shadow: var(--shadow); animation: slideInRight 0.3s ease; pointer-events: auto; }
  .toast.success { border-left-color: var(--success); }
  .toast.error { border-left-color: var(--danger); }
  .toast.warn { border-left-color: var(--warn); }
  .toast-title { font-weight: 600; margin-bottom: 4px; font-size: 0.95rem; }
  .toast-msg { font-size: 0.85rem; color: var(--muted); }
  @keyframes slideInRight { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(120%); opacity: 0; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: radial-gradient(ellipse at top, #1e2235 0%, var(--bg) 70%); }
  body.light #auth-screen { background: radial-gradient(ellipse at top, #e8ebf5 0%, var(--bg) 70%); }
  .auth-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 460px; padding: 36px 32px; box-shadow: var(--shadow); animation: slideUp 0.5s ease; }
  .auth-box h1 { text-align: center; font-size: 1.7rem; margin-bottom: 8px; }
  .auth-sub { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 10px; }
  .auth-tabs { display: flex; gap: 8px; margin: 24px 0 20px; }
  .auth-tabs button { flex: 1; padding: 10px; border: none; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; font-size: 0.95rem; font-family: inherit; }
  .auth-tabs button.active { background: var(--accent); color: white; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card2); color: var(--text); font-size: 1rem; outline: none; font-family: inherit; }
  .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn { padding: 12px 20px; border: none; border-radius: 10px; background: var(--accent); color: white; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn:hover { background: #5a4bd1; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-block { width: 100%; margin-top: 8px; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-danger { background: var(--danger); }
  .btn-success { background: var(--success); }
  .btn-sm { padding: 6px 12px; font-size: 0.85rem; }
  .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 10px; text-align: center; display: none; }

  #forum-screen { display: none; max-width: 1000px; margin: 0 auto; padding: 20px 16px 80px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; position: sticky; top: 0; background: var(--bg); padding: 12px 0; z-index: 100; border-bottom: 1px solid var(--border); }
  .logo { font-size: 1.4rem; font-weight: 700; color: var(--accent2); cursor: pointer; }
  .header-right { display: flex; align-items: center; gap: 10px; position: relative; }
  .icon-btn { background: none; border: none; color: var(--muted); font-size: 1rem; cursor: pointer; padding: 8px 10px; border-radius: 8px; font-family: inherit; font-weight: 500; position: relative; }
  .icon-btn:hover { background: var(--border); color: var(--text); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; color: white; cursor: pointer; overflow: hidden; background-size: cover; position: relative; flex-shrink: 0; }
  .username { font-weight: 600; cursor: pointer; }
  .dropdown { position: absolute; top: 52px; right: 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 260px; padding: 8px 0; box-shadow: var(--shadow); display: none; z-index: 200; }
  .dropdown.show { display: block; }
  .dropdown-item { padding: 10px 18px; cursor: pointer; display: flex; justify-content: space-between; font-size: 0.95rem; align-items: center; }
  .dropdown-item:hover { background: var(--card2); }
  .dropdown-divider { height: 1px; background: var(--border); margin: 6px 0; }
  .dropdown-header { padding: 8px 18px 4px; font-size: 0.72rem; color: var(--muted); text-transform: uppercase; font-weight: 600; }

  .tabs { display: flex; gap: 4px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
  .tab { padding: 9px 16px; border-radius: 10px; background: var(--card); color: var(--muted); cursor: pointer; font-weight: 500; font-size: 0.9rem; white-space: nowrap; border: 1px solid var(--border); font-family: inherit; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: white; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .search-box { flex: 1; min-width: 220px; }
  .search-box input { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 0.95rem; outline: none; font-family: inherit; }

  .post { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
  .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .post-header .avatar { width: 38px; height: 38px; font-size: 0.95rem; }
  .post-meta { flex: 1; min-width: 0; }
  .post-author { font-weight: 600; font-size: 0.95rem; cursor: pointer; }
  .post-time { font-size: 0.78rem; color: var(--muted); }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius); }
  .empty-title { font-size: 1.1rem; margin-bottom: 6px; color: var(--text); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(4px); }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 26px 24px; position: relative; }

  .modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; z-index: 5; }

  #chat-modal .modal { max-width: 820px; padding: 0; overflow: hidden; display: flex; flex-direction: column; height: 85vh; }
  .chat-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 22px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .chat-body { flex: 1; display: flex; min-height: 0; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 4px; }
  .chat-sidebar { width: 220px; border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; background: var(--card2); flex-shrink: 0; }
  .chat-sidebar h4 { margin-bottom: 12px; font-size: 0.85rem; color: var(--muted); text-transform: uppercase; }
  .chat-user-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; }
  .chat-user-item:hover { background: var(--card); }
  .chat-user-item .avatar { width: 28px; height: 28px; font-size: 0.75rem; }
  .chat-day-divider { text-align: center; margin: 14px 0 8px; }
  .chat-day-divider span { background: var(--card2); color: var(--muted); font-size: 0.75rem; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); }
  .chat-message { display: flex; gap: 10px; padding: 6px 0; position: relative; }
  .chat-message.mine { flex-direction: row-reverse; }
  .chat-message.pending { opacity: 0.65; }
  .chat-message.failed .chat-message-bubble { border-color: var(--danger) !important; }
  .chat-message .avatar { width: 36px; height: 36px; font-size: 0.85rem; flex-shrink: 0; }
  .chat-message-body { max-width: 70%; min-width: 0; }
  .chat-message.mine .chat-message-body { align-items: flex-end; display: flex; flex-direction: column; }
  .chat-message-head { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; font-size: 0.78rem; }
  .chat-message.mine .chat-message-head { flex-direction: row-reverse; }
  .chat-message-author { font-weight: 600; color: var(--accent2); cursor: pointer; font-size: 0.85rem; }
  .chat-message-time { color: var(--muted); font-size: 0.72rem; }
  .chat-message-status { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  .chat-message-bubble { background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; font-size: 0.9rem; word-break: break-word; white-space: pre-wrap; }
  .chat-message.mine .chat-message-bubble { background: var(--accent); border-color: var(--accent); color: white; }
  .chat-input-area { border-top: 1px solid var(--border); padding: 12px 18px; background: var(--card); flex-shrink: 0; }
  .chat-input-row { display: flex; gap: 10px; align-items: flex-end; }
  .chat-input-row textarea { flex: 1; min-height: 40px; max-height: 120px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card2); color: var(--text); font-size: 0.95rem; font-family: inherit; resize: none; outline: none; }
  .chat-status { font-size: 0.78rem; color: var(--muted); padding: 4px 0 0 2px; min-height: 18px; }

  @media (max-width: 700px) {
    .chat-sidebar { display: none; }
    .chat-message-body { max-width: 85%; }
    #chat-modal .modal { height: 92vh; }
    .form-row { grid-template-columns: 1fr; }
    .username { display: none; }
  }
</style>
</head>
<body>

<div id="toast-container"></div>

<!-- АВТОРИЗАЦИЯ -->
<div id="auth-screen">
  <div class="auth-box">
    <h1>dox•Tox</h1>
    <p class="auth-sub">Обмен сообщениями через Telegram</p>

    <div class="auth-tabs">
      <button class="active" id="tab-login" onclick="switchTab('login')">Вход</button>
      <button id="tab-register" onclick="switchTab('register')">Регистрация</button>
    </div>

    <div id="login-form">
      <div class="form-group"><label>Имя</label><input type="text" id="login-name" placeholder="Введите имя" autocomplete="username"></div>
      <div class="form-group"><label>Пароль</label><input type="password" id="login-pass" placeholder="Введите пароль" autocomplete="current-password"></div>
      <button class="btn btn-block" id="login-btn" onclick="doLogin()">Войти</button>
      <div class="error-msg" id="login-error"></div>
    </div>

    <div id="register-form" style="display:none;">
      <div class="form-group"><label>Имя</label><input type="text" id="reg-name" placeholder="Придумайте имя" autocomplete="username"></div>
      <div class="form-row">
        <div class="form-group"><label>Пароль</label><input type="password" id="reg-pass" placeholder="Минимум 8 символов" autocomplete="new-password"></div>
        <div class="form-group"><label>Повторите</label><input type="password" id="reg-pass2" placeholder="Повтор" autocomplete="new-password"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Telegram ID</label><input type="number" id="reg-tg" placeholder="123456789"></div>
        <div class="form-group"><label>Город</label><input type="text" id="reg-city" placeholder="Город"></div>
      </div>
      <button class="btn btn-block" id="reg-btn" onclick="doRegister()">Зарегистрироваться</button>
      <div class="error-msg" id="reg-error"></div>
    </div>
  </div>
</div>

<!-- ФОРУМ -->
<div id="forum-screen">
  <header>
    <div class="logo" onclick="switchTabFeed('all')">dox•Tox</div>
    <div class="header-right">
      <button class="icon-btn" onclick="openChat()">💬 Чат</button>
      <button class="icon-btn" id="theme-btn" onclick="toggleTheme()">Светлая</button>
      <div class="avatar" id="current-avatar" onclick="toggleMenu(event)">?</div>
      <span class="username" id="current-user" onclick="toggleMenu(event)">Гость</span>

      <div class="dropdown" id="dropdown">
        <div class="dropdown-header">Аккаунт</div>
        <div class="dropdown-item" onclick="showProfile(ls_get(STORAGE.session))"><span>Мой профиль</span></div>
        <div class="dropdown-divider"></div>
        <div class="dropdown-item" style="color:var(--danger);" onclick="logout()"><span>Выйти</span></div>
      </div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="all" onclick="switchTabFeed('all')">Все</button>
    <button class="tab" data-tab="users" onclick="switchTabFeed('users')">Пользователи</button>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Поиск пользователей..." oninput="renderFeed()">
    </div>
  </div>

  <div id="feed"></div>
</div>

<!-- МОДАЛКА ЧАТА -->
<div class="modal-overlay" id="chat-modal" onclick="closeModalOnBg(event,'chat-modal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="chat-header">
      <div>
        <h2>Общий чат</h2>
        <div id="chat-online-count" style="font-size:0.8rem; color:var(--muted);">Онлайн</div>
      </div>
      <button class="modal-close" onclick="closeChat()">×</button>
    </div>
    <div class="chat-body">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-sidebar">
        <h4>Участники</h4>
        <div id="chat-users-list"></div>
      </div>
    </div>
    <div class="chat-input-area">
      <div class="chat-input-row">
        <textarea id="chat-input" placeholder="Написать сообщение..." rows="1"></textarea>
        <button class="btn btn-success" id="send-btn" onclick="sendChatMessage()">Отправить</button>
      </div>
      <div class="chat-status" id="chat-status"></div>
    </div>
  </div>
</div>

<!-- МОДАЛКА ПРОФИЛЯ -->
<div class="modal-overlay" id="profile-modal" onclick="closeModalOnBg(event,'profile-modal')">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal('profile-modal')">×</button>
    <div id="profile-content"></div>
  </div>
</div>

<script>
/* ===================== КОНФИГ ===================== */
const API = 'https://dox-toxx.onrender.com';

const STORAGE = {
  session: 'doxtox_user',
  tg: 'doxtox_tg',
  chat: 'forum_chat_db',
  users: 'forum_users_db',
  theme: 'forum_theme'
};

/* ===================== УТИЛИТЫ ===================== */
function ls_get(k, def) {
  try {
    const v = localStorage.getItem(k);
    return v ? JSON.parse(v) : def;
  } catch {
    return def;
  }
}
function ls_set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
function ls_del(k) { localStorage.removeItem(k); }

function getUsers() { return ls_get(STORAGE.users, {}); }
function saveUsers(u) { ls_set(STORAGE.users, u); }
function getChat() { return ls_get(STORAGE.chat, []); }
function saveChat(c) { ls_set(STORAGE.chat, c); }

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text == null ? '' : String(text);
  return div.innerHTML;
}

function toast(title, msg, type) {
  type = type || 'info';
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = '<div class="toast-title">' + escapeHtml(title) + '</div>' +
    (msg ? '<div class="toast-msg">' + escapeHtml(msg) + '</div>' : '');
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => {
    t.style.animation = 'slideOutRight 0.3s forwards';
    setTimeout(() => t.remove(), 300);
  }, 3200);
}

function showError(id, msg) {
  const el = document.getElementById(id);
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}
function hideError(id) {
  const el = document.getElementById(id);
  if (el) { el.textContent = ''; el.style.display = 'none'; }
}

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function closeModalOnBg(e, id) { if (e.target.id === id) closeModal(id); }

function setChatStatus(text, isError) {
  const el = document.getElementById('chat-status');
  if (!el) return;
  el.textContent = text || '';
  el.style.color = isError ? 'var(--danger)' : 'var(--muted)';
}

/* ===================== АВТОРИЗАЦИЯ ===================== */
function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
  hideError('login-error');
  hideError('reg-error');
}

async function doRegister() {
  hideError('reg-error');
  const name = document.getElementById('reg-name').value.trim();
  const pass = document.getElementById('reg-pass').value;
  const pass2 = document.getElementById('reg-pass2').value;
  const tgId = parseInt(document.getElementById('reg-tg').value, 10);
  const city = document.getElementById('reg-city').value.trim();
  const btn = document.getElementById('reg-btn');

  if (!name || name.length < 2) return showError('reg-error', 'Имя минимум 2 символа');
  if (pass.length < 8) return showError('reg-error', 'Пароль минимум 8 символов');
  if (pass !== pass2) return showError('reg-error', 'Пароли не совпадают');
  if (!tgId || isNaN(tgId)) return showError('reg-error', 'Нужен Telegram ID');

  btn.disabled = true;
  btn.textContent = 'Регистрация...';

  try {
    const res = await fetch(API + '/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: name, password: pass, tg_id: tgId, city })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || data.message || 'Ошибка сервера');

    ls_set(STORAGE.session, name);
    ls_set(STORAGE.tg, tgId);

    const users = getUsers();
    users[name.toLowerCase()] = { name, city: city || '—', lastSeen: Date.now() };
    saveUsers(users);

    toast('Успех', 'Добро пожаловать, ' + name, 'success');
    showForum(name);
  } catch (e) {
    showError('reg-error', 'Ошибка: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Зарегистрироваться';
  }
}

async function doLogin() {
  hideError('login-error');
  const name = document.getElementById('login-name').value.trim();
  const pass = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');

  if (!name || !pass) return showError('login-error', 'Заполни поля');

  btn.disabled = true;
  btn.textContent = 'Вход...';

  try {
    const res = await fetch(API + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: name, password: pass })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || data.message || 'Неверный логин или пароль');

    const username = data.username || name;
    ls_set(STORAGE.session, username);
    if (data.tg_id) ls_set(STORAGE.tg, data.tg_id);

    const users = getUsers();
    if (!users[username.toLowerCase()]) {
      users[username.toLowerCase()] = {
        name: username,
        city: data.city || '—',
        lastSeen: Date.now()
      };
      saveUsers(users);
    }

    toast('Успех', 'Привет, ' + username, 'success');
    showForum(username);
  } catch (e) {
    showError('login-error', 'Ошибка: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Войти';
  }
}

function logout() {
  if (!confirm('Выйти?')) return;
  closeChat();
  ls_del(STORAGE.session);
  ls_del(STORAGE.tg);
  document.getElementById('forum-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}

function showForum(username) {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('forum-screen').style.display = 'block';
  document.getElementById('current-user').textContent = username;
  document.getElementById('current-avatar').textContent = username[0] ? username[0].toUpperCase() : '?';
  renderFeed();
}

/* ===================== ФОРУМ / ЛЕНТА ===================== */
let currentTab = 'all';

function switchTabFeed(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderFeed();
}

function renderFeed() {
  const feed = document.getElementById('feed');
  const q = (document.getElementById('search-input').value || '').trim().toLowerCase();

  if (currentTab === 'users') {
    const users = getUsers();
    let list = Object.values(users);
    if (q) list = list.filter(u => (u.name || '').toLowerCase().includes(q) || (u.city || '').toLowerCase().includes(q));

    if (list.length === 0) {
      feed.innerHTML = '<div class="empty"><div class="empty-title">Нет пользователей</div></div>';
      return;
    }

    feed.innerHTML = list.map(u => `
      <div class="post" onclick="showProfile('${escapeHtml(u.name)}')">
        <div class="post-header">
          <div class="avatar">${(u.name || '?')[0].toUpperCase()}</div>
          <div class="post-meta">
            <div class="post-author">${escapeHtml(u.name)}</div>
            <div class="post-time">${escapeHtml(u.city || '—')}</div>
          </div>
        </div>
      </div>
    `).join('');
    return;
  }

  feed.innerHTML = '<div class="empty"><div class="empty-title">Пока нет публикаций</div><p style="margin-top:6px;font-size:0.9rem;">Открой чат и напиши первое сообщение</p></div>';
}

function toggleMenu(e) {
  if (e) e.stopPropagation();
  document.getElementById('dropdown').classList.toggle('show');
}
document.addEventListener('click', () => {
  const d = document.getElementById('dropdown');
  if (d) d.classList.remove('show');
});

/* ===================== ЧАТ ===================== */
let chatInterval = null;
let isLoadingChat = false;
let lastKnownMsgCount = 0;

/** Нормализация любого формата сообщения с сервера / локального */
function normalizeMessage(m) {
  if (!m || typeof m !== 'object') return null;

  const author = m.author || m.from_username || m.username || m.user || m.from || 'User';
  const text = m.text != null ? String(m.text) : (m.message != null ? String(m.message) : (m.content != null ? String(m.content) : ''));
  if (!text.trim()) return null;

  let time = null;
  if (typeof m.time === 'number') {
    time = m.time > 1e12 ? m.time : m.time * 1000; // sec → ms
  } else if (typeof m.created_at === 'number') {
    time = m.created_at > 1e12 ? m.created_at : m.created_at * 1000;
  } else if (m.timestamp) {
    time = new Date(m.timestamp).getTime();
  } else if (m.date) {
    time = new Date(m.date).getTime();
  }
  if (!time || isNaN(time)) time = Date.now();

  return {
    id: m.id || m._id || m.message_id || ('local_' + time + '_' + Math.random().toString(36).slice(2, 7)),
    author: String(author),
    from_username: String(author),
    text: text,
    time: time,
    created_at: Math.floor(time / 1000),
    status: m.status || 'sent' // pending | sent | failed
  };
}

function mergeMessages(serverMsgs, localPending) {
  const map = new Map();

  // Сначала серверные
  (serverMsgs || []).forEach(raw => {
    const m = normalizeMessage(raw);
    if (!m) return;
    // ключ: автор + текст + приблизительное время (±5 сек)
    const key = m.author.toLowerCase() + '|' + m.text + '|' + Math.floor(m.time / 5000);
    map.set(key, m);
  });

  // Добавляем локальные pending/failed, которых ещё нет на сервере
  (localPending || []).forEach(raw => {
    const m = normalizeMessage(raw);
    if (!m) return;
    if (m.status === 'pending' || m.status === 'failed') {
      const key = m.author.toLowerCase() + '|' + m.text + '|' + Math.floor(m.time / 5000);
      if (!map.has(key)) map.set(key, m);
    }
  });

  return Array.from(map.values()).sort((a, b) => a.time - b.time);
}

function openChat() {
  if (!ls_get(STORAGE.session)) {
    toast('Ошибка', 'Сначала войди в аккаунт', 'error');
    return;
  }
  openModal('chat-modal');
  renderChat();
  loadChatFromServer(true);
  if (chatInterval) clearInterval(chatInterval);
  chatInterval = setInterval(() => loadChatFromServer(false), 3000);
  setTimeout(() => {
    const inp = document.getElementById('chat-input');
    if (inp) inp.focus();
  }, 150);
}

function closeChat() {
  closeModal('chat-modal');
  if (chatInterval) {
    clearInterval(chatInterval);
    chatInterval = null;
  }
  setChatStatus('');
}

async function fetchJson(url, options, timeoutMs) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), timeoutMs || 20000);
  try {
    const res = await fetch(url, { ...options, signal: controller.signal });
    clearTimeout(timeout);
    const data = await res.json().catch(() => ({}));
    return { res, data };
  } catch (e) {
    clearTimeout(timeout);
    throw e;
  }
}

/** Загрузка общего чата: API хранит только личные переписки.
 *  Сообщения в "общий чат" идут на пользователя all.
 *  Собираем все переписки all <-> каждый пользователь. */
async function loadChatFromServer(showLoading) {
  if (isLoadingChat) return;
  isLoadingChat = true;

  if (showLoading) setChatStatus('Загрузка сообщений...');

  try {
    // 1. Список пользователей
    const { res: usersRes, data: usersData } = await fetchJson(API + '/users', {
      headers: { 'Accept': 'application/json' }
    }, 20000);

    let userList = [];
    if (usersRes.ok && Array.isArray(usersData)) {
      userList = usersData.map(u => u.username || u.name).filter(Boolean);
      // обновляем локальную базу
      const localUsers = getUsers();
      usersData.forEach(u => {
        const name = u.username || u.name;
        if (!name || name.toLowerCase() === 'all') return;
        localUsers[name.toLowerCase()] = {
          name,
          city: u.city || '—',
          lastSeen: Date.now()
        };
      });
      saveUsers(localUsers);
    }

    // 2. Для каждого пользователя забираем сообщения с "all"
    const allMsgs = [];
    const seenIds = new Set();

    const targets = userList.filter(n => n.toLowerCase() !== 'all');
    // параллельно, но небольшими пачками
    const chunkSize = 5;
    for (let i = 0; i < targets.length; i += chunkSize) {
      const chunk = targets.slice(i, i + chunkSize);
      const results = await Promise.all(chunk.map(async (uname) => {
        try {
          const { res, data } = await fetchJson(
            API + '/messages?user=all&with_user=' + encodeURIComponent(uname),
            { headers: { 'Accept': 'application/json' } },
            15000
          );
          if (res.ok && Array.isArray(data)) return data;
        } catch (_) {}
        return [];
      }));
      results.flat().forEach(m => {
        if (!m) return;
        const id = m.id != null ? String(m.id) : null;
        if (id && seenIds.has(id)) return;
        if (id) seenIds.add(id);
        allMsgs.push(m);
      });
    }

    const local = getChat();
    const pending = local.filter(m => m.status === 'pending' || m.status === 'failed');
    const merged = mergeMessages(allMsgs, pending);

    saveChat(merged);
    lastKnownMsgCount = merged.length;
    renderChat();
    updateChatUsers(merged);
    setChatStatus(merged.length ? '' : 'Нет сообщений');
  } catch (e) {
    const isAbort = e.name === 'AbortError';
    setChatStatus(isAbort ? 'Сервер долго отвечает...' : 'Нет связи с сервером', true);
    renderChat();
  } finally {
    isLoadingChat = false;
  }
}

function renderChat() {
  const chat = getChat();
  const session = ls_get(STORAGE.session);
  const container = document.getElementById('chat-messages');
  if (!container) return;

  if (!chat || chat.length === 0) {
    container.innerHTML = '<div style="text-align:center; color:var(--muted); padding:40px 20px;">Нет сообщений<br><span style="font-size:0.85rem;">Напиши первым!</span></div>';
    return;
  }

  let lastDay = '';
  let html = '';
  const wasNearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 80;

  chat.forEach(m => {
    const norm = normalizeMessage(m);
    if (!norm) return;

    const d = new Date(norm.time);
    const dayKey = d.toDateString();
    if (dayKey !== lastDay) {
      html += `<div class="chat-day-divider"><span>${d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })}</span></div>`;
      lastDay = dayKey;
    }

    const isMine = (norm.author || '').toLowerCase() === (session || '').toLowerCase();
    const timeStr = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const statusClass = norm.status === 'pending' ? 'pending' : (norm.status === 'failed' ? 'failed' : '');
    let statusText = '';
    if (norm.status === 'pending') statusText = 'отправляется...';
    else if (norm.status === 'failed') statusText = 'не отправлено';

    html += `
      <div class="chat-message ${isMine ? 'mine' : ''} ${statusClass}" data-id="${escapeHtml(String(norm.id))}">
        <div class="avatar">${(norm.author || '?')[0].toUpperCase()}</div>
        <div class="chat-message-body">
          <div class="chat-message-head">
            <span class="chat-message-author" onclick="showProfile('${escapeHtml(norm.author)}')">${escapeHtml(norm.author)}</span>
            <span class="chat-message-time">${timeStr}</span>
          </div>
          <div class="chat-message-bubble">${escapeHtml(norm.text)}</div>
          ${statusText ? `<div class="chat-message-status">${statusText}</div>` : ''}
        </div>
      </div>`;
  });

  container.innerHTML = html;

  // Скролл вниз, если пользователь был внизу или это первое открытие
  if (wasNearBottom || chat.length !== lastKnownMsgCount) {
    container.scrollTop = container.scrollHeight;
  }
}

function updateChatUsers(messages) {
  const list = document.getElementById('chat-users-list');
  const countEl = document.getElementById('chat-online-count');
  if (!list) return;

  const names = new Map();
  (messages || getChat()).forEach(m => {
    const n = normalizeMessage(m);
    if (n && n.author) names.set(n.author.toLowerCase(), n.author);
  });

  // Добавляем текущего пользователя
  const session = ls_get(STORAGE.session);
  if (session) names.set(session.toLowerCase(), session);

  // Добавляем из локальной базы пользователей
  Object.values(getUsers()).forEach(u => {
    if (u.name) names.set(u.name.toLowerCase(), u.name);
  });

  const arr = Array.from(names.values()).sort((a, b) => a.localeCompare(b, 'ru'));
  if (countEl) countEl.textContent = arr.length + ' участников';

  list.innerHTML = arr.map(name => `
    <div class="chat-user-item" onclick="showProfile('${escapeHtml(name)}')">
      <div class="avatar">${name[0].toUpperCase()}</div>
      <span style="font-size:0.9rem; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(name)}</span>
    </div>
  `).join('');
}

async function sendChatMessage() {
  const inp = document.getElementById('chat-input');
  const btn = document.getElementById('send-btn');
  const text = (inp.value || '').trim();
  const session = ls_get(STORAGE.session);

  if (!text || !session) return;
  if (text.length > 2000) {
    toast('Слишком длинно', 'Максимум 2000 символов', 'warn');
    return;
  }

  inp.value = '';
  inp.style.height = 'auto';
  btn.disabled = true;

  const tempId = 'temp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
  const tempMsg = {
    id: tempId,
    author: session,
    from_username: session,
    text: text,
    time: Date.now(),
    created_at: Math.floor(Date.now() / 1000),
    status: 'pending'
  };

  const chat = getChat();
  chat.push(tempMsg);
  saveChat(chat);
  renderChat();
  setChatStatus('Отправка...');

  try {
    const { res, data } = await fetchJson(API + '/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        from_username: session,
        to_username: 'all',
        text: text
      })
    }, 30000);

    if (!res.ok) {
      const detail = (data && (data.detail || data.message)) || ('Ошибка ' + res.status);
      // Аккаунт не существует на этом сервере
      if (String(detail).toLowerCase().includes('отправитель') || res.status === 404) {
        throw new Error('Аккаунт не найден на сервере. Выйди и зарегистрируйся заново.');
      }
      if (String(detail).toLowerCase().includes('получатель')) {
        throw new Error('Комната чата недоступна. Попробуй позже.');
      }
      throw new Error(detail);
    }

    const updated = getChat().map(m => m.id === tempId ? { ...m, status: 'sent', id: data.id || m.id } : m);
    saveChat(updated);

    await new Promise(r => setTimeout(r, 300));
    await loadChatFromServer(false);
    setChatStatus('');
  } catch (e) {
    const updated = getChat().map(m => m.id === tempId ? { ...m, status: 'failed' } : m);
    saveChat(updated);
    renderChat();

    const msg = e.name === 'AbortError'
      ? 'Сервер не ответил'
      : (e.message || 'Не удалось отправить');
    setChatStatus(msg, true);
    toast('Ошибка отправки', msg, 'error');
  } finally {
    btn.disabled = false;
    const focusInp = document.getElementById('chat-input');
    if (focusInp) focusInp.focus();
  }
}

/* ===================== ПРОФИЛЬ ===================== */
function showProfile(username) {
  if (!username) return;
  closeModal('dropdown');
  const users = getUsers();
  const u = users[String(username).toLowerCase()] || { name: username, city: '—' };

  document.getElementById('profile-content').innerHTML = `
    <div style="text-align:center; padding:20px 10px;">
      <div class="avatar" style="width:80px;height:80px;margin:0 auto 15px; font-size:2rem;">${(u.name || '?')[0].toUpperCase()}</div>
      <h2 style="margin-bottom:5px;">${escapeHtml(u.name)}</h2>
      <p style="color:var(--muted);">${escapeHtml(u.city || '—')}</p>
    </div>`;
  openModal('profile-modal');
}

/* ===================== ТЕМА ===================== */
function toggleTheme() {
  document.body.classList.toggle('light');
  const isLight = document.body.classList.contains('light');
  localStorage.setItem(STORAGE.theme, isLight ? 'light' : 'dark');
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = isLight ? 'Тёмная' : 'Светлая';
}

/* ===================== СТАРТ ===================== */
window.onload = function () {
  if (localStorage.getItem(STORAGE.theme) === 'light') {
    document.body.classList.add('light');
    const btn = document.getElementById('theme-btn');
    if (btn) btn.textContent = 'Тёмная';
  }

  const session = ls_get(STORAGE.session);
  if (session) showForum(session);
};

document.addEventListener('DOMContentLoaded', () => {
  const ci = document.getElementById('chat-input');
  if (ci) {
    ci.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChatMessage();
      }
    });
    // авто-высота textarea
    ci.addEventListener('input', () => {
      ci.style.height = 'auto';
      ci.style.height = Math.min(ci.scrollHeight, 120) + 'px';
    });
  }

  const loginPass = document.getElementById('login-pass');
  if (loginPass) loginPass.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  const regPass2 = document.getElementById('reg-pass2');
  if (regPass2) regPass2.addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
});
