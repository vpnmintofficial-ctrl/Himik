<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6c5ce7">
<title>dox•Tox</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --card2: #12151f;
    --border: #2a2e3b; --accent: #6c5ce7; --accent2: #a29bfe;
    --text: #e8eaf0; --muted: #9ba3b5;
    --success: #00b894; --danger: #ff6b6b; --warn: #fdcb6e;
    --radius: 14px; --shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  body.light {
    --bg: #f0f2f7; --card: #ffffff; --card2: #f7f8fc;
    --border: #e1e5ee; --text: #1a1d27; --muted: #6b7280;
    --shadow: 0 10px 30px rgba(0,0,0,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--card2); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9998; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .toast { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 10px; padding: 14px 18px; min-width: 260px; max-width: 360px; box-shadow: var(--shadow); animation: slideInRight 0.3s ease; pointer-events: auto; }
  .toast.success { border-left-color: var(--success); }
  .toast.error { border-left-color: var(--danger); }
  .toast.warn { border-left-color: var(--warn); }
  .toast-title { font-weight: 600; margin-bottom: 4px; font-size: 0.95rem; }
  .toast-msg { font-size: 0.85rem; color: var(--muted); }
  @keyframes slideInRight { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(120%); opacity: 0; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: radial-gradient(ellipse at top, #1e2235 0%, var(--bg) 70%); }
  body.light #auth-screen { background: radial-gradient(ellipse at top, #e8ebf5 0%, var(--bg) 70%); }
  .auth-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 460px; padding: 36px 32px; box-shadow: var(--shadow); animation: slideUp 0.5s ease; }
  .auth-box h1 { text-align: center; font-size: 1.7rem; margin-bottom: 8px; }
  .auth-sub { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 10px; }
  .auth-tabs { display: flex; gap: 8px; margin: 24px 0 20px; }
  .auth-tabs button { flex: 1; padding: 10px; border: none; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; font-size: 0.95rem; font-family: inherit; }
  .auth-tabs button.active { background: var(--accent); color: white; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .form-group input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card2); color: var(--text); font-size: 1rem; outline: none; font-family: inherit; }
  .form-group input:focus { border-color: var(--accent); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn { padding: 12px 20px; border: none; border-radius: 10px; background: var(--accent); color: white; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; }
  .btn:hover { background: #5a4bd1; }
  .btn-block { width: 100%; margin-top: 8px; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-secondary:hover { background: var(--border); }
  .btn-danger { background: var(--danger); }
  .btn-success { background: var(--success); }
  .btn-sm { padding: 6px 12px; font-size: 0.85rem; }
  .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 10px; text-align: center; display: none; }

  #forum-screen { display: none; max-width: 1000px; margin: 0 auto; padding: 20px 16px 80px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; position: sticky; top: 0; background: var(--bg); padding: 12px 0; z-index: 100; border-bottom: 1px solid var(--border); }
  .logo { font-size: 1.4rem; font-weight: 700; color: var(--accent2); cursor: pointer; }
  .header-right { display: flex; align-items: center; gap: 10px; position: relative; }
  .icon-btn { background: none; border: none; color: var(--muted); font-size: 1rem; cursor: pointer; padding: 8px 10px; border-radius: 8px; transition: 0.2s; font-family: inherit; font-weight: 500; }
  .icon-btn:hover { background: var(--border); color: var(--text); }
  .badge-dot { position: absolute; top: 4px; right: 4px; background: var(--danger); color: white; border-radius: 10px; padding: 1px 6px; font-size: 0.7rem; font-weight: 700; min-width: 16px; text-align: center; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; color: white; cursor: pointer; transition: 0.2s; overflow: hidden; background-size: cover; position: relative; flex-shrink: 0; }
  .avatar:hover { transform: scale(1.05); }
  .username { font-weight: 600; cursor: pointer; }
  .dropdown { position: absolute; top: 52px; right: 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 300px; padding: 8px 0; box-shadow: var(--shadow); display: none; z-index: 200; }
  .dropdown.show { display: block; }
  .dropdown-item { padding: 10px 18px; cursor: pointer; transition: 0.15s; display: flex; justify-content: space-between; font-size: 0.95rem; align-items: center; }
  .dropdown-item:hover { background: var(--card2); }
  .dropdown-divider { height: 1px; background: var(--border); margin: 6px 0; }
  .dropdown-header { padding: 8px 18px 4px; font-size: 0.72rem; color: var(--muted); text-transform: uppercase; font-weight: 600; }

  .tabs { display: flex; gap: 4px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
  .tab { padding: 9px 16px; border-radius: 10px; background: var(--card); color: var(--muted); cursor: pointer; font-weight: 500; font-size: 0.9rem; white-space: nowrap; transition: 0.2s; border: 1px solid var(--border); font-family: inherit; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: white; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .search-box { flex: 1; min-width: 220px; }
  .search-box input { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 0.95rem; outline: none; font-family: inherit; }

  .create-post { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
  .create-post.collapsed .create-body { display: none; }
  .create-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .create-body { margin-top: 16px; }
  .create-body input, .create-body textarea, .create-body select { width: 100%; padding: 11px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--card2); color: var(--text); font-family: inherit; font-size: 0.95rem; outline: none; margin-bottom: 10px; }
  .create-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .create-row input, .create-row select { flex: 1; min-width: 140px; }
  .create-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .char-count { font-size: 0.8rem; color: var(--muted); }

  .post { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
  .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .post-header .avatar { width: 38px; height: 38px; font-size: 0.95rem; }
  .post-meta { flex: 1; min-width: 0; }
  .post-author { font-weight: 600; font-size: 0.95rem; cursor: pointer; }
  .post-time { font-size: 0.78rem; color: var(--muted); }
  .post-summary { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--card2); border-radius: 9px; padding: 10px 12px; margin-top: 8px; border: 1px solid var(--border); }
  .tag-hash { color: #74b9ff; font-weight: 600; }
  .tag-user { color: var(--accent2); font-weight: 600; cursor: pointer; }
  .tag-id { background: var(--border); color: var(--muted); padding: 2px 8px; border-radius: 6px; font-size: 0.76rem; font-family: monospace; }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius); }
  .empty-title { font-size: 1.1rem; margin-bottom: 6px; color: var(--text); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(4px); }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 26px 24px; position: relative; }
  .modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; }

  /* ЧАТ */
  #chat-modal .modal { max-width: 820px; padding: 0; overflow: hidden; display: flex; flex-direction: column; height: 85vh; }
  .chat-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 22px; border-bottom: 1px solid var(--border); }
  .chat-body { flex: 1; display: flex; min-height: 0; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 4px; }
  .chat-sidebar { width: 220px; border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; background: var(--card2); }
  .chat-user-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; }
  .chat-user-item:hover { background: var(--card); }
  .chat-user-item .avatar { width: 28px; height: 28px; font-size: 0.75rem; }
  
  .chat-message { display: flex; gap: 10px; padding: 6px 0; position: relative; }
  .chat-message.mine { flex-direction: row-reverse; }
  .chat-message .avatar { width: 36px; height: 36px; font-size: 0.85rem; flex-shrink: 0; }
  .chat-message-body { max-width: 70%; min-width: 0; }
  .chat-message.mine .chat-message-body { align-items: flex-end; display: flex; flex-direction: column; }
  .chat-message-head { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; font-size: 0.78rem; }
  .chat-message.mine .chat-message-head { flex-direction: row-reverse; }
  .chat-message-author { font-weight: 600; color: var(--accent2); cursor: pointer; font-size: 0.85rem; }
  .chat-message-time { color: var(--muted); font-size: 0.72rem; }
  .chat-message-bubble { background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; font-size: 0.9rem; word-break: break-word; white-space: pre-wrap; }
  .chat-message.mine .chat-message-bubble { background: var(--accent); border-color: var(--accent); color: white; }
  .chat-input-area { border-top: 1px solid var(--border); padding: 12px 18px; background: var(--card); }
  .chat-input-row { display: flex; gap: 10px; align-items: flex-end; }
  .chat-input-row textarea { flex: 1; min-height: 40px; max-height: 120px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card2); color: var(--text); font-size: 0.95rem; font-family: inherit; resize: none; outline: none; }
  
  .chat-day-divider { text-align: center; font-size: 0.72rem; color: var(--muted); margin: 14px 0 8px; position: relative; }
  .chat-day-divider::before, .chat-day-divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: var(--border); }
  .chat-day-divider::before { left: 0; } .chat-day-divider::after { right: 0; }
  .chat-day-divider span { background: var(--card); padding: 0 10px; position: relative; z-index: 2; }

  @media (max-width: 700px) {
    .chat-sidebar { display: none; }
    .chat-message-body { max-width: 85%; }
    #chat-modal .modal { height: 92vh; }
    .form-row { grid-template-columns: 1fr; }
    .username { display: none; }
  }
</style>
</head>
<body>

<div id="toast-container"></div>

<!-- АВТОРИЗАЦИЯ -->
<div id="auth-screen">
  <div class="auth-box">
    <h1>dox•Tox</h1>
    <p class="auth-sub">Обмен сообщениями через Telegram</p>

    <div class="auth-tabs">
      <button class="active" id="tab-login" onclick="switchTab('login')">Вход</button>
      <button id="tab-register" onclick="switchTab('register')">Регистрация</button>
    </div>

    <div id="login-form">
      <div class="form-group">
        <label>Имя</label>
        <input type="text" id="login-name" placeholder="Введите имя">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="login-pass" placeholder="Введите пароль">
      </div>
      <button class="btn btn-block" onclick="doLogin()">Войти</button>
      <div class="error-msg" id="login-error"></div>
    </div>

    <div id="register-form" style="display:none;">
      <div class="form-group">
        <label>Имя</label>
        <input type="text" id="reg-name" placeholder="Придумайте имя">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="reg-pass" placeholder="Минимум 8 символов">
        </div>
        <div class="form-group">
          <label>Повторите</label>
          <input type="password" id="reg-pass2" placeholder="Повтор">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Telegram ID</label>
          <input type="number" id="reg-tg" placeholder="123456789">
        </div>
        <div class="form-group">
          <label>Город</label>
          <input type="text" id="reg-city" placeholder="Город">
        </div>
      </div>
      <button class="btn btn-block" onclick="doRegister()">Зарегистрироваться</button>
      <div class="error-msg" id="reg-error"></div>
    </div>
  </div>
</div>

<!-- ФОРУМ -->
<div id="forum-screen">
  <header>
    <div class="logo" onclick="switchTabFeed('all')">Форум</div>
    <div class="header-right">
      <button class="icon-btn" onclick="openChat()">Чат</button>
      <button class="icon-btn" onclick="toggleTheme()" id="theme-btn">Тема</button>
      <div class="avatar" id="current-avatar" onclick="toggleMenu(event)">?</div>
      <span class="username" id="current-user" onclick="toggleMenu(event)">Гость</span>
      
      <div class="dropdown" id="dropdown">
        <div class="dropdown-header">Аккаунт</div>
        <div class="dropdown-item" onclick="showProfile(localStorage.getItem('doxtox_user'))"><span>Мой профиль</span></div>
        <div class="dropdown-divider"></div>
        <div class="dropdown-item" style="color:var(--danger);" onclick="logout()"><span>Выйти</span></div>
      </div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="all" onclick="switchTabFeed('all')">Все</button>
    <button class="tab" data-tab="users" onclick="switchTabFeed('users')">Пользователи</button>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Поиск..." oninput="renderFeed()">
    </div>
  </div>

  <div id="feed"></div>
</div>

<!-- МОДАЛКА ЧАТА -->
<div class="modal-overlay" id="chat-modal" onclick="closeModalOnBg(event,'chat-modal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="chat-header">
      <div><h2>Общий чат</h2><div id="chat-online-count" style="font-size:0.8rem; color:var(--muted);">Онлайн</div></div>
      <button class="modal-close" onclick="closeChat()">×</button>
    </div>
    <div class="chat-body">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-sidebar"><h4>Участники</h4><div id="chat-users-list"></div></div>
    </div>
    <div class="chat-input-area">
      <div class="chat-input-row">
        <textarea id="chat-input" placeholder="Написать сообщение..." rows="1"></textarea>
        <button class="btn btn-success" onclick="sendChatMessage()">Отправить</button>
      </div>
    </div>
  </div>
</div>

<!-- МОДАЛКА ПРОФИЛЯ -->
<div class="modal-overlay" id="profile-modal" onclick="closeModalOnBg(event,'profile-modal')">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal('profile-modal')">×</button>
    <div id="profile-content"></div>
  </div>
</div>

<script>
const API = 'https://dox-tox.onrender.com';

/* ============ SAFE STORAGE ============ */
const STORAGE = {
  session: 'doxtox_user',
  tg: 'doxtox_tg',
  posts: 'forum_posts_db',
  chat: 'forum_chat_db',
  users: 'forum_users_db'
};

function ls_get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } }
function ls_set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
function ls_del(k) { localStorage.removeItem(k); }

function getUsers() { return ls_get(STORAGE.users, {}); }
function saveUsers(u) { ls_set(STORAGE.users, u); }
function getPosts() { return ls_get(STORAGE.posts, []); }
function savePosts(p) { ls_set(STORAGE.posts, p); }
function getChat() { return ls_get(STORAGE.chat, []); }
function saveChat(c) { ls_set(STORAGE.chat, c); }

/* ============ UI SAFE ============ */
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text == null ? '' : String(text);
  return div.innerHTML;
}

function toast(title, msg, type) {
  type = type || 'info';
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = '<div class="toast-title">' + escapeHtml(title) + '</div>' + (msg ? '<div class="toast-msg">' + escapeHtml(msg) + '</div>' : '');
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => { t.style.animation = 'slideOutRight 0.3s forwards'; setTimeout(() => t.remove(), 300); }, 3000);
}

function showError(id, msg) {
  const el = document.getElementById(id);
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function closeModalOnBg(e, id) { if (e.target.id === id) closeModal(id); }

function isOnline(username) {
  if (!username || typeof username !== 'string') return false;
  const users = getUsers();
  const u = users[username.toLowerCase()];
  if (!u) return false;
  return Date.now() - (u.lastSeen || 0) < 5 * 60 * 1000;
}

/* ============ AUTH ============ */
function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
}

async function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const pass = document.getElementById('reg-pass').value;
  const pass2 = document.getElementById('reg-pass2').value;
  const tgId = parseInt(document.getElementById('reg-tg').value);
  const city = document.getElementById('reg-city').value.trim();

  if (!name || name.length < 2) return showError('reg-error', 'Имя минимум 2 символа');
  if (pass.length < 8) return showError('reg-error', 'Пароль минимум 8 символов');
  if (pass !== pass2) return showError('reg-error', 'Пароли не совпадают');
  if (!tgId) return showError('reg-error', 'Нужен Telegram ID');

  try {
    const res = await fetch(API + '/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: name, password: pass, tg_id: tgId, city })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Ошибка сервера');

    ls_set(STORAGE.session, name);
    ls_set(STORAGE.tg, tgId);
    
    const users = getUsers();
    users[name.toLowerCase()] = { name: name, city: city || '—', lastSeen: Date.now() };
    saveUsers(users);

    toast('Успех', 'Добро пожаловать, ' + name, 'success');
    showForum(name);
  } catch (e) {
    showError('reg-error', 'Ошибка: ' + e.message);
  }
}

async function doLogin() {
  const name = document.getElementById('login-name').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!name || !pass) return showError('login-error', 'Заполни поля');

  try {
    const res = await fetch(API + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: name, password: pass })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Неверный логин или пароль');

    ls_set(STORAGE.session, data.username);
    ls_set(STORAGE.tg, data.tg_id);
    
    const users = getUsers();
    if (!users[data.username.toLowerCase()]) {
      users[data.username.toLowerCase()] = { name: data.username, city: data.city || '—', lastSeen: Date.now() };
      saveUsers(users);
    }

    toast('Успех', 'Привет, ' + data.username, 'success');
    showForum(data.username);
  } catch (e) {
    showError('login-error', 'Ошибка: ' + e.message);
  }
}

function logout() {
  if (!confirm('Выйти?')) return;
  ls_del(STORAGE.session);
  ls_del(STORAGE.tg);
  document.getElementById('forum-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}

/* ============ FORUM ============ */
function showForum(username) {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('forum-screen').style.display = 'block';

  document.getElementById('current-user').textContent = username;
  document.getElementById('current-avatar').textContent = username[0] ? username[0].toUpperCase() : '?';

  renderFeed();
}

let currentTab = 'all';
function switchTabFeed(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderFeed();
}

function renderFeed() {
  const feed = document.getElementById('feed');
  
  if (currentTab === 'users') {
    const users = getUsers();
    feed.innerHTML = Object.values(users).map(u => `
      <div class="post">
        <div class="post-header">
          <div class="avatar">${(u.name && u.name[0]) ? u.name[0].toUpperCase() : '?'}</div>
          <div class="post-meta">
            <div class="post-author">${escapeHtml(u.name)}</div>
            <div class="post-time">${escapeHtml(u.city || '—')}</div>
          </div>
        </div>
      </div>
    `).join('');
    return;
  }

  // Заглушка для ленты (если нет постов)
  feed.innerHTML = '<div class="empty"><div class="empty-title">Пока нет публикаций</div></div>';
}

function toggleMenu(e) {
  if (e) e.stopPropagation();
  document.getElementById('dropdown').classList.toggle('show');
}
document.addEventListener('click', () => document.getElementById('dropdown').classList.remove('show'));

/* ============ CHAT ============ */
let chatInterval = null;

function openChat() {
  if (!ls_get(STORAGE.session)) return;
  openModal('chat-modal');
  loadChatFromServer();
  if (chatInterval) clearInterval(chatInterval);
  chatInterval = setInterval(loadChatFromServer, 3000); // Обновление каждые 3 сек
  setTimeout(() => document.getElementById('chat-input').focus(), 150);
}

function closeChat() {
  closeModal('chat-modal');
  if (chatInterval) clearInterval(chatInterval);
}

async function loadChatFromServer() {
  try {
    const res = await fetch(API + '/messages?user=all&with_user=all');
    if (!res.ok) return;
    const msgs = await res.json();
    
    if (msgs && msgs.length > 0) {
      saveChat(msgs);
      renderChat();
    }
  } catch (e) {
    renderChat(); // Показываем кэш если сервер спит
  }
}

function renderChat() {
  const chat = getChat();
  const session = ls_get(STORAGE.session);
  const container = document.getElementById('chat-messages');
  if (!container) return;

  if (chat.length === 0) {
    container.innerHTML = '<div style="text-align:center; color:var(--muted); padding:20px;">Нет сообщений</div>';
    return;
  }

  let lastDay = '';
  let html = '';

  chat.forEach(m => {
    const timeVal = typeof m.time === 'number' ? m.time : m.created_at * 1000;
    let d = new Date(timeVal);
    if (isNaN(d.getTime())) d = new Date();

    const dayKey = d.toDateString();
    if (dayKey !== lastDay) {
      html += `<div class="chat-day-divider"><span>${d.toLocaleDateString('ru-RU')}</span></div>`;
      lastDay = dayKey;
    }

    const isMine = m.author === session || m.from_username === session;
    const authorName = m.author || m.from_username || 'User';
    const timeStr = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

    html += `
      <div class="chat-message ${isMine ? 'mine' : ''}">
        <div class="avatar">${authorName[0].toUpperCase()}</div>
        <div class="chat-message-body">
          <div class="chat-message-head">
            <span class="chat-message-author">${escapeHtml(authorName)}</span>
            <span class="chat-message-time">${timeStr}</span>
          </div>
          <div class="chat-message-bubble">${escapeHtml(m.text)}</div>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

async function sendChatMessage() {
  const inp = document.getElementById('chat-input');
  const text = inp.value.trim();
  const session = ls_get(STORAGE.session);
  if (!text || !session) return;

  inp.value = '';

  // 1. Добавляем в локальный кэш (чтобы сразу увидеть)
  const chat = getChat();
  chat.push({
    id: Date.now(),
    author: session,
    text: text,
    time: Date.now()
  });
  saveChat(chat);
  renderChat();

  // 2. Отправляем на сервер (чтобы увидели другие)
  try {
    await fetch(API + '/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        from_username: session,
        to_username: 'all', // Отправляем в общий чат
        text: text
      })
    });
  } catch (e) {
    toast('Ошибка', 'Сообщение не ушло на сервер', 'warn');
  }
}

/* ============ PROFILE ============ */
function showProfile(username) {
  if (!username) return;
  const users = getUsers();
  const u = users[username.toLowerCase()] || { name: username, city: '—' };
  
  document.getElementById('profile-content').innerHTML = `
    <div style="text-align:center; padding:20px;">
      <div class="avatar" style="width:80px;height:80px;margin:0 auto 15px; font-size:2rem;">${u.name[0].toUpperCase()}</div>
      <h2 style="margin-bottom:5px;">${escapeHtml(u.name)}</h2>
      <p style="color:var(--muted);">${escapeHtml(u.city)}</p>
    </div>
  `;
  openModal('profile-modal');
}

/* ============ THEME ============ */
function toggleTheme() {
  document.body.classList.toggle('light');
  const isLight = document.body.classList.contains('light');
  localStorage.setItem('forum_theme', isLight ? 'light' : 'dark');
  document.getElementById('theme-btn').textContent = isLight ? 'Тёмная' : 'Светлая';
}

window.onload = function() {
  if (localStorage.getItem('forum_theme') === 'light') {
    document.body.classList.add('light');
    document.getElementById('theme-btn').textContent = 'Тёмная';
  }
  const session = ls_get(STORAGE.session);
  if (session) {
    showForum(session);
  }
};

// Enter в чате
document.addEventListener('DOMContentLoaded', () => {
  const ci = document.getElementById('chat-input');
  if (ci) {
    ci.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
    });
  }
  document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('reg-pass2').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
});
</script>
