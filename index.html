<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6c5ce7">
<title>Форум • Информация о пользователях</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card2: #12151f;
    --border: #2a2e3b;
    --accent: #6c5ce7;
    --accent2: #a29bfe;
    --text: #e8eaf0;
    --muted: #9ba3b5;
    --success: #00b894;
    --danger: #ff6b6b;
    --warn: #fdcb6e;
    --radius: 14px;
    --shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  body.light {
    --bg: #f0f2f7;
    --card: #ffffff;
    --card2: #f7f8fc;
    --border: #e1e5ee;
    --text: #1a1d27;
    --muted: #6b7280;
    --shadow: 0 10px 30px rgba(0,0,0,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    transition: background 0.3s, color 0.3s;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--card2); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  #progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    width: 0%;
    background: var(--accent);
    z-index: 9999;
    transition: width 0.15s;
  }

  #toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9998;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
  }

  .toast {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    padding: 14px 18px;
    min-width: 260px;
    max-width: 360px;
    box-shadow: var(--shadow);
    animation: slideInRight 0.3s ease;
    pointer-events: auto;
  }

  .toast.success { border-left-color: var(--success); }
  .toast.error { border-left-color: var(--danger); }
  .toast.warn { border-left-color: var(--warn); }

  .toast-title { font-weight: 600; margin-bottom: 4px; font-size: 0.95rem; }
  .toast-msg { font-size: 0.85rem; color: var(--muted); }

  @keyframes slideInRight {
    from { transform: translateX(120%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  @keyframes slideOutRight {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(120%); opacity: 0; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #scroll-top {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    border: none;
    font-size: 1.3rem;
    cursor: pointer;
    box-shadow: var(--shadow);
    display: none;
    z-index: 900;
    transition: 0.2s;
  }

  #scroll-top:hover { transform: translateY(-3px); background: #5a4bd1; }
  #scroll-top.show { display: block; }

  /* АВТОРИЗАЦИЯ */
  #auth-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    background: radial-gradient(ellipse at top, #1e2235 0%, var(--bg) 70%);
  }

  body.light #auth-screen {
    background: radial-gradient(ellipse at top, #e8ebf5 0%, var(--bg) 70%);
  }

  .auth-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 460px;
    padding: 36px 32px;
    box-shadow: var(--shadow);
    animation: slideUp 0.5s ease;
  }

  .auth-box h1 {
    text-align: center;
    font-size: 1.7rem;
    margin-bottom: 8px;
    color: var(--text);
  }

  .auth-sub {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 10px;
  }

  .auth-tabs {
    display: flex;
    gap: 8px;
    margin: 24px 0 20px;
  }

  .auth-tabs button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    font-size: 0.95rem;
    font-family: inherit;
  }

  .auth-tabs button.active {
    background: var(--accent);
    color: white;
  }

  .form-group { margin-bottom: 16px; }

  .form-group label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
  }

  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: border 0.2s;
    font-family: inherit;
  }

  .form-group input:focus,
  .form-group textarea:focus { border-color: var(--accent); }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .btn {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn:hover { background: #5a4bd1; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-block { width: 100%; margin-top: 8px; }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-secondary:hover { background: var(--border); }

  .btn-danger { background: var(--danger); }
  .btn-danger:hover { background: #e55a5a; }

  .btn-success { background: var(--success); }
  .btn-success:hover { background: #00a884; }

  .btn-sm { padding: 6px 12px; font-size: 0.85rem; }

  .error-msg {
    color: var(--danger);
    font-size: 0.85rem;
    margin-top: 10px;
    text-align: center;
    display: none;
  }

  /* ФОРУМ */
  #forum-screen {
    display: none;
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px 16px 80px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 12px 0;
    z-index: 100;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent2);
    cursor: pointer;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1rem;
    cursor: pointer;
    padding: 8px 10px;
    border-radius: 8px;
    transition: 0.2s;
    position: relative;
    font-family: inherit;
    font-weight: 500;
  }

  .icon-btn:hover { background: var(--border); color: var(--text); }

  .icon-btn.active {
    background: var(--accent);
    color: white;
  }

  .badge-dot {
    position: absolute;
    top: 4px;
    right: 4px;
    background: var(--danger);
    color: white;
    border-radius: 10px;
    padding: 1px 6px;
    font-size: 0.7rem;
    font-weight: 700;
    min-width: 16px;
    text-align: center;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.1rem;
    color: white;
    cursor: pointer;
    transition: 0.2s;
    overflow: hidden;
    background-size: cover;
    background-position: center;
    position: relative;
    flex-shrink: 0;
  }

  .avatar:hover { transform: scale(1.05); }

  .avatar.online::after {
    content: '';
    position: absolute;
    bottom: 0; right: 0;
    width: 12px; height: 12px;
    background: var(--success);
    border: 2px solid var(--bg);
    border-radius: 50%;
  }

  .username { font-weight: 600; cursor: pointer; }
  .username:hover { color: var(--accent2); }

  .dropdown {
    position: absolute;
    top: 52px;
    right: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 300px;
    padding: 8px 0;
    box-shadow: var(--shadow);
    display: none;
    z-index: 200;
  }

  .dropdown.show { display: block; animation: fadeIn 0.15s; }

  .dropdown-item {
    padding: 10px 18px;
    cursor: pointer;
    transition: 0.15s;
    display: flex;
    justify-content: space-between;
    font-size: 0.95rem;
    align-items: center;
  }

  .dropdown-item:hover { background: var(--card2); }

  .dropdown-item span:last-child {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .dropdown-divider { height: 1px; background: var(--border); margin: 6px 0; }

  .dropdown-header {
    padding: 8px 18px 4px;
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }

  .mini-profile {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
  }

  .mini-profile .avatar { width: 48px; height: 48px; }

  .mini-info { flex: 1; min-width: 0; }
  .mini-name { font-weight: 700; font-size: 1rem; }
  .mini-role { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

  /* Вкладки */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    padding: 9px 16px;
    border-radius: 10px;
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    font-weight: 500;
    font-size: 0.9rem;
    white-space: nowrap;
    transition: 0.2s;
    font-family: inherit;
    border: 1px solid var(--border);
  }

  .tab:hover { color: var(--text); }

  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* Поиск */
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1;
    min-width: 220px;
  }

  .search-box input {
    width: 100%;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: 0.2s;
    font-family: inherit;
  }

  .search-box input:focus { border-color: var(--accent); }

  .sort-select {
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
    cursor: pointer;
    font-family: inherit;
  }

  /* Создание поста */
  .create-post {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    transition: 0.3s;
  }

  .create-post.collapsed .create-body { display: none; }

  .create-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }

  .create-header h3 { font-size: 1rem; }

  .create-body { margin-top: 16px; }

  .create-body input,
  .create-body textarea,
  .create-body select {
    width: 100%;
    padding: 11px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
    transition: 0.2s;
    margin-bottom: 10px;
  }

  .create-body input:focus,
  .create-body textarea:focus { border-color: var(--accent); }

  .create-body textarea {
    min-height: 70px;
    resize: vertical;
  }

  .create-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .create-row input,
  .create-row select { flex: 1; min-width: 140px; }

  .create-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .char-count {
    font-size: 0.8rem;
    color: var(--muted);
  }

  .char-count.warn { color: var(--warn); }
  .char-count.danger { color: var(--danger); }

  /* Пост */
  .post {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 14px;
    transition: 0.2s;
    animation: slideUp 0.3s ease;
  }

  .post:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow);
  }

  .post.pinned { border-color: var(--warn); }

  .pin-label {
    font-size: 0.75rem;
    color: var(--warn);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .post-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .post-header .avatar { width: 38px; height: 38px; font-size: 0.95rem; }

  .post-meta { flex: 1; min-width: 0; }

  .post-author {
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }

  .post-author:hover { color: var(--accent2); }

  .post-time { font-size: 0.78rem; color: var(--muted); }

  .post-menu { position: relative; }

  .post-menu-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 1.1rem;
  }

  .post-menu-btn:hover { background: var(--border); color: var(--text); }

  .post-dropdown {
    position: absolute;
    top: 28px;
    right: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    min-width: 170px;
    padding: 6px 0;
    display: none;
    z-index: 50;
    box-shadow: var(--shadow);
  }

  .post-dropdown.show { display: block; }

  .post-dropdown-item {
    padding: 8px 14px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: 0.15s;
  }

  .post-dropdown-item:hover { background: var(--card2); }
  .post-dropdown-item.danger { color: var(--danger); }

  .post-action-text {
    color: var(--muted);
    font-size: 0.92rem;
    margin-bottom: 6px;
  }

  .post-summary {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    background: var(--card2);
    border-radius: 9px;
    padding: 10px 12px;
    margin-top: 8px;
    border: 1px solid var(--border);
  }

  .post-tags {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    font-size: 0.9rem;
    min-width: 0;
  }

  .tag-hash { color: #74b9ff; font-weight: 600; }
  .tag-user { color: var(--accent2); font-weight: 600; cursor: pointer; }
  .tag-user:hover { text-decoration: underline; }
  .tag-id {
    background: var(--border);
    color: var(--muted);
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.76rem;
    font-family: 'Consolas', monospace;
  }
  .tag-reason { color: var(--warn); font-weight: 500; }
  .tag-category {
    background: var(--accent);
    color: white;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .btn-plus {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--accent2);
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
    flex-shrink: 0;
  }

  .btn-plus:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .btn-plus.open {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    transform: rotate(45deg);
  }

  .full-info {
    display: none;
    margin-top: 12px;
    padding: 14px 16px;
    background: var(--card2);
    border-radius: 10px;
    border-left: 3px solid var(--accent);
  }

  .full-info.open { display: block; animation: slideDown 0.25s ease; }

  .full-info-title {
    font-size: 0.75rem;
    color: var(--accent2);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 10px;
    font-weight: 700;
  }

  .full-info-block { margin-bottom: 10px; font-size: 0.92rem; }
  .full-info-block:last-child { margin-bottom: 0; }

  .full-info-label {
    color: var(--muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 3px;
    font-weight: 600;
  }

  .full-info-value {
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .full-info-value a { color: var(--accent2); }
  .full-info-value strong { font-weight: 700; }
  .full-info-value em { font-style: italic; }
  .full-info-value code {
    background: var(--card);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Consolas', monospace;
    font-size: 0.85em;
  }

  .spoiler {
    background: var(--card);
    color: var(--card);
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
  }

  .spoiler.revealed { color: var(--text); background: transparent; }

  .post-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .action-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.82rem;
    transition: 0.2s;
    font-family: inherit;
  }

  .action-btn:hover { border-color: var(--accent); color: var(--accent2); }

  .action-btn.liked {
    background: rgba(255, 107, 107, 0.15);
    border-color: #ff6b6b;
    color: #ff6b6b;
  }

  .action-btn.saved {
    background: rgba(253, 203, 110, 0.15);
    border-color: var(--warn);
    color: var(--warn);
  }

  .comments {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: none;
  }

  .comments.open { display: block; }

  .comment {
    padding: 10px 0;
    display: flex;
    gap: 10px;
    animation: fadeIn 0.2s;
    border-bottom: 1px solid var(--border);
  }

  .comment:last-of-type { border-bottom: none; }

  .comment .avatar { width: 30px; height: 30px; font-size: 0.8rem; }

  .comment-body { flex: 1; min-width: 0; }

  .comment-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .comment-author { font-weight: 600; font-size: 0.88rem; }
  .comment-time { font-size: 0.75rem; color: var(--muted); }
  .comment-text { font-size: 0.9rem; color: var(--text); word-break: break-word; }

  .comment-actions {
    display: flex;
    gap: 10px;
    margin-top: 4px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .comment-actions span { cursor: pointer; }
  .comment-actions span:hover { color: var(--accent2); }

  .comment-input {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .comment-input input {
    flex: 1;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
    font-family: inherit;
  }

  .comment-input input:focus { border-color: var(--accent); }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    background: var(--card);
