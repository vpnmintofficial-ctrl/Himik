<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dox•Tox</title>
<style>
  /* Минимальный стиль только для проверки, чтобы ничего не отвлекало */
  body { background: #0f1117; color: #e8eaf0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .box { background: #1a1d27; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #2a2e3b; }
  h2 { text-align: center; margin-bottom: 20px; color: #a29bfe; }
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  button { flex: 1; padding: 10px; background: #2a2e3b; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
  button.active { background: #6c5ce7; }
  input { width: 100%; padding: 12px; margin-bottom: 15px; background: #12151f; border: 1px solid #2a2e3b; color: white; border-radius: 8px; box-sizing: border-box; }
  .btn-submit { width: 100%; padding: 14px; background: #6c5ce7; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
  .btn-submit:hover { background: #5a4bd1; }
  .err { color: #ff6b6b; text-align: center; margin-top: 15px; font-size: 14px; display: none; }
  .ok { color: #00b894; text-align: center; margin-top: 15px; font-size: 14px; display: none; }
</style>
</head>
<body>

<div class="box">
  <h2>dox•Tox</h2>
  
  <div class="tabs">
    <button id="tab-log" class="active" onclick="switchTab('log')">Вход</button>
    <button id="tab-reg" onclick="switchTab('reg')">Регистрация</button>
  </div>

  <!-- ВХОД -->
  <div id="form-log">
    <input type="text" id="log-name" placeholder="Имя">
    <input type="password" id="log-pass" placeholder="Пароль">
    <button class="btn-submit" onclick="doLogin()">Войти</button>
    <div class="err" id="err-log"></div>
    <div class="ok" id="ok-log"></div>
  </div>

  <!-- РЕГИСТРАЦИЯ -->
  <div id="form-reg" style="display:none;">
    <input type="text" id="reg-name" placeholder="Придумайте имя">
    <input type="password" id="reg-pass" placeholder="Пароль (8+ символов)">
    <input type="password" id="reg-pass2" placeholder="Повторите пароль">
    <input type="number" id="reg-tg" placeholder="Telegram ID (например 123456789)">
    <input type="text" id="reg-city" placeholder="Город (необязательно)">
    <button class="btn-submit" onclick="doRegister()">Зарегистрироваться</button>
    <div class="err" id="err-reg"></div>
    <div class="ok" id="ok-reg"></div>
  </div>
</div>

<script>
// Твоя ссылка на Render (без слэша в конце)
const API = 'https://dox-toxx.onrender.com';

function switchTab(tab) {
  document.getElementById('tab-log').classList.toggle('active', tab === 'log');
  document.getElementById('tab-reg').classList.toggle('active', tab === 'reg');
  document.getElementById('form-log').style.display = tab === 'log' ? 'block' : 'none';
  document.getElementById('form-reg').style.display = tab === 'reg' ? 'block' : 'none';
  document.getElementById('err-log').style.display = 'none';
  document.getElementById('err-reg').style.display = 'none';
}

function showMsg(id, msg, isError) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
  if (!isError) {
    el.style.color = '#00b894';
  } else {
    el.style.color = '#ff6b6b';
  }
}

async function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const pass = document.getElementById('reg-pass').value;
  const pass2 = document.getElementById('reg-pass2').value;
  const tgId = document.getElementById('reg-tg').value;
  const city = document.getElementById('reg-city').value.trim();
  const errBox = document.getElementById('err-reg');

  errBox.style.display = 'none';

  if (!name || name.length < 2) return showMsg('err-reg', 'Имя минимум 2 символа', true);
  if (pass.length < 8) return showMsg('err-reg', 'Пароль минимум 8 символов', true);
  if (pass !== pass2) return showMsg('err-reg', 'Пароли не совпадают', true);
  if (!tgId) return showMsg('err-reg', 'Введите Telegram ID', true);

  // Показываем загрузку
  showMsg('err-reg', 'Отправка на сервер... (может занять до 50 сек)', false);

  try {
    const res = await fetch(API + '/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        username: name, 
        password: pass, 
        tg_id: parseInt(tgId), 
        city: city 
      })
    });
    
    const data = await res.json();
    
    if (!res.ok) {
      throw new Error(data.detail || 'Ошибка сервера');
    }

    showMsg('ok-reg', 'Успех! Теперь войдите.', false);
    setTimeout(() => switchTab('log'), 1500);
    
  } catch (e) {
    showMsg('err-reg', 'Ошибка: ' + e.message, true);
  }
}

async function doLogin() {
  const name = document.getElementById('log-name').value.trim();
  const pass = document.getElementById('log-pass').value;
  const errBox = document.getElementById('err-log');

  errBox.style.display = 'none';

  if (!name || !pass) return showMsg('err-log', 'Заполните оба поля', true);

  showMsg('err-log', 'Проверка...', false);

  try {
    const res = await fetch(API + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: name, password: pass })
    });
    
    const data = await res.json();
    
    if (!res.ok) {
      throw new Error(data.detail || 'Неверное имя или пароль');
    }

    showMsg('ok-log', 'Успешный вход!', false);
    localStorage.setItem('doxtox_user', JSON.stringify(data.username));
    localStorage.setItem('doxtox_tg', JSON.stringify(data.tg_id));
    
    // Тут будет переход на форум (после того как мы проверим, что форма работает)
    // window.location.href = 'forum.html'; 
    
  } catch (e) {
    showMsg('err-log', 'Ошибка: ' + e.message, true);
  }
}
</script>
</body>
</html>
